[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.94.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Eduardo Lacerda"]
repository = "https://github.com/sacridini/terraflux"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cmake = "0.1"
cxx = "1"
cxx-build = "1"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
weezl = "0.1"

# Debug builds keep line tables only (backtraces with their lines), and the dependencies none: the debug
# information of the many test programs was most of target/debug's size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release builds keep line tables only too (backtraces with their lines): full debug information made a PDB of
# about 110 MB for every program, test programs included.
[profile.release]
debug = "line-tables-only"
