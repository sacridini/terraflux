[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Eduardo Lacerda"]
repository = "https://github.com/sacridini/terraflux"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cmake = "0.1"
cxx = "1"
cxx-build = "1"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1"
weezl = "0.1"

[profile.release]
debug = 1
