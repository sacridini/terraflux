[[nodes]]
id = "rng"
op = "rng.numpy"
inputs = { seed = 1 }

[[nodes]]
id = "simulation"
op = "control.repeat"
inputs = { times = 2, landscape = "start.map" }

[nodes.body]
carry = { landscape = "allocate.landscape" }
collect = { maps = "allocate.landscape", info = "allocate.info" }

[[nodes.body.nodes]]
id = "allocate"
op = "molusce.step"
inputs = { landscape = "@landscape", total = "weights.total", rng = "rng.rng", step = "@step" }
params = { classes = [1, 2, 3, 4, 5], counts = [{ from = 1, to = 1, cells = 4160 }, { from = 1, to = 2, cells = 126 }, { from = 1, to = 3, cells = 320 }, { from = 1, to = 4, cells = 116 }, { from = 1, to = 5, cells = 1 }, { from = 2, to = 1, cells = 0 }, { from = 2, to = 2, cells = 1140 }, { from = 2, to = 3, cells = 18 }, { from = 2, to = 4, cells = 0 }, { from = 2, to = 5, cells = 0 }, { from = 3, to = 1, cells = 0 }, { from = 3, to = 2, cells = 77 }, { from = 3, to = 3, cells = 745 }, { from = 3, to = 4, cells = 16 }, { from = 3, to = 5, cells = 1 }, { from = 4, to = 1, cells = 0 }, { from = 4, to = 2, cells = 61 }, { from = 4, to = 3, cells = 7 }, { from = 4, to = 4, cells = 156 }, { from = 4, to = 5, cells = 0 }, { from = 5, to = 1, cells = 0 }, { from = 5, to = 2, cells = 0 }, { from = 5, to = 3, cells = 0 }, { from = 5, to = 4, cells = 0 }, { from = 5, to = 5, cells = 282 }] }

[outputs.maps]
from = "simulation.maps"

[outputs.info]
