  /tutorials/habitat-networks/habitat-networks-in-python/: /tutorials/habitat-networks/connectivity-as-a-graph/#in-python
  /tutorials/surface-metrics/surface-texture-in-python/: /tutorials/surface-metrics/surface-texture/#in-python
  /tutorials/distance-restoration/distance-restoration-in-python/: /tutorials/distance-restoration/distance-to-habitat/#in-python
