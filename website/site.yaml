  /tutorials/neutral-landscapes/neutral-landscapes-in-python/: /tutorials/neutral-landscapes/neutral-landscape-models/#every-generator-in-python
  /tutorials/grid-distances/grid-routes-in-python/: /tutorials/grid-distances/cost-distance/#in-python
  /tutorials/large-data/large-data-in-python/: /tutorials/large-data/batch-processing/#in-python
  /tutorials/biodiversity/biodiversity-in-python/: /tutorials/biodiversity/richness-and-endemism/#in-python
  /tutorials/landscape-metrics/landscape-metrics-in-python/: /tutorials/landscape-metrics/what-are-landscape-metrics/#in-python
