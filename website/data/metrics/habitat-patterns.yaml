  - id: spa_islet
    name: SPA islet
    level: class
    theme: SPA classes
    unit: "% of the mapped area, % of the habitat"
    range: "0 to 100 %"
    what: |
      The habitat objects without core (variant 6 only): too small to hold a cell whose whole 3 x 3 neighbourhood is
      habitat.
    use: |
      Variant 5 puts these cells in the margin.
    formula: 'P_{islet} = 100 \, \frac{N_{islet}}{N_{fg}}'
    symbols:
      'N_{islet}': the cells coded 9
      'N_{fg}': the habitat cells
    python: 'tf.spa(forest, variant=6).stats.set_index("class").loc["Islet", ["pct_data", "pct_fg"]]'
