    level: class
    theme: SPA classes
    unit: "% of the mapped area, % of the habitat"
    range: "0 to 100 %"
    what: |
      The one-cell rim around the holes inside the core (variants 5 and 6).
    use: |
      In variant 3 these cells are part of the margin.
    formula: 'P_{perf} = 100 \, \frac{N_{perf}}{N_{fg}}'
    symbols:
