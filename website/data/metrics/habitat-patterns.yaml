  # impl: extern/terraflux-py/src/terraflux/spa.py:44-51
  - id: spa_margin
    name: SPA margin (small linear features in SPA2)
    level: class
    theme: SPA classes
    unit: "% of the mapped area, % of the habitat"
    range: "0 to 100 %"
    aliases: [SLF, small linear features, margin]
    what: |
      The habitat left once the other classes are taken out: the thin or small features that an opening of 3 x 3 cells
      removes. In SPA3 it is all the habitat that is not core, in SPA5 what is not core, edge or perforation, in SPA6 also
      not islet; SPA2 calls it small linear features (SLF).
    use: |
      Its meaning changes with the variant (on the example, 24.9 % of the habitat in SPA3, 9.2 % in SPA5, 6.0 % in SPA6),
      so compare margins only within one variant.
    formula: 'P_{margin} = 100 \, \frac{N_{margin}}{N_{fg}}'
    symbols:
      'N_{margin}': the cells coded 1
      'N_{fg}': the habitat cells; the classes of one variant add up to it
    python: 'tf.spa(forest, variant=5).stats.set_index("class").loc["Margin", ["pct_data", "pct_fg"]]'
    operator: landscape.spa
    setting: variant = 5
    api: terraflux.spa.spa

  # impl: extern/terraflux-py/src/terraflux/spa.py:144-150
  - id: spa_core_opening
    name: SPA core-opening
    level: class
    theme: SPA classes
    unit: cells
    range: "0 or more"
    what: |
      The background cells in the holes of the core (variants 3, 5 and 6); the rest of the background is *other
      background*. They enter the porosity.
    use: |
      The area of the holes inside the habitat, in cells: multiply by the cell's area for hectares.
    formula: 'N_{co} = \#\{\text{cells coded } 100\}'
    symbols:
      'N_{co}': the cells coded 100, reported as Core-Opening
    python: 'tf.spa(forest, variant=5).areas["core_opening"]'
    operator: landscape.spa
    setting: variant = 5
    api: terraflux.spa.spa

  # impl: extern/terraflux-py/src/terraflux/spa.py:147-152
  - id: spa_porosity
    name: SPA porosity
    level: landscape
    theme: SPA classes
    unit: "%"
    range: "0 to 100"
    aliases: [porosity]
    what: |
      The share of the contiguous habitat and its inner openings that is opening: how perforated the habitat is.
    use: |
      Compare porosity only between maps run with the same SPA variant (on the example, 1.42 % in SPA5 and SPA6, 1.71 % in
      SPA3). SPA2 does not report it.
    formula: '\mathrm{Por} = 100 \, \frac{O}{C + O}'
    symbols:
      'C': the contiguous habitat cells (core, edge and perforation; in SPA3, which has no edge class, the core only)
      'O': the core-opening cells (code 100)
    python: 'tf.spa(forest, variant=5).porosity'
    operator: landscape.spa
    setting: variant = 5
    api: terraflux.spa.spa
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:208-215
  - id: parc_count
    name: Number of parcels
    level: class
    theme: parcellation
    unit: count
    range: "1 or more"
    aliases: [parcellation, number of patches]
    what: |
      The number of parcels of each class: the connected regions of touching cells of the same class (8-connectivity by
      default). Every class of the map counts, the background too; the `global_stats` of the result have the total of the
      whole map.
    use: |
      The count depends on the connectivity rule and on the resolution: 4-connectivity splits parcels that touch only at a
      corner, and a finer map sees more small ones.
    formula: 'n_c = \#\{\text{parcels of class } c\}'
    symbols:
      'n_c': the number of parcels of class \(c\), a parcel being a largest set of cells of \(c\) that touch by a side (`connectivity=4`) or by a side or a corner (8); class 0 (missing) is left out
    python: 'tf.parcellation(forest).stats[["Class", "Count"]]'
    operator: landscape.parcellation
    setting: connectivity = 8
    api: terraflux.morphology.parcellation

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:222; 245
  - id: parc_aps
    name: Average parcel size (APS)
    level: class
    theme: parcellation
    unit: cells
    range: "more than 0"
    aliases: [APS, mean patch size]
    what: |
      The mean area of the parcels of a class, or of all the parcels of the map.
    use: |
      An arithmetic mean: a few very large parcels among many small ones give a middle value that describes neither.
      The area-weighted size (AWAPS) is closer to what a cell of the class lies in.
    formula:
      - 'APS_c = \frac{A_c}{n_c}'
      - 'APS = \frac{A}{n}'
    symbols:
      'A_c': the area of class \(c\), in cells
      'n_c': the number of parcels of class \(c\)
      'A': the data area, the cells that are not missing
      'n': the number of parcels of all classes
    python: 'tf.parcellation(forest).stats[["Class", "APS"]]'
    operator: landscape.parcellation
    api: terraflux.morphology.parcellation

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:223; 256
  - id: parc_awaps
    name: Area-weighted average parcel size (AWAPS)
    level: class
    theme: parcellation
    unit: cells
    range: "more than 0"
    aliases: [AWAPS, area-weighted mean patch size]
    what: |
      The size of the parcel that a cell of the class, picked at random, belongs to: the mean parcel size when each
      parcel counts in proportion to its area.
    use: |
      Closer than APS to what an organism living in the class meets. For the whole map the divisor is the data area and
      the sum runs over all the parcels.
    formula: 'AWAPS_c = \frac{\sum_i a_i^2}{A_c}'
    symbols:
      'a_i': the area of parcel \(i\) of class \(c\), in cells
      'A_c': the area of class \(c\), \(\sum_i a_i\)
    python: 'tf.parcellation(forest).stats[["Class", "AWAPS"]]'
    operator: landscape.parcellation
    api: terraflux.morphology.parcellation

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:224
  - id: parc_awaps_data
    name: Effective mesh size of a class (AWAPS over the data area)
    level: class
    theme: parcellation
    unit: cells
    range: "more than 0, at most the data area"
    aliases: [effective mesh size, m_eff, MESH]
    what: |
      The sum of the squared areas of a class's parcels divided by the area of the whole map: Jaeger's effective mesh size
      of the class, in cells (the `AWAPS/data` column).
    use: |
      The values of the classes add up to the AWAPS of the whole map. Multiply by the cell's area for hectares.
    formula: 'AWAPS^{data}_c = \frac{\sum_i a_i^2}{A}'
    symbols:
      'a_i': the area of parcel \(i\) of class \(c\), in cells
      'A': the data area, the cells of the map that are not missing
    python: 'tf.parcellation(forest).stats[["Class", "AWAPS/data"]]'
    operator: landscape.parcellation
    api: terraflux.morphology.parcellation
    refs:
      - "Jaeger, J. A. G. (2000). Landscape division, splitting index, and effective mesh size: new measures of landscape fragmentation. *Landscape Ecology*, 15(2), 115-130. https://doi.org/10.1023/A:1008129329289"

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:226-231; 257
  - id: parc_division
    name: Division index
    level: class
    theme: parcellation
    unit: probability
    range: "0 to less than 1"
    aliases: [DIVISION, landscape division]
    what: |
      The chance that two cells of a class, picked at random, fall in different parcels. In the class table it is computed
      within the class (the divisor is the class's area); the whole map's value uses the data area.
    use: |
      0 for a single parcel, close to 1 for many small ones. Jaeger's division of a class divides by the whole landscape
      instead, so the two differ for any class that does not cover the map.
    formula: 'D_c = 1 - \sum_i \left(\frac{a_i}{A_c}\right)^2'
    symbols:
      'a_i': the area of parcel \(i\) of class \(c\)
      'A_c': the area of class \(c\); for the whole map, the data area \(A\)
    python: 'tf.parcellation(forest).stats[["Class", "DIVISION"]]'
    operator: landscape.parcellation
    api: terraflux.morphology.parcellation
    refs:
      - "Jaeger, J. A. G. (2000). Landscape division, splitting index, and effective mesh size: new measures of landscape fragmentation. *Landscape Ecology*, 15(2), 115-130. https://doi.org/10.1023/A:1008129329289"

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:102-103; 233-236
  - id: parc_parc
    name: Degree of parcellation (PARC)
    level: class
    theme: parcellation
    unit: "%"
    range: "0 to 100"
    aliases: [PARC, logarithmic parcellation index]
    what: |
      The logarithm of the inverse of the sum of the squared shares of the parcels, scaled to 0-100, with 100 reached when
      that sum falls to one in a million. It spreads out the low end of the division index, and so tells apart landscapes
      that are almost undivided.
    use: |
      The `PARC[%]` column. Use it to compare the division of maps of different sizes or resolutions, where the division
      index crowds near 0 or 1.
    formula: 'PARC = 100 \, \frac{\min\left(-\ln S,\; -\ln 10^{-6}\right)}{-\ln 10^{-6}}, \qquad S = \sum_i \left(\frac{a_i}{A_c}\right)^2'
    symbols:
      'a_i': the area of parcel \(i\) of class \(c\)
      'A_c': the area of class \(c\); for the whole map, the data area
      '-\ln 10^{-6}': about 13.82, the value of \(-\ln S\) that gives 100 %
    python: 'tf.parcellation(forest).stats[["Class", "PARC[%]"]]'
    operator: landscape.parcellation
    api: terraflux.morphology.parcellation
    refs:
      - "Jaeger, J. A. G. (2000). Landscape division, splitting index, and effective mesh size: new measures of landscape fragmentation. *Landscape Ecology*, 15(2), 115-130. https://doi.org/10.1023/A:1008129329289"

  # impl: extern/terraflux-py/src/cpp/gtb/morphology.cpp:440-523
  - id: contortion
    name: Contortion of habitat objects
    level: patch
    theme: shape
    unit: number of boundary runs
    range: "2 or more"
    aliases: [contortion, convolution of the outline]
    what: |
      How contorted the outline of each habitat object is: the number of straight runs of its boundary in x and in y, less
      a fixed offset. Compact objects score low, elongated or branching ones high.
    use: |
      The value depends on the grid and the resolution, so compare objects of the same map. The output map holds
      \(K + 1\) on each object (0 missing, 1 background, 2 the objects left out: smaller than `min_area` or without a
      3 x 3 core); the card subtracts the 1. `return_display=True` rescales the values to 3-255 for display.
    formula: 'K = \max\left(2,\; r_x + r_y - 7\right)'
    symbols:
      'r_x, r_y': the number of runs of equal non-zero steps in x and in y along the traced boundary of the 8-connected object
      '7': the offset of the start and end markers (5 and 6) of the tracing
    python: |
      k = tf.contortion(forest, min_area=100)   # K + 1 on every object of 100 cells or more
      k.where(k > 2) - 1
    operator: landscape.contortion
    setting: min_area = 100
    api: terraflux.morphology.contortion
