    formula: 'P_{edge} = 100 \, \frac{N_{edge}}{N_{fg}}'
    symbols:
      'N_{edge}': the cells coded 3
      'N_{fg}': the habitat cells
    python: 'tf.spa(forest, variant=5).stats.set_index("class").loc["Edge", ["pct_data", "pct_fg"]]'
    operator: landscape.spa
    setting: variant = 5
    api: terraflux.spa.spa

  # impl: extern/terraflux-py/src/terraflux/spa.py:44-47
