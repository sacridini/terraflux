  # impl: _extrapolation.py:74-145
  - id: sdm_mess
    name: "Multivariate environmental similarity surface (MESS)"
    level: cell
    theme: extrapolation
    unit: "% of the reference range"
    range: "negative = novel; up to 100 at the median"
    aliases: [MESS, novel environments]
    what: |
      For each cell, the smallest over the variables of the similarity of its value to the reference sample: 100 at
      the median, falling to 0 at the reference extremes and negative outside the reference range. Negative cells are
      conditions at least one variable of which the model has never seen.
    use: |
      Use to mask projections into novel climates. It only looks at each variable separately; combinations of values
      that never occurred together are not flagged (use ExDet or MOP for that).
    formula: |
      S_j(x) = \begin{cases}2F & F \le 50\\ 200 - 2F & 50 < F < 100\\ 100\,\dfrac{x - \min}{\max - \min} & F = 0\\ 100\,\dfrac{\max - x}{\max - \min} & F = 100\end{cases},\qquad MESS = \min_j S_j
    symbols:
      'F = 100\,\#\{v \le x\}/n': "percent of the reference values of the variable that are at or below the cell's value \\( x \\); min and max: extremes of the reference values. Option `full=True` also returns \\( S_j \\) per variable (bands `<name>_mess`)."
    python: 'tf.sdm.mess(data, new)'
    operator: sdm.mess
    refs:
      - "Elith et al. (2010). The art of modelling range-shifting species. Methods in Ecology and Evolution 1: 330-342."

  # impl: _extrapolation.py:155-270
  - id: sdm_mop_distance
    name: "Mobility-oriented parity distance (mop)"
    level: cell
    theme: extrapolation
    unit: "variable units (or standardised)"
    range: "≥ 0"
    aliases: [MOP]
    what: |
      For each cell, the mean distance in environmental space to its nearest reference conditions. Large values mean
      the cell is unlike the conditions the model was fitted to, even inside the ranges.
    use: |
      Compare with MESS (range only). The Mahalanobis form uses the reference covariance, unlike the R package, which
      uses that of the tested cells.
    formula: |
      MOP(x) = \frac{1}{k}\sum_{m=1}^{k} d\bigl(x,\, r_{(m)}\bigr),\qquad k = \max\!\left(\operatorname{round}\!\left(n_r\,\frac{\text{percentage}}{100}\right),\, 1\right)
    symbols:
      'r_{(m)}': "the \\( m \\)-th nearest reference point"
      'd': "Euclidean distance (optionally after centring and scaling both sets together) or Mahalanobis distance with the covariance of the reference conditions"
      'n_r': "number of reference points. Computed by default only in cells inside every variable's reference range (`where=\"in_range\"`); other cells are NaN. `rescale` maps the values to 0-1."
    python: 'tf.sdm.mop(data, new).sel(band="mop")'
    operator: sdm.mop
    setting: distance = euclidean
    refs:
      - "Owens et al. (2013). Constraints on interpretation of ecological niche models by limited environmental ranges on calibration areas. Ecological Modelling 263: 10-18."

  # impl: _extrapolation.py:232-236
  - id: sdm_mop_basic
    name: "MOP outside-range mask (basic, simple)"
    level: cell
    theme: extrapolation
    unit: "1 or count"
    range: "basic = 1 or NaN; simple ≥ 1 or NaN"
    what: |
      The band `basic` is 1 in cells where at least one variable is outside the reference range, NaN otherwise. With
      `type="simple"` the band `simple` counts how many variables are outside.
    use: |
      A binary equivalent of MESS < 0; `simple` shows how many variables extrapolate.
    formula: |
      basic(x) = 1[\,\exists j:\; x_j < \min_j \lor x_j > \max_j\,],\qquad simple(x) = \sum_j 1[x_j < \min_j \lor x_j > \max_j]
    symbols:
      '\min_j, \max_j': "extremes of variable \\(j\\) in the reference sample"
      'x_j': "value of variable \\(j\\) in the cell"
    python: 'tf.sdm.mop(data, new, type="simple").sel(band="simple")'
    operator: sdm.mop
    setting: type = simple

  # impl: _extrapolation.py:264-269
  - id: sdm_mop_combined
    name: "MOP variables below / above range (low_combined, high_combined)"
    level: cell
    theme: extrapolation
    unit: "code"
    range: "sums of powers of 2"
    what: |
      With `type="detailed"`, two codes saying which variables are below and which above the reference range in each
      cell: for each variable j (1-based) outside in that direction, 2^j is added.
    use: |
      To map which variables drive extrapolation.
    formula: |
      low(x) = \sum_{j:\, x_j < \min_j} 2^{j},\qquad high(x) = \sum_{j:\, x_j > \max_j} 2^{j}
    symbols:
      'j': "position of the variable in the reference table, starting at 1. A code of 6 means variables 1 and 2 (2 + 4)."
    python: 'tf.sdm.mop(data, new, type="detailed").sel(band="low_combined")'
    operator: sdm.mop
    setting: type = detailed

  # impl: _extrapolation.py:323-327
  - id: sdm_exdet_nt1
    name: "Univariate novelty (ExDet NT1)"
    level: cell
    theme: extrapolation
    unit: "fraction of each variable's range"
    range: "NT1 ≤ 0 (negative = outside range)"
    aliases: [ExDet, type 1 novelty]
    what: |
      Where at least one variable is outside its reference range, the sum over the variables of how far outside it is,
      in units of the reference range of that variable. It is 0 inside every range.
    use: |
      Negative cells are univariate extrapolation; the more negative, the farther out.
    formula: |
      NT1(x) = \sum_{j}\frac{\min\bigl(x_j - a_j,\; b_j - x_j,\; 0\bigr)}{b_j - a_j}
    symbols:
      'a_j, b_j': "minimum and maximum of variable \\( j \\) in the reference sample. The band `exdet` holds NT1 where it is below 0."
    python: 'tf.sdm.exdet(data, new).sel(band="exdet").where(lambda x: x < 0)'
    operator: sdm.exdet
    refs:
      - "Mesgaran et al. (2014). Here be dragons: a tool for quantifying novelty due to covariate range and correlation change when projecting species distribution models. Diversity and Distributions 20: 1147-1159."

  # impl: _extrapolation.py:328-340
  - id: sdm_exdet_nt2
    name: "Combinatorial novelty (ExDet NT2)"
    level: cell
    theme: extrapolation
    unit: "none"
    range: "NT2 ≥ 0; > 1 = novel combination"
    what: |
      For cells inside every variable's range, the squared Mahalanobis distance to the reference centre relative to
      the largest such distance among the reference points. A value above 1 marks a combination of values (a
      correlation structure) the reference sample never had.
    use: |
      Complements MESS and NT1: it finds novelty that no single variable shows.
    formula: |
      NT2(x) = \frac{D^{2}(x)}{\max_{r \in R} D^{2}(r)},\qquad D^{2}(x) = (x - \bar{r})^{\top} \Sigma^{-1} (x - \bar{r})
    symbols:
      '\bar{r}': "mean of the reference conditions"
      '\Sigma': "their covariance"
      'R': "reference points. The band `exdet` holds NT2 where NT1 = 0. Collinear predictors make \\( \\Sigma \\) singular and raise an error."
    python: 'tf.sdm.exdet(data, new).sel(band="exdet").where(lambda x: x >= 0)'
    operator: sdm.exdet
    refs:
      - "Mesgaran et al. (2014). Here be dragons: a tool for quantifying novelty due to covariate range and correlation change when projecting species distribution models. Diversity and Distributions 20: 1147-1159."

  # impl: _extrapolation.py:327, 341-347
  - id: sdm_exdet_mic
    name: "Most influential covariate (ExDet mic)"
    level: cell
    theme: extrapolation
    unit: "variable index"
    range: "0, or 1 ... number of variables"
    what: |
      The variable most responsible for the novelty of the cell (1-based position), or 0 for conditions that are
      analogue.
    use: |
      Use to explain why a projection extrapolates.
    formula: |
      mic(x) = \begin{cases}\arg\min_j \dfrac{\min(x_j - a_j,\, b_j - x_j,\, 0)}{b_j - a_j} & NT1 < 0\\ \arg\max_k \dfrac{D^{2}(x) - D^{2}_{-k}(x)}{D^{2}_{-k}(x)} & NT2 > 1\\ 0 & \text{otherwise}\end{cases}
    symbols:
      'D^{2}_{-k}': "squared Mahalanobis distance without variable \\( k \\) (reference centre and covariance recomputed). The R package dsmextra numbered the variables backwards in the combinatorial case; here it points to the right variable."
    python: 'tf.sdm.exdet(data, new).sel(band="mic")'
    operator: sdm.exdet
    refs:
      - "Mesgaran et al. (2014). Here be dragons: a tool for quantifying novelty due to covariate range and correlation change when projecting species distribution models. Diversity and Distributions 20: 1147-1159."
