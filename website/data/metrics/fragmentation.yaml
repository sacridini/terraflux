  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:104-117
  - id: frag_gray_stddev
    name: Gray-level window standard deviation
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 or more"
    aliases: [standard deviation, focal standard deviation, std]
    what: |
      The standard deviation of the values in the window, of the population (divided by \(n\), not \(n - 1\)).
    use: |
      The local texture, or heterogeneity, of a percentage map: highest where the cover changes most, as where forest
      meets prairie.
    formula: '\sigma = \sqrt{\frac{1}{n} \sum_k f_k \, k^2 - \mu^2}'
    symbols:
      'f_k': the cells of the window with value \(k\)
      'n': the valid cells, \(\sum_k f_k\)
      '\mu': their mean; a negative value from rounding under the root is set to 0
    python: 'tf.gray_spatial_convolution(cover, metric="stddev", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "stddev"
    api: terraflux.grayspatcon.gray_spatial_convolution

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:118-129
  - id: frag_gray_shannon_diversity
    name: Gray-level Shannon diversity
    level: cell
    theme: gray-level window statistics
    unit: nats
    range: "0 to ln(101)"
    aliases: [Shannon index, Shannon entropy, SHDI]
    what: |
      Shannon's index of the values in the window, each value from 0 to 100 taken as a class.
    use: |
      Every distinct value counts as a class of its own, so on continuous data it measures the spread of the values
      more than a diversity.
    formula: "H' = -\\sum_{k} p_k \\ln p_k"
    symbols:
      'p_k': the share of the valid cells of the window with value \(k\), \(f_k / n\); only the values present enter
    python: 'tf.gray_spatial_convolution(cover, metric="shannon_diversity", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "shannon_diversity"
    api: terraflux.grayspatcon.gray_spatial_convolution
    refs:
      - "Shannon, C. E. (1948). A mathematical theory of communication. *The Bell System Technical Journal*, 27(3), 379-423. https://doi.org/10.1002/j.1538-7305.1948.tb01338.x"

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:130-146
  - id: frag_gray_shannon_evenness
    name: Gray-level Shannon evenness
    level: cell
    theme: gray-level window statistics
    unit: none
    range: "0 to 1"
    aliases: [Pielou evenness, SHEI, evenness]
    what: |
      The Shannon diversity divided by its largest possible value for the number of distinct values present in the
      window (Pielou's evenness).
    use: |
      The maximum is that of the values present, not of all 101, so a window with only two values can score high;
      read it with the diversity.
    formula: "J' = \\frac{H'}{\\ln S}"
    symbols:
      "H'": the Shannon diversity of the window's values
      'S': the number of distinct values in the window; 0 when \(S \le 1\)
    python: 'tf.gray_spatial_convolution(cover, metric="shannon_evenness", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "shannon_evenness"
    api: terraflux.grayspatcon.gray_spatial_convolution
    refs:
      - "Shannon, C. E. (1948). A mathematical theory of communication. *The Bell System Technical Journal*, 27(3), 379-423. https://doi.org/10.1002/j.1538-7305.1948.tb01338.x"

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:175-206
  - id: frag_gray_same_value
    name: Gray-level same-value adjacency (diagonal contagion)
    level: cell
    theme: gray-level window statistics
    unit: proportion
    range: "0 to 1"
    aliases: [diagonal contagion, same-value adjacency]
    what: |
      The share of the pairs of neighbouring cells in the window that hold the same value. The library calls it
      `diagonal_contagion`, but it is not Riitters' contagion, and it pairs a cell with its right and lower neighbours,
      not the diagonal ones.
    use: |
      A measure of how smooth the values are; on a continuous cover it is low, because exact ties are rare. A window
      with no valid pair gives -0.01.
    formula: 'D = \frac{\#\{\text{pairs with } v_a = v_b\}}{\#\{\text{valid pairs}\}}'
    symbols:
      'v_a, v_b': the values of the two cells of a pair, a cell and its right or lower neighbour, both in the window and both valid (100 or less)
    python: 'tf.gray_spatial_convolution(cover, metric="diagonal_contagion", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "diagonal_contagion"
    api: terraflux.grayspatcon.gray_spatial_convolution

  # impl: extern/terraflux-py/src/cpp/gtb/mosaic.cpp:17-31 (recode table), 62-65 (the pure classes); the class regions
  # were found by calling the library on a 1 % grid of compositions
  - id: frag_mosaic
    name: Landscape mosaic (19 classes)
    level: cell
    theme: landscape mosaic
    unit: class code, 1 to 19 (0 missing)
    range: "1 to 19"
    aliases: [landscape mosaic, LM19, Agriculture (>60%), Developed (>60%), Forest (>60%), Agriculture-Developed, Agriculture-Forest, Developed-Forest, Developed-Agriculture, Forest-Agriculture, Forest-Developed, Agriculture-Forest-Developed, Developed-Agriculture-Forest, Forest-Agriculture-Developed, Mosaic Agriculture-Developed, Mosaic Agriculture-Forest, Mosaic Developed-Forest, Mosaic Agriculture-Developed-Forest, Pure Forest (100%), Pure Agriculture (100%), Pure Developed (100%)]
    what: |
      The mix of agriculture, natural (*forest* in the library's names) and developed land in a window around each cell,
      as one of 19 classes of the triangle of compositions: the three corners of a pure cover, three classes where one
      cover dominates alone, six where one dominates with a second, three where one dominates with both others, and four
      mosaics where none reaches 60 %. A name lists the covers from the most abundant.
    use: |
      The classes, with \(p_a\), \(p_f\) and \(p_d\) the shares of agriculture, natural and developed in the window
      (class edges at multiples of 10 %; the side an edge falls on follows the comparisons of the code):

      | Code | Class | Shares in the window |
      |---|---|---|
      | 1 | Agriculture (>60%) | \(p_a \ge 0.8\), \(p_f < 0.1\), \(p_d < 0.1\), not pure |
      | 2 | Developed (>60%) | \(p_d \ge 0.8\), \(p_a < 0.1\), \(p_f < 0.1\), not pure |
      | 3 | Forest (>60%) | \(p_f \ge 0.8\), \(p_a < 0.1\), \(p_d < 0.1\), not pure |
      | 4 | Agriculture-Developed | \(0.6 \le p_a < 0.9\), \(0.1 \le p_d \le 0.4\), \(p_f < 0.1\) |
      | 5 | Agriculture-Forest | \(0.6 \le p_a < 0.9\), \(0.1 \le p_f \le 0.4\), \(p_d < 0.1\) |
      | 6 | Developed-Forest | \(0.6 \le p_d < 0.9\), \(0.1 \le p_f \le 0.4\), \(p_a < 0.1\) |
      | 7 | Developed-Agriculture | \(0.6 \le p_d < 0.9\), \(0.1 \le p_a \le 0.4\), \(p_f < 0.1\) |
      | 8 | Forest-Agriculture | \(0.6 \le p_f < 0.9\), \(0.1 \le p_a \le 0.4\), \(p_d < 0.1\) |
      | 9 | Forest-Developed | \(0.6 \le p_f < 0.9\), \(0.1 \le p_d \le 0.4\), \(p_a < 0.1\) |
      | 10 | Agriculture-Forest-Developed | \(0.6 \le p_a < 0.8\), \(0.1 \le p_f < 0.3\), \(0.1 \le p_d < 0.3\) |
      | 11 | Developed-Agriculture-Forest | \(0.6 \le p_d < 0.8\), \(0.1 \le p_a < 0.3\), \(0.1 \le p_f < 0.3\) |
      | 12 | Forest-Agriculture-Developed | \(0.6 \le p_f < 0.8\), \(0.1 \le p_a < 0.3\), \(0.1 \le p_d < 0.3\) |
      | 13 | Mosaic Agriculture-Developed | \(0.3 \le p_a < 0.6\), \(0.3 \le p_d < 0.6\), \(p_f < 0.1\) |
      | 14 | Mosaic Agriculture-Forest | \(0.3 \le p_a < 0.6\), \(0.3 \le p_f < 0.6\), \(p_d < 0.1\) |
      | 15 | Mosaic Developed-Forest | \(0.3 \le p_d < 0.6\), \(0.3 \le p_f < 0.6\), \(p_a < 0.1\) |
      | 16 | Mosaic Agriculture-Developed-Forest | all three from about 0.1 to under 0.6: the centre of the triangle, what no other class takes |
      | 17 | Pure Forest (100%) | \(p_f = 1\) |
      | 18 | Pure Agriculture (100%) | \(p_a = 1\) |
      | 19 | Pure Developed (100%) | \(p_d = 1\) |

      A pure class and the dominant class of the same cover (17 and 3, 18 and 1, 19 and 2) make together the area that
      cover dominates. What counts as natural or as agriculture (pastures?) changes every class: say how the land cover
      was grouped. The library names the classes in `tf.LM19_CLASSES`; the card's value is the share of the cells with
      data in each class, from [`tf.landscape_mosaic_stats`][terraflux.mosaic.landscape_mosaic_stats].
    formula: '(p_a, p_f, p_d) \mapsto c \in \{1, \dots, 19\}, \qquad p_a + p_f + p_d = 1'
    symbols:
      'p_a, p_f, p_d': the shares of agriculture (input 1), natural (2) and developed (3) among the classified cells of the window; input 0 is missing and left out, and the window is padded with missing cells at the border of the map
      'c': the class of the cell, from the table; a pure class needs a share of 1 (to single-precision rounding)
    python: |
      mosaic = tf.landscape_mosaic(three, window_size=27)   # the map: 19 classes, 0 missing
      tf.landscape_mosaic_stats(three, window_size=27).groupby("recode_name_19")["percentage"].sum()
    operator: fragmentation.landscape_mosaic
    setting: classes = 19
    api: terraflux.mosaic.landscape_mosaic
    refs:
