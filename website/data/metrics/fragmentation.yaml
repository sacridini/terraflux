  # impl: extern/terraflux-py/src/cpp/gtb/entropy.cpp:78-125
  - id: frag_entropy
    name: Spatial entropy
    level: landscape
    theme: entropy
    unit: "%"
    range: "0 to 100"
    aliases: [spatial entropy, joint directional entropy, spatial joint entropy]
    what: |
      The Shannon entropy of the differences between every cell and its eight neighbours, among habitat, background and
      missing, scaled to 0-100: 0 for a uniform map, rising as the pattern gets more mixed.
    use: |
      One number for the heterogeneity of a map. It is not the Shannon diversity of the classes: it counts transitions
      between neighbours, not class areas. It is highest near 50 % habitat, so compare it between maps with similar
      amounts of habitat, or read it with FAD.
    formula: 'H_{n} = 100 \, \frac{-\sum_{d} p_d \ln p_d}{1.5 \ln 2}'
    symbols:
      'd': the coded difference between a cell and one of its 8 neighbours (habitat 7, background 3, missing 0; the border of the map is replicated)
      'p_d': the share of the \(8N\) pairs of a cell and a neighbour with difference \(d\), \(N\) the cells of the map
      '1.5 \ln 2': the normalising maximum (1.5 bits); the result is clipped to 0-100
    python: 'tf.spatial_entropy(forest).entropy_index'
    operator: fragmentation.entropy
    api: terraflux.entropy.spatial_entropy
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/entropy.cpp:127-162
  - id: frag_entropy_map
    name: Spatial entropy in a window
    level: cell
    theme: entropy
    unit: "%"
    range: "0 to 100"
    aliases: [local spatial entropy, entropy map]
    what: |
      The same normalised entropy within a square window around each cell, which maps where the pattern is mixed. The
      window spans `2 * (window_size // 2) + 1` cells, so an even size gives the next odd one; the default is 50.
    use: |
      Use it to find the zones of transition of a pattern: dark where the window is all habitat or all background,
      bright where they are most intermingled. A window needs many cells for a stable count of the differences.
    formula: 'H_{n}(x) = 100 \, \frac{-\sum_{d} p_d \ln p_d}{1.5 \ln 2}'
    symbols:
      'p_d': within the window around cell \(x\), the share of the pairs of a cell and a neighbour (8 directions) with difference \(d\); the window is clipped at the border of the map
    python: 'tf.spatial_entropy_map(forest, window_size=27)'
    operator: fragmentation.entropy_map
    setting: window = 27
    api: terraflux.entropy.spatial_entropy_map
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:51-57
  - id: frag_gray_mean
    name: Gray-level window mean
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 to 100"
    aliases: [GraySpatCon, average, focal mean, moving average]
    what: |
      The mean of the values (0 to 100) in the window around each cell: a moving average of a percentage map.
    use: |
      For maps of percent cover; the result is a float32 map. With `mask_missing=True` (the default) the cells that are
      missing themselves stay missing, as -0.01; the card keeps the cells with a value (`.where(cover <= 100)`).
    formula: '\mu = \frac{1}{n} \sum_{k=0}^{100} k \, f_k'
    symbols:
      'f_k': the number of cells of the window with value \(k\)
      'n': the valid cells of the window, \(\sum_k f_k\); the missing cells (above 100) are skipped, and the window is clipped at the border of the map
    python: 'tf.gray_spatial_convolution(cover, metric="mean", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "mean"
    api: terraflux.grayspatcon.gray_spatial_convolution
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:59-67
  - id: frag_gray_median
    name: Gray-level window median
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 to 100"
    aliases: [focal median]
    what: |
      The median of the values in the window; with an even number of valid cells, the lower of the two middle values.
    use: |
      Robust to a few extreme cells; good for noisy cover maps.
    formula: '\tilde{x} = \min\left\{k : \sum_{j \le k} f_j \ge \left\lfloor \frac{n+1}{2} \right\rfloor\right\}'
    symbols:
      'f_j': the cells of the window with value \(j\)
      'n': the valid cells of the window; \(\lfloor (n+1)/2 \rfloor\) is a whole division, so an even \(n\) gives the lower middle value
    python: 'tf.gray_spatial_convolution(cover, metric="median", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "median"
    api: terraflux.grayspatcon.gray_spatial_convolution

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:69-77
  - id: frag_gray_majority
    name: Gray-level window majority
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 to 100"
    aliases: [mode, focal majority]
    what: |
      The most frequent value in the window; on a tie, the lowest value.
    use: |
      Meant for values that are classes; on a continuous cover it is noisy, because every value is a class of its own.
    formula: '\hat{x} = \arg\max_k f_k'
    symbols:
      'f_k': the valid cells of the window with value \(k\); ties go to the smallest \(k\)
    python: 'tf.gray_spatial_convolution(cover, metric="majority", window_size=7).where(cover <= 100)'
    operator: fragmentation.gray_convolution
    setting: metric = "majority"
    api: terraflux.grayspatcon.gray_spatial_convolution

  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:78-84
  - id: frag_gray_min
    name: Gray-level window minimum
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 to 100"
    aliases: [minimum, focal minimum]
    what: |
      The smallest valid value in the window.
    use: |
      Erodes the high values; with the maximum it gives the range.
    formula: 'x_{min} = \min\{k : f_k > 0\}'
    symbols:
