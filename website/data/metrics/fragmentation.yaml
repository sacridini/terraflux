  # impl: extern/terraflux-py/src/cpp/gtb/grayspatcon.cpp:92-103
  - id: frag_gray_range
    name: Gray-level window range
    level: cell
    theme: gray-level window statistics
    unit: the map's unit (here % cover)
    range: "0 to 100"
    aliases: [focal range, local contrast]
    what: |
      The largest less the smallest value in the window: a quick measure of local contrast.
    use: |
      A single outlying cell sets it, unlike the standard deviation.
    formula: 'R = x_{max} - x_{min}'
    symbols:
      'x_{max}': the largest valid value of the window
      'x_{min}': the smallest
    python: 'tf.gray_spatial_convolution(cover, metric="range", window_size=7).where(cover <= 100)'
