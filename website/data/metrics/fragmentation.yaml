  # impl: extern/terraflux-py/src/terraflux/fos.py:279
  - id: frag_fos_avcon
    name: Average connectivity (AVCON) of FOS
    level: landscape
    theme: map summaries
    unit: "%"
    range: "0 to 100"
    what: |
      The average FOS value scaled by the habitat's share of the reporting unit, so that a map with little habitat scores
      low however dense that habitat is.
    use: |
      Good for comparing units with unequal amounts of habitat, but it mixes amount and arrangement in one number.
    formula: 'AVCON = \overline{FOS} \, \frac{N_f}{N_r}'
    symbols:
      '\overline{FOS}': the average FOS value of the habitat cells
      'N_f': the habitat cells
      'N_r': the cells of the reporting unit, all those that are not missing
    python: 'tf.fos(forest, window_size=27).avcon'
    operator: fragmentation.fos
    setting: window = 27
    api: terraflux.fos.fos
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/fos.py:244-247
  - id: frag_fos_eca
    name: Equivalent connected area (ECA) of FOS
    level: landscape
    theme: map summaries
    unit: cells
    range: "0 to the habitat area"
    aliases: [ECA, equivalent connected area]
    what: |
      The area of a single patch that would be as connected as the habitat of the map: the patches add up as the square
      root of the sum of their squared areas, so one large patch counts more than many small ones of the same total.
    use: |
      Follow the habitat's connectivity through time with it, beside the habitat area. It is in cells here, and it takes
      the patches as connected components with no dispersal distance: the [connectivity](../connectivity/) cards give the
      ECA of a habitat graph with one.
    formula: 'ECA = \sqrt{\sum_{p=1}^{n} a_p^{2}}'
    symbols:
      'a_p': the area, in cells, of habitat patch \(p\) (8-connected by default, 4 with `connectivity=4`)
      'n': the number of patches
    python: 'tf.fos(forest, window_size=27).eca'
    operator: fragmentation.fos
    api: terraflux.fos.fos
    refs:
      - "Saura, S., Estreguil, C., Mouton, C., & Rodríguez-Freire, M. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). *Ecological Indicators*, 11, 407-416."

  # impl: extern/terraflux-py/src/terraflux/fos.py:304
  - id: frag_fos_coh
    name: Coherence (COH)
    level: landscape
    theme: map summaries
    unit: "%"
    range: "more than 0, up to 100"
    aliases: [coherence, degree of coherence, DOC]
    what: |
      ECA as a percentage of the largest it could be, with all the habitat in one patch: 100 % when the habitat is one
      patch, less as it splits.
    use: |
      It does not depend on the size of the reporting unit, unlike the coherence over the reporting unit.
    formula: 'COH = 100 \, \frac{ECA}{ECA_{max}}, \qquad ECA_{max} = \sum_p a_p'
    symbols:
      'ECA': the equivalent connected area
      'ECA_{max}': the habitat area, in cells
    python: 'tf.fos(forest, window_size=27).coherence'
    operator: fragmentation.fos
    api: terraflux.fos.fos
    refs:
      - "Saura, S., Estreguil, C., Mouton, C., & Rodríguez-Freire, M. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). *Ecological Indicators*, 11, 407-416."

  # impl: extern/terraflux-py/src/terraflux/fos.py:304
  - id: frag_fos_coh_ru
    name: Coherence over the reporting unit (COH_ru)
    level: landscape
    theme: map summaries
    unit: "%"
    range: "more than 0, up to 100"
    aliases: [COH_ru]
    what: |
      ECA divided by the area of the whole reporting unit rather than by the habitat's: low both when the habitat is
      scarce and when it is split.
    use: |
      Use it to compare units of the same size, or when the whole unit is what the question is about.
    formula: 'COH_{ru} = 100 \, \frac{ECA}{N_r}'
    symbols:
      'ECA': the equivalent connected area, in cells
      'N_r': the cells of the reporting unit, all those that are not missing
    python: 'tf.fos(forest, window_size=27).coherence_ru'
    operator: fragmentation.fos
    api: terraflux.fos.fos
    refs:
      - "Saura, S., Estreguil, C., Mouton, C., & Rodríguez-Freire, M. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). *Ecological Indicators*, 11, 407-416."

