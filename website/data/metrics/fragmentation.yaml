family: fragmentation
title: Fragmentation
order: 100
source: "GuidosToolbox (FAD, FOS, contagion, clustering, entropy, landscape mosaic) and GraySpatCon / Riitters et al."
intro: |
  Moving-window measures of how much habitat surrounds each habitat cell and how it is arranged: the foreground area
  density (FAD) and its six fragmentation classes, the fixed observation scale (FOS) with its three methods, Riitters'
  contagion and clustering, the spatial entropy, GraySpatCon's statistics of a percentage map, and the landscape mosaic
  of agriculture, natural and developed land. They are the measures of the
  [fragmentation tutorials](../../tutorials/fragmentation/fragmentation-and-habitat-loss/), and of GuidosToolbox.

  The cards use the three maps of those tutorials: `forest`, the forest map of GuidosToolbox's sample (1000 x 1000 cells
  of 25 m, coded 0 missing, 1 background, 2 forest); `cover`, GraySpatCon's sample of the percentage of tree cover of the
  conterminous United States (1289 x 1990 cells of 2.43 km, 0 to 100, 255 missing); and `three`, the CORINE land cover
  around Hannover in the mosaic's three groups (1 agriculture, 2 natural, 3 developed, 0 missing: the water is in none).

  A window is a square of an odd number of cells around each cell. The maps of percentages are bytes, as in
  GuidosToolbox: 0 to 100 on the habitat, 101 on the background and 102 on missing cells, so their values are whole
  percent; the cards keep the habitat cells (`.where(forest == 2)`), so that the mean of a map is the mean over the
  habitat.
example: |
  import terraflux as tf

  # forest of GuidosToolbox's sample (1000 x 1000 cells of 25 m): 0 missing, 1 background, 2 forest
  forest = tf.load_raster(tf.example_data("input"))
  # % tree cover of the conterminous United States (GraySpatCon's sample): 0-100, 255 missing
  cover = tf.load_raster(tf.example_data("gscinput"))
  # CORINE around Hannover in the landscape mosaic's three groups: 1 agriculture, 2 natural, 3 developed, 0 missing
  three = tf.reclassify(tf.load_raster(tf.example_data("clc")), [(1, 12, 3), (12, 23, 1), (23, 40, 2)], others=0)
metrics:
  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:57-68
  - id: frag_fad
    name: Foreground area density (FAD)
    level: cell
    theme: density
    unit: "%"
    range: "0 to 100"
    aliases: [FAD, forest area density, foreground density, Pf]
    what: |
      The share of habitat (foreground) among the cells of a window centred on each habitat cell: how much of the
      neighbourhood is habitat. It is the basis of the six fragmentation classes, from rare to intact.
    use: |
      Use it for the local amount of habitat at one scale of observation, the window; quote the window in metres with the
      result. It says how much habitat there is around a cell, not how it is arranged: contagion and clustering add that.
      The value is quantised as in GuidosToolbox: the proportion is cut to steps of 1/254, rounded to a whole percent and
      held at 99 unless the window has no background at all, so 100 means an all-habitat window.
    formula: 'FAD = 100 \, \frac{n_f}{n_v}'
    symbols:
      'n_f': the habitat cells (code 2) in the window
      'n_v': the valid cells of the window, all but the missing (0) and the non-fragmenting special background (4); at the border of the map the window is clipped, not padded
    python: 'tf.fad(forest, window_size=27).density.where(forest == 2)'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:320-338
  - id: frag_fad_multiscale
    name: Multiscale FAD
    level: cell
    theme: density
    unit: "%"
    range: "0 to 100"
    aliases: [multiscale FAD, average of scales]
    what: |
      The mean of the FAD maps of several windows (by default 7, 13, 27, 81 and 243 cells), which blends the near and the
      broad neighbourhood in one map. It is classified into the same six classes as FAD.
    use: |
      Use it to rank habitat cells by the habitat around them across scales, when no single scale is the right one for
      the question. Quote the list of windows with the result.
    formula: 'FAD^{ms}_i = \operatorname{round}\left(\frac{1}{K}\sum_{k=1}^{K} FAD^{(k)}_i\right)'
    symbols:
      'K': the number of windows
      'FAD^{(k)}_i': the FAD of cell \(i\) in window \(k\), in whole percent; the cells that are not habitat keep their codes of background and missing
    python: 'tf.fad_multiscale(forest).multiscale_map.where(forest == 2)'
    operator: fragmentation.fad_multiscale
    setting: windows = [7, 13, 27, 81, 243]
    api: terraflux.fad.fad_multiscale
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/terraflux/fos.py:262-279
  - id: frag_fos_fad
    name: FOS by foreground area density
    level: cell
    theme: density
    unit: "%"
    range: "0 to 100"
    aliases: [FOS, fixed observation scale, FOS-FAD]
    what: |
      The fixed observation scale (FOS) map with the FAD method: the share of habitat in the window, taken as the
      connectivity of each habitat cell, with GuidosToolbox's reports (class shares, ECA, coherence). On a map of
      percent cover the habitat is the cover at or above a threshold, and the value is the mean cover in the window.
    use: |
      The same reading as FAD. Fragmentation in GuidosToolbox's sense is the complement, 100 % less this connectivity.
      [`tf.fos`][terraflux.fos.fos] reads a map of 0 to 100 as percent cover by its values (`grayscale=True` forces it).
    formula: 'FOS^{FAD}_i = 100 \, \frac{n_f}{n_v}'
    symbols:
      'n_f': the habitat cells of the window; on a percent map, the cells with a cover of at least `gray_threshold` (30 by default), and the value is the window's mean cover
      'n_v': the valid cells of the window (the special background 4 counted as missing)
    python: 'tf.fos(forest, window_size=27, method="FAD").map.where(forest == 2)'
    operator: fragmentation.fos
    setting: method = "FAD"
    api: terraflux.fos.fos
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/fos.cpp:46-70
  - id: frag_fos_fed
    name: FOS by foreground edge density
    level: cell
    theme: clustering
    unit: "%"
    range: "0 to 100"
    aliases: [FED, foreground edge density, FOS-FED, GraySpatCon clustering]
    what: |
      The connectivity of each habitat cell from the pairs of neighbouring cells in its window: a pair of two habitat
      cells counts fully, a habitat-background pair half, a background pair nothing. It mixes the amount of habitat with
      how much edge cuts it.
    use: |
      Lower than FAD where the habitat is cut by many edges, so the difference between the two maps points to edge. On a
      percent map it is the same mean of the pairs' values.
    formula: 'FED = 100 \, \frac{E_{ff} + \tfrac{1}{2} E_{fb}}{E_{v}}'
    symbols:
      'E_{ff}': the pairs (a cell and its right or lower neighbour, both inside the window) with both cells habitat
      'E_{fb}': the pairs with one habitat and one background cell
      'E_{v}': the pairs without a missing cell; the cells outside the map count as missing, so the window is padded, not clipped. On a map of 100 for habitat and 0 for background, this is GraySpatCon's clustering, the mean of \((i + j)/2\) over the pairs
    python: 'tf.fos(forest, window_size=27, method="FED").map.where(forest == 2)'
    operator: fragmentation.fos
    setting: method = "FED"
    api: terraflux.fos.fos
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/contagion.cpp:300-350
  - id: frag_fos_fac
    name: FOS by foreground area clustering
    level: cell
    theme: clustering
    unit: "%"
    range: "0 to 100"
    aliases: [FOS-FAC]
    what: |
      The connectivity of each habitat cell as the share of habitat-habitat pairs among all the valid pairs of
      neighbouring cells in the window. Binary maps only.
    use: |
      Choose it to measure how clustered the habitat is rather than how much there is; it is the FOS form of the
      moving-window clustering (FAC) card.
    formula: 'FAC = 100 \, \frac{E_{ff}}{E_{v}}'
    symbols:
      'E_{ff}': the horizontal and vertical pairs of neighbours, both inside the window, with both cells habitat
      'E_{v}': the pairs without a missing cell (missing and non-fragmenting special background left out)
    python: 'tf.fos(forest, window_size=27, method="FAC").map.where(forest == 2)'
    operator: fragmentation.fos
    setting: method = "FAC"
    api: terraflux.fos.fos
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/contagion.cpp:70-226
  - id: frag_pff
    name: Contagion (Pff)
    level: cell
    theme: clustering
    unit: "proportion (or % as a byte)"
    range: "0 to 1 (0 to 100 as a byte)"
    aliases: [Pff, contagion, adjacency, conditional probability of habitat next to habitat]
    what: |
      The chance that a neighbour of a habitat cell is habitat too, counted over the pairs of neighbouring cells of a
      window. High values mean that the habitat is aggregated; the value is mapped on the habitat cells only.
    use: |
      Pff looks only at the pairs that involve habitat, so a window of solid habitat gives 1 and one with a single habitat
      cell gives 0, whatever the amount around. Read it with FAD (Pf): Riitters' fragmentation categories (interior,
      perforated, edge, transitional, patch) are a rule on the two. `as_byte=False` gives a proportion with no value off
      the habitat; the default byte map follows GuidosToolbox (steps of 1/254, whole percent, 99 unless exactly 1, 101
      background, 102 missing).
    formula: 'P_{ff} = \frac{E_{ff}}{E_{ff} + E_{fb}}'
    symbols:
      'E_{ff}': the horizontal and vertical pairs of neighbours with both cells habitat (code 2)
      'E_{fb}': the pairs with one habitat and one background (code 1) cell; the pairs with a missing cell are left out, and the cells outside the map count as missing
    python: 'tf.contagion_pff(forest, window_size=13, as_byte=False)'
    operator: fragmentation.contagion
    setting: window = 13
    api: terraflux.contagion.contagion_pff
    refs:
      - "Riitters, K., Wickham, J., O'Neill, R., Jones, B., & Smith, E. (2000). Global-scale patterns of forest fragmentation. *Conservation Ecology*, 4(2), 3. https://doi.org/10.5751/ES-00209-040203"
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/contagion.cpp:270-355
  - id: frag_fac
    name: Foreground area clustering (FAC)
    level: cell
    theme: clustering
    unit: "proportion (or % as a byte)"
    range: "0 to 1 (0 to 100 as a byte)"
    aliases: [FAC, foreground area clustering, clustering]
    what: |
      The share of all the valid pairs of neighbouring cells in the window that are habitat-habitat. Unlike Pff it keeps
      every pair of the window in the denominator, so it grows both with clustering and with the amount of habitat.
    use: |
      Prefer it to Pff when the measure should also reflect how much of the window is habitat. The byte coding is that
      of Pff.
    formula: 'FAC = \frac{E_{ff}}{E_{v}}'
    symbols:
      'E_{ff}': the pairs of neighbours (a cell and its right or lower one) with both cells habitat
      'E_{v}': all the pairs of neighbours without a missing cell
    python: 'tf.clustering_fac(forest, window_size=13, as_byte=False)'
    operator: fragmentation.clustering
    setting: window = 13
    api: terraflux.contagion.clustering_fac
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_rare
    name: Rare (FAD below 10 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [rare, fragmentation class 1]
    what: |
      The share of the habitat cells whose window is almost all background (FAD under 10 %): habitat scarcely surrounded
      by more habitat.
    use: |
      Read the six class shares together: they add up to 100 % of the habitat, and each depends on the window, so compare
      them only at one window size.
    formula: 'S_{rare} = 100 \, \frac{\#\{i \in F : FAD_i < 10\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "rare_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_patchy
    name: Patchy (FAD 10 to 40 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [patchy, fragmentation class 2]
    what: |
      The share of the habitat cells with a FAD of 10 % up to 40 %: habitat in small amounts among mostly other cover.
    use: |
      With rare, the habitat that lives in a matrix of something else.
    formula: 'S_{patchy} = 100 \, \frac{\#\{i \in F : 10 \le FAD_i < 40\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "patchy_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_transitional
    name: Transitional (FAD 40 to 60 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [transitional, fragmentation class 3]
    what: |
      The share of the habitat cells with a FAD of 40 % up to 60 %: about as much habitat as background around the cell.
    use: |
      These cells sit where a matrix of habitat turns into a matrix of non-habitat, the zone where a little more loss
      changes which cover dominates.
    formula: 'S_{trans} = 100 \, \frac{\#\{i \in F : 40 \le FAD_i < 60\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "transitional_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_dominant
    name: Dominant (FAD 60 to 90 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [dominant, fragmentation class 4]
    what: |
      The share of the habitat cells with a FAD of 60 % up to 90 %: the habitat is the matrix, with a clear share of other
      cover.
    use: |
      With interior and intact, the habitat that sits within mostly habitat.
    formula: 'S_{dom} = 100 \, \frac{\#\{i \in F : 60 \le FAD_i < 90\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "dominant_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_interior
    name: Interior (FAD 90 % to under 100 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [interior, fragmentation class 5]
    what: |
      The share of the habitat cells with a FAD of at least 90 % but not a full 100 %: almost entirely surrounded by
      habitat. In FOS with five classes, this class holds the intact cells too.
    use: |
      Habitat deep inside large areas of it; intact is the strictest class.
    formula: 'S_{int} = 100 \, \frac{\#\{i \in F : 90 \le FAD_i < 100\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent; it is 100 only for a window with no background cell
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "interior_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/cpp/gtb/fad.cpp:82-92
  - id: frag_fad_intact
    name: Intact (FAD 100 %)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [intact, fragmentation class 6]
    what: |
      The share of the habitat cells whose whole window is habitat, with no background cell in it.
    use: |
      A strict measure that shrinks fast as the window grows: on the example it is 52 % of the forest in windows of 7
      cells, 7 % in windows of 27 and 0 in windows of 81 and 243, as for almost any real landscape.
    formula: 'S_{intact} = 100 \, \frac{\#\{i \in F : FAD_i = 100\}}{N_f}'
    symbols:
      'F': the habitat cells
      'N_f': their number
      'FAD_i': the FAD of cell \(i\); 100 only when every valid cell of the window is habitat
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "intact_%"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/terraflux/fos.py:126-138
  - id: frag_fos_classes
    name: FOS class shares (5 or 6 classes)
    level: class
    theme: fragmentation classes
    unit: "% of the habitat"
    range: "0 to 100"
    aliases: [FOS classes, fragmentation classes]
    what: |
      The share of the habitat cells in each fragmentation class of a FOS map: rare (below 10), patchy (10 to 40),
      transitional (40 to 60), dominant (60 to 90), interior (90 to 100) and, with six classes, intact (exactly 100).
      With five classes, interior covers 90 to 100.
    use: |
      The `stats` of the result has a row per class, and the shares add up to 100. The classes have the same names for
      the three methods but not the same meaning: say which method and window they come from.
    formula: 'S_c = 100 \, \frac{\#\{i \in F : lo_c \le v_i < hi_c\}}{N_f}'
    symbols:
      'v_i': the FOS value of habitat cell \(i\), in whole percent
      'lo_c, hi_c': the edges of class \(c\) above; the last class takes \(v_i \le 100\) (five classes) or \(v_i = 100\) (intact)
      'F': the habitat cells, \(N_f\) their number
    python: 'tf.fos(forest, window_size=27, classes=6).stats'
    operator: fragmentation.fos
    setting: classes = 6
    api: terraflux.fos.fos
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/terraflux/fad.py:168-180
  - id: frag_fad_average
    name: Average FAD
    level: landscape
    theme: map summaries
    unit: "%"
    range: "0 to 100"
    aliases: [average FAD, mean FAD]
    what: |
      The mean FAD over all the habitat cells of the map, at one window: how much habitat an average habitat cell has
      around it.
    use: |
      Compare maps or dates at the same window. It falls as the window grows (on the example, 85.2 % in windows of 7
      cells, 73.5 % in 27, 51.4 % in 243), so quote the window with it.
    formula: '\overline{FAD} = \frac{1}{N_f} \sum_{i \in F} FAD_i'
    symbols:
      'F': the habitat cells of the map
      'N_f': their number
      'FAD_i': the FAD of cell \(i\), in whole percent
    python: 'tf.fad(forest, window_size=27).stats.loc[0, "average_fad"]'
    operator: fragmentation.fad
    setting: window = 27
    api: terraflux.fad.fad
    refs:
      - "Riitters, K. H., Wickham, J. D., O'Neill, R. V., Jones, K. B., Smith, E. R., Coulston, J. W., et al. (2002). Fragmentation of continental United States forests. *Ecosystems*, 5(8), 815-822. https://doi.org/10.1007/s10021-002-0209-2"

  # impl: extern/terraflux-py/src/terraflux/fad.py:264-279
  - id: frag_fad_avcon
    name: Average connectivity (AVCON) of FAD
    level: landscape
    theme: map summaries
    unit: "%"
    range: "0 to 100"
    aliases: [AVCON, average connectivity]
    what: |
      The average FAD of the habitat, scaled by the share of the reporting area that is habitat: one number that mixes
      how dense the habitat is around its cells with how much habitat the map has.
    use: |
      Compare reporting units with different amounts of habitat; it is 100 only when the unit is all habitat. The
      multiscale result gives it for each window and for the average of the windows.
    formula: 'AVCON = \overline{FAD} \, \frac{N_f}{N_r}'
    symbols:
      '\overline{FAD}': the average FAD of the habitat cells
      'N_f': the habitat cells
      'N_r': the cells of the reporting unit, all those that are not missing (code 0)
    python: 'tf.fad_multiscale(forest).stats.set_index("observation_scale")["avcon"]'
    operator: fragmentation.fad_multiscale
    api: terraflux.fad.fad_multiscale
    refs:
      - "Vogt, P., & Riitters, K. (2017). GuidosToolbox: universal digital image object analysis. *European Journal of Remote Sensing*, 50(1), 352-361. https://doi.org/10.1080/22797254.2017.1330650"

