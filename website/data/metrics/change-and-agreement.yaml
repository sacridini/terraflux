  # impl: _validation.py:366-369
  - id: chg_correctness
    name: "Correctness"
    level: map
    theme: agreement
    unit: "% of cells"
    range: "0 ≤ x ≤ 100"
    aliases: [overall accuracy, percent agreement]
    what: |
      The percent of cells with the same class in both maps.
    use: |
      Inflated by persistence when most cells do not change: compare with the null model (no change).
    formula: |
      correctness = 100\,\frac{\sum_i n_{ii}}{N}
    symbols:
      'n_{ii}': "cells of class \\(i\\) in both maps (the diagonal of the cross-tabulation)"
      'N': "total number of cells with data"
    python: 'tf.simulate.compare_maps(t1, sim)["correctness"]'
    operator: validate.kappa

  # impl: _validation.py:370-377
  - id: chg_cramer
    name: "Cramer's V"
    level: map
    theme: agreement
    unit: "none"
    range: "0 ≤ V ≤ 1"
    what: |
      The strength of the association between the classes of the two maps, from the chi-square of their
      cross-tabulation (computed over the classes each map actually has).
    use: |
      Measures association, not agreement: a map that swaps two classes still has a high V.
    formula: |
      V = \sqrt{\frac{\chi^{2}}{N\,\min(r - 1,\, c - 1)}},\qquad \chi^{2} = \sum_{ij}\frac{(n_{ij} - e_{ij})^{2}}{e_{ij}}
    symbols:
      'e_{ij}': "expected count \\(n_{i+} n_{+j}/N\\)"
      'r, c': "number of classes of each map; V is NaN if a map has one class"
    python: 'tf.simulate.compare_maps(t1, sim)["cramer"]'
    operator: validate.kappa

  # impl: _validation.py:378-384
  - id: chg_jiu
    name: "Joint information uncertainty (JIU)"
    level: map
    theme: agreement
    unit: "none"
    range: "0 ≤ JIU ≤ 1"
    what: |
      The information the two maps share, relative to the information they carry in total (a normalised mutual
      information).
    use: |
      1 when one map determines the other. Like V, it ignores which class is which.
    formula: |
      JIU = \frac{2\,\bigl(H_x + H_y - H_{xy}\bigr)}{H_x + H_y},\qquad H = -\sum p \ln p
    symbols:
      'H_x, H_y': "entropies of the class distributions of the two maps"
      'H_{xy}': "entropy of the joint distribution."
    python: 'tf.simulate.compare_maps(t1, sim)["jiu"]'
    operator: validate.kappa

