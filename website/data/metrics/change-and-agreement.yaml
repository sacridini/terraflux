  # impl: _run.py:60-69; _validation.py:83-137 (three-map budget)
  - id: chg_hits
    name: "Hits, misses, false alarms and wrong hits"
    level: map
    theme: agreement
    unit: "cells (agreement) or share of the cells (three-map)"
    range: "≥ 0"
    aliases: [omission, commission, null successes]
    what: |
      The four ways a simulation can treat a cell relative to the starting map. A miss is observed change simulated as
      persistence; a hit is change simulated correctly; a wrong hit is change simulated as a different class; a false
      alarm is persistence simulated as change.
    use: |
      Judge a simulation by these and not by overall agreement, which is dominated by persistence.
    formula: |
      hits = \#\{o \neq a,\, s \neq a,\, s = o\},\quad misses = \#\{o \neq a,\, s = a\},\quad wrong = \#\{o \neq a,\, s \neq a,\, s \neq o\},\quad false = \#\{o = a,\, s \neq a\}
    symbols:
      'a, o, s': "class of a cell in the start, observed and simulated maps. Counts in `agreement`; shares of the area in `agreement_budget` (three-map), which adds `correct_rejections` (persistence simulated as persistence)."
    python: '{k: round(v, 4) for k, v in tf.simulate.agreement(t1, sim, t0).items() if k != "quantity"}'
    operator: validate.agreement
    refs:
      - "Pontius et al. (2008). Comparing the input, output, and validation maps for several models of land change. Annals of Regional Science 42: 11-37."
      - "Pontius et al. (2011). Comparison of three maps at multiple resolutions: a case study of land change simulation in Cho Don District, Vietnam. Annals of the Association of American Geographers 101: 45-62."

  # impl: _run.py:65-68
  - id: chg_figure_of_merit
    name: "Figure of merit"
    level: map
    theme: agreement
    unit: "none"
    range: "0 ≤ FoM ≤ 1"
    aliases: [FoM, Pontius figure of merit]
    what: |
      The share of the area of observed or simulated change where both agree: hits divided by the sum of hits, misses,
      wrong hits and false alarms. It ignores persistence, so it is not inflated by the cells that did not change.
    use: |
      A simulation without any change scores 0. Typical values are low (10-30 percent); compare with other models, not
      with 1.
    formula: |
      FoM = \frac{H}{M + H + W + F}
    symbols:
      'H': "hits"
      'M': "misses"
      'W': "wrong hits"
      'F': "false alarms. `validate.agreement` uses this form; the FUTURES binary version (below) has no wrong hits."
    python: 'tf.simulate.agreement(t1, sim, t0)["figure_of_merit"]'
    operator: validate.agreement
    refs:
      - "Pontius et al. (2008). Comparing the input, output, and validation maps for several models of land change. Annals of Regional Science 42: 11-37."

  # impl: _validation.py:83-164
  - id: chg_budget
    name: "Three-map agreement budget"
    level: map
    theme: three-map
    unit: "share of the area"
    range: "0 ≤ x ≤ 1; the five components sum to 1"
    what: |
      A comparison of the map at the start, the reference at the end and the simulated map at the end, at one or more
      resolutions. It splits the area into misses, hits, wrong hits, false alarms and correct rejections, for the
      whole map, for each class and for each transition.
    use: |
      At coarser resolutions (`factors`), blocks give partial credit to near misses.
    formula: |
      misses = \sum_{i \neq j} T_{iji},\quad hits = \sum_{i \neq j} T_{ijj},\quad wrong = \sum_{i,j,k \text{ distinct}} T_{ijk},\quad false = \sum_{j \neq k} T_{jjk},\quad correct\ rejections = \sum_i T_{iii}
    symbols:
      'T_{ijk}': "share of the area with class \\( i \\) in the start map, \\( j \\) in the reference end map and \\( k \\) in the simulated end map (the three-dimensional table, `ThreeMapComparison.table()`). Per class or transition the sums are restricted to the starting class (and end class); rows with from equal to to are not meaningful."
    python: 'tf.simulate.three_map_comparison(t0, t1, sim, factors=[1, 4]).agreement_budget().query("level == ''overall''")'
    operator: validate.three_map
    refs:
      - "Pontius et al. (2011). Comparison of three maps at multiple resolutions: a case study of land change simulation in Cho Don District, Vietnam. Annals of the Association of American Geographers 101: 45-62."
      - "Moulds et al. (2015). An open and extensible framework for spatially explicit land use change modelling: the lulcc R package. Geoscientific Model Development 8: 3215-3229 (function AgreementBudget)."

  # impl: _validation.py:168-220
  - id: chg_fom_three_map
    name: "Three-map figure of merit (overall, class, transition)"
    level: map
    theme: three-map
    unit: "none"
    range: "0 ≤ FoM ≤ 1"
    what: |
      The figure of merit at the three levels of the three-map comparison: overall, for change from each class and for
      each from-to transition, at each resolution.
    use: |
      The overall value equals `figure_of_merit` of `validate.agreement` at factor 1.
    formula: |
      FoM = \frac{H}{1 - CR},\qquad FoM_i = \frac{H_i}{M_i + H_i + W_i + F_i},\qquad FoM_{ij} = \frac{H_{ij}}{H_{ij} + M_{ij} + F_{ij}}
    symbols:
      'CR': "correct rejections"
      'H, M, W, F': "hits, misses, wrong hits and false alarms for the whole map or for class \\( i \\); for a transition \\( i \\to j \\) the denominator is the area of observed \\( i \\to j \\) plus that of simulated \\( i \\to j \\) minus the hits."
    python: 'tf.simulate.three_map_comparison(t0, t1, sim, factors=[1, 4]).figure_of_merit()["overall"]'
    operator: validate.three_map
    refs:
      - "Pontius et al. (2011). Comparison of three maps at multiple resolutions: a case study of land change simulation in Cho Don District, Vietnam. Annals of the Association of American Geographers 101: 45-62 (eqs. 9-11)."
      - "Moulds et al. (2015). An open and extensible framework for spatially explicit land use change modelling: the lulcc R package. Geoscientific Model Development 8: 3215-3229 (function FigureOfMerit)."

  # impl: _validation.py:395-468
  - id: chg_error_budget
    name: "Error budget levels (no_no ... perfect_perfect)"
    level: map
    theme: agreement
    unit: "share of the cells"
    range: "0 ≤ x ≤ 1"
    aliases: [no_no, no_medium, medium_medium, medium_perfect, perfect_perfect]
    what: |
      The agreement expected when the model has no, medium or perfect information about the quantity and location of
      change: no_no, no_medium, medium_medium, medium_perfect and perfect_perfect (always 1), at the map's resolution
      and at coarser ones.
    use: |
      From MOLUSCE's validation: a simulation is only worth trusting if medium_medium is well above no_medium.
    formula: |
      no\_no = \frac{1}{N}\sum_c \sum_k \min\Bigl(r_{ck},\, \tfrac{1}{K}\Bigr),\quad no\_medium = \tfrac{1}{N}\sum_c\sum_k \min\bigl(r_{ck},\, \bar{s}_k\bigr),\quad medium\_medium = \tfrac{1}{N}\sum_c\sum_k \min\bigl(r_{ck},\, s_{ck}\bigr),\quad medium\_perfect = \sum_k \min(\bar{r}_k, \bar{s}_k)
    symbols:
      'r_{ck}, s_{ck}': "indicator (share, after aggregation) of class \\( k \\) in cell or block \\( c \\) of the reference and the simulated map"
      '\bar{r}_k, \bar{s}_k': "their means"
      'K': "number of classes. The difference between the levels shows what is gained by knowing the quantities and the locations."
    python: 'tf.simulate.error_budget(t1, sim, iterations=3)'
    operator: validate.error_budget
    refs:
      - "Pontius (2002). Statistical methods to partition effects of quantity and location during comparison of categorical maps at multiple resolutions. Photogrammetric Engineering and Remote Sensing 68: 1041-1049."
      - "MOLUSCE plugin for QGIS (validation tab)."

