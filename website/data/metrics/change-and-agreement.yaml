  - id: chg_assess_matrix
    name: "Estimated error matrix (area proportions)"
    level: map
    theme: accuracy
    unit: "share of the area"
    range: "0 ≤ p_ij ≤ 1; sums to 1"
    what: |
      The confusion matrix with each cell given as an estimated proportion of the map area, so that it accounts for
      the unequal sampling of the strata. The matrix of sample counts is also returned.
    use: |
      The base from which user's, producer's and overall accuracy and the areas are derived; report it with the sample
      size.
    formula: |
      \hat{p}_{ij} = W_i\,\frac{n_{ij}}{n_{i+}}
    symbols:
      '\hat{p}_{ij}': "estimated share of the area mapped as class \\(i\\) whose reference class is \\(j\\) (rows the map, columns the reference; cells without sample points are NaN)"
      'W_i': "area share of map class \\(i\\)"
      'n_{ij}, n_{i+}': "sample points of map class \\(i\\) with reference class \\(j\\), and all those of class \\(i\\)"
    python: 'tf.accuracy.assess(lu.isel(band=1), pts, cell_area=250_000).matrix'
    operator: accuracy.assess
    refs:
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"
