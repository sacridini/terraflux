  # impl: _validation.py:568-571
  - id: chg_futures_allocation
    name: "Allocation disagreement (FUTURES)"
    level: class
    theme: components
    unit: "share of the cells"
    range: "0 ≤ x ≤ 1"
    what: |
      The disagreement per class from cells being in the wrong place even when the amount is right, and its total.
    use: |
      Quantity plus allocation equals 1 minus the overall agreement; it is the same split as the quantity and exchange
      + shift of diffeR.
    formula: |
      a_k = \frac{2\min\bigl(n_{k+} - n_{kk},\, n_{+k} - n_{kk}\bigr)}{N},\qquad A = \frac{1}{2}\sum_k a_k
    symbols:
      'n_{kk}': "cells of class \\(k\\) in both maps"
      'n_{k+}, n_{+k}': "cells of class \\(k\\) in the simulation and in the reference; returned as `allocation` and `total_allocation`"
    python: 'tf.simulate.futures_validation(t1, sim)["total_allocation"]'
    operator: validate.futures
    refs:
      - "Pontius & Millones (2011). Death to Kappa: birth of quantity disagreement and allocation disagreement for accuracy assessment. International Journal of Remote Sensing 32: 4407-4429. doi:10.1080/01431161.2011.552923"
      - "r.futures.validation, GRASS GIS addon."

  # impl: _validation.py:579-591
  - id: chg_kappa_simulation
    name: "Kappa simulation"
    level: map
    theme: kappa
    unit: "none"
    range: "≤ 1"
    aliases: [KSimulation, Ksim]
    what: |
      A kappa whose expected agreement accounts for the change that took place: how much better the simulation agrees
      with the reference than a model that knew each class's overall transition probabilities but not where. It is 0
      when no better than that.
    use: |
      A fairer benchmark than kappa for land change, where persistence inflates agreement.
    formula: |
      \kappa_{sim} = \frac{P_o - P_e^{sim}}{1 - P_e^{sim}},\qquad P_e^{sim} = \sum_i d_i \sum_j P(s{=}j \mid o_0{=}i)\,P(r{=}j \mid o_0{=}i)
    symbols:
      'P_o': "proportion of cells with the simulated class equal to the reference"
      'd_i': "share of cells of class \\( i \\) in the original (start) map"
      'P(s{=}j \mid o_0{=}i)': "share of start-class-\\( i \\) cells that are \\( j \\) in the simulation, and \\( P(r{=}j \\mid o_0{=}i) \\) in the reference. Returned as `kappasimulation` when the original map is given."
    python: 'tf.simulate.futures_validation(t1, sim, t0)["kappasimulation"]'
    operator: validate.futures
    refs:
      - "van Vliet et al. (2011). Revisiting Kappa to account for change in the accuracy assessment of land-use change models. Ecological Modelling 222: 1367-1375."

  # impl: _validation.py:553-562
  - id: chg_futures_binary
    name: "Binary change metrics (FUTURES)"
    level: map
    theme: agreement
    unit: "share of the cells / none"
    range: "0 ≤ x ≤ 1"
    aliases: [producer accuracy, user accuracy]
    what: |
      For two classes (for example undeveloped and developed) with the original map given: misses, hits, false alarms,
      null successes (persistence simulated correctly) and initially developed, as shares of the cells, plus the
      figure of merit, producer's and user's accuracy of the change.
    use: |
      Without wrong hits, the FoM here equals the general one. Run on 0/1 maps (for example forest or not).
    formula: |
      FoM = \frac{H}{M + H + F},\qquad producer = \frac{H}{M + H},\qquad user = \frac{H}{H + F}
    symbols:
      'H, M, F': "hits, misses and false alarms of the cells that were class 0 at the start (class 1 gain is the change); `initially_developed` is the share of cells already 1. There are no wrong hits with two classes."
    python: '{k: round(v, 4) if isinstance(v, float) else v for k, v in tf.simulate.futures_validation(r, s, o).items() if k not in ("quantity", "allocation")}'
    operator: validate.futures
