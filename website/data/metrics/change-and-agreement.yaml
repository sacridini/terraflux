family: change-and-agreement
title: Change and agreement
order: 90
source: "diffeR (Pontius & Santacruz), OpenLand (intensity analysis), lulcc (three-map comparison), MOLUSCE, r.futures.validation, Dinamica EGO (fuzzy similarity), mapaccuracy (Olofsson et al. 2014, Stehman 2014)"
intro: |
  Measures that compare two maps of classes: an earlier and a later map of land use (change), a simulation and the observed
  map (agreement), or a classified map and a sample of reference points (accuracy). They are the measures of the
  [change detection](../../tutorials/change-detection/) and [land change](../../tutorials/land-change/) tutorials.

  The cards show their values on the land use of Sibuyan Island, the Philippines, in 1997 and 2011 that ships with the
  library (`lu`, two bands as the float arrays `t0` and `t1`, with 255 read as no value: 5 classes, 7 226 cells with data,
  743 of them changed), and on `sim`, a simulated 2011 map made from them, since the island has no model run to judge: it
  takes `t1`, undoes half of the changes (back to the 1997 class) and flips 1 percent of the cells that did not change, with
  a seeded generator, so that each measure has something to say. It is not the result of any land change model. The accuracy
  cards use the 2011 map, a stratified random sample of it (`pts`, 100 points at least in each class) whose reference
  class is read from `sim`, standing in for the labels of an interpreter. The binary card uses forest (class 1) against
  the rest, with the loss of forest as the change, and the card for the sample cross-tabulation a small toy table.

  Conventions: a cross-tabulation `n` has the comparison map (or the earlier map) in the rows and the reference map (or the
  later map) in the columns; cells without a value in any map are left out.
example: |
  import numpy as np
  import pandas as pd
  import terraflux as tf

  lu = tf.load_raster(tf.simulate.example_data("sibuyan_landuse"))      # Sibuyan Island, 1997 and 2011, 5 classes
  t0 = np.asarray(lu.isel(band=0)).astype(float)
  t1 = np.asarray(lu.isel(band=1)).astype(float)
  t0[t0 == 255] = np.nan                                                # 255 is no value
  t1[t1 == 255] = np.nan

  # a simulated 2011: undo half of the changes and flip 1 percent of the cells that did not change
  rng = np.random.default_rng(1)
  sim = t1.copy()
  changed = (t0 != t1) & ~np.isnan(t0) & ~np.isnan(t1)
  undo = changed & (rng.random(t0.shape) < 0.5)
  sim[undo] = t0[undo]
  stay = ~changed & ~np.isnan(t0)
  flip = stay & (rng.random(t0.shape) < 0.01)
  sim[flip] = np.where(t0[flip] == 1, 2, 1)

  zones = np.where(np.arange(t1.shape[1]) < t1.shape[1] // 2, 1.0, 2.0) * np.ones(t1.shape)   # a west and an east stratum
  nonforest = lambda a: np.where(np.isnan(a), np.nan, (a != 1).astype(float))                # the rest against forest (class 1)
  o, r, s = nonforest(t0), nonforest(t1), nonforest(sim)

  pts = tf.accuracy.sample(lu.isel(band=1), n=100, seed=1)               # a stratified sample of the 2011 map
  pts["reference"] = sim[pts["row"], pts["col"]]                         # its reference labels, read from the simulation
metrics:
  # impl: _change.py:57-95
  - id: chg_crosstab
    name: "Transition (cross-tabulation) matrix"
    level: transition
    theme: components
    unit: "cells"
    range: "n_ij ≥ 0"
    what: |
      The number of cells of class i in the first map and class j in the second. It is the input of every disagreement
      and kappa measure.
    use: |
      For change between two dates read it as from (rows) to (columns); for error as comparison (rows) and reference
      (columns).
    formula: |
      n_{ij} = \#\{\text{cells with class } i \text{ in the first map and } j \text{ in the second}\}
    symbols:
      'n_{i+}, n_{+j}': "row sums and column sums"
      'N': "total number of cells; the diagonal \\(n_{ii}\\) holds the persistence"
    python: 'tf.simulate.crosstab(t0, t1)'
    operator: change.crosstab

  # impl: _difference.py:54-62, 71-117
  - id: chg_gain_loss
    name: "Gain, loss and persistence of a class (Gain, Loss, Persistence)"
    level: class
    theme: components
    unit: "cells (or the unit of the matrix)"
    range: "≥ 0"
    aliases: [omission, commission, agreement]
    what: |
      For each class, the cells that arrived in it (gain), left it (loss) and stayed (persistence) between two maps.
      The same columns are named Omission, Commission and Agreement when the matrix compares a map with a reference.
    use: |
      Gain and loss show change by class; quantity, exchange and shift (below) split them further.
    formula: |
      Gain_j = n_{+j} - n_{jj},\qquad Loss_i = n_{i+} - n_{ii},\qquad Persistence_i = n_{ii}
    symbols:
      'n_{ij}': "rows the earlier map, columns the later map. In `analysis=\"error\"` (rows the comparison, columns the reference) `Omission` = \\( n_{+j} - n_{jj} \\), `Commission` = \\( n_{i+} - n_{ii} \\), `Agreement` = \\( n_{ii} \\) (diffeR spells it \"Comission\")."
    python: 'tf.simulate.difference_components(tf.simulate.crosstab(t0, t1), analysis="change")'
    operator: change.components
    setting: analysis = change
    refs:
      - "Pontius & Santacruz (2014). Quantity, exchange, and shift components of difference in a square contingency table. International Journal of Remote Sensing 35: 7543-7554."

  # impl: _difference.py:59, 108-110, 141
  - id: chg_quantity
    name: "Quantity difference"
    level: class
    theme: components
    unit: "cells (or the unit of the matrix)"
    range: "≥ 0"
    aliases: [quantity disagreement]
    what: |
      The part of the difference between two maps that comes from a different number of cells in each class (the net
      change), independent of where they are.
    use: |
      A map with the right quantities but wrong places has Q = 0 and all its disagreement in allocation.
    formula: |
      Q_i = \bigl| n_{i+} - n_{+i} \bigr|,\qquad Q = \frac{1}{2}\sum_i Q_i
    symbols:
      'n_{i+}, n_{+i}': "row and column totals of class \\( i \\). The overall row of `difference_components` halves the sum because each unit of net change counts in two classes."
    python: 'tf.simulate.difference_components(tf.simulate.crosstab(sim, t1))[["Category", "Quantity"]]'
    operator: change.components
    refs:
      - "Pontius & Millones (2011). Death to Kappa: birth of quantity disagreement and allocation disagreement for accuracy assessment. International Journal of Remote Sensing 32: 4407-4429. doi:10.1080/01431161.2011.552923"

  # impl: _difference.py:48-52, 143
  - id: chg_exchange
    name: "Exchange difference"
    level: class
    theme: components
    unit: "cells (or the unit of the matrix)"
    range: "≥ 0"
    what: |
      The part of the allocation difference that is a swap: cells of class i that went to class j balanced by cells of
      j that went to i.
    use: |
      Exchange needs two classes; a pure one-way transition has none.
    formula: |
      E_i = \sum_{j \neq i} 2\min(n_{ij}, n_{ji}),\qquad E = \frac{1}{2}\sum_i E_i = \sum_{i<j} 2\min(n_{ij}, n_{ji})
    symbols:
      'n_{ij}': "cells of the cross-tabulation. In the overall row each swap is counted once."
    python: 'tf.simulate.overall_difference(tf.simulate.crosstab(sim, t1))["exchange"]'
    operator: change.components
    refs:
      - "Pontius & Santacruz (2014). Quantity, exchange, and shift components of difference in a square contingency table. International Journal of Remote Sensing 35: 7543-7554."

  # impl: _difference.py:61, 143
  - id: chg_shift
    name: "Shift difference"
    level: class
    theme: components
    unit: "cells (or the unit of the matrix)"
    range: "≥ 0"
    what: |
      The part of the allocation difference that is not an exchange: cells that move among three or more classes
      without a matching reverse flow.
    use: |
      Shift usually shrinks fastest as the resolution coarsens (see difference_resolutions).
    formula: |
      S_i = (n_{i+} + n_{+i} - 2n_{ii}) - Q_i - E_i,\qquad S = \frac{1}{2}\sum_i S_i
    symbols:
      'Q_i, E_i': "quantity and exchange of class \\( i \\)."
    python: 'tf.simulate.overall_difference(tf.simulate.crosstab(sim, t1))["shift"]'
    operator: change.components
    refs:
      - "Pontius & Santacruz (2014). Quantity, exchange, and shift components of difference in a square contingency table. International Journal of Remote Sensing 35: 7543-7554."

  # impl: _difference.py:120-144
  - id: chg_allocation
    name: "Allocation and overall difference"
    level: map
    theme: components
    unit: "cells (or the unit of the matrix)"
    range: "≥ 0"
    aliases: [allocation disagreement, overall disagreement]
    what: |
      The allocation difference is the part of the total disagreement that is not quantity (exchange plus shift); the
      overall difference is everything off the diagonal.
    use: |
      Report quantity and allocation separately: they point to different causes (demand versus location).
    formula: |
      D = \sum_{i \neq j} n_{ij} = Q + A,\qquad A = E + S
    symbols:
      'Q': "quantity"
      'E': "exchange"
      'S': "shift. Returned by `overall_difference` as `allocation` and `overall`."
    python: 'tf.simulate.overall_difference(tf.simulate.crosstab(sim, t1))'
    operator: change.components
    refs:
      - "Pontius & Millones (2011). Death to Kappa: birth of quantity disagreement and allocation disagreement for accuracy assessment. International Journal of Remote Sensing 32: 4407-4429. doi:10.1080/01431161.2011.552923"

  # impl: _difference.py:323-375
  - id: chg_resolutions
    name: "Differences at coarser resolutions (Multiples, Resolution)"
    level: map
    theme: resolution
    unit: "% of the domain"
    range: "≥ 0"
    what: |
      Quantity, exchange, shift and overall difference when the maps are compared at blocks of factor^k cells. The
      differences generally fall as the blocks grow, since small displacements cancel inside a block.
    use: |
      Shows at what spatial scale the model is right: disagreement that vanishes at 4-cell blocks was only a small
      displacement.
    formula: |
      Q^{(f)},\; E^{(f)},\; S^{(f)},\; D^{(f)} \text{ of the composite matrix of blocks of side } f
    symbols:
      'f': "block side in cells (1, `factor`, `factor`², ...). At \\( f = 1 \\) the ordinary matrix, at coarser sizes the composite matrix (below), as a percent of the domain. Blocks cut by the edge or with a missing cell are left out, which can make the coarsest rows NaN."
    python: 'tf.simulate.difference_resolutions(sim, t1, factor=4)'
    operator: change.resolutions
    refs:
      - "Pontius (2002). Statistical methods to partition effects of quantity and location during comparison of categorical maps at multiple resolutions. Photogrammetric Engineering and Remote Sensing 68: 1041-1049."
      - "Pontius & Cheuk (2006). A generalized cross-tabulation matrix to compare soft-classified maps at multiple resolutions. International Journal of Geographical Information Science 20: 1-30."

  # impl: _difference.py:240-288
  - id: chg_composite
    name: "Composite cross-tabulation (composite)"
    level: block
    theme: resolution
    unit: "share of the domain"
    range: "0 ≤ x ≤ 1; the matrix sums to 1"
    what: |
      A cross-tabulation at a coarser resolution in which each block of cells is a mix of classes. The agreement of a
      class in a block is the smaller of its two shares; the remainder is spread over pairs of classes.
    use: |
      The matrix whose differences `chg_resolutions` reports. Needs complete blocks.
    formula: |
      n_{ii} = \frac{\sum_b w_b \min(c_{ib}, r_{ib})}{\sum_b w_b},\qquad n_{ij} = \frac{\sum_b w_b \dfrac{(c_{ib} - m_{ib})(r_{jb} - m_{jb})}{1 - \sum_k m_{kb}}}{\sum_b w_b}\; (i \neq j)
    symbols:
      'c_{ib}, r_{ib}': "share of class \\( i \\) in block \\( b \\) of the comparison and the reference map; \\( m_{ib} = \\min(c_{ib}, r_{ib}) \\)"
      'w_b': "cells of the block."
    python: 'tf.simulate.composite_matrix(sim, t1, 4)'
    operator: change.composite
    refs:
      - "Pontius & Cheuk (2006). A generalized cross-tabulation matrix to compare soft-classified maps at multiple resolutions. International Journal of Geographical Information Science 20: 1-30."

  # impl: _difference.py:222-237
  - id: chg_memberships
    name: "Class membership of a block (memberships)"
    level: block
    theme: resolution
    unit: "share of the block"
    range: "0 ≤ x ≤ 1"
    what: |
      The share of each class in every block of factor x factor cells; blocks with a missing cell or cut by the edge
      are NaN.
    use: |
      The input of the composite method and of any fuzzy comparison at coarse resolution.
    formula: |
      m_{ib} = \frac{1}{f^{2}} \sum_{c \in b} 1[\,x_c = i\,]
    symbols:
      'f': "block side"
      'x_c': "class of cell \\( c \\)."
    python: 'tf.simulate.memberships(t1, 4)[1.0]'
    operator: change.memberships
    setting: factor = 4

  # impl: _difference.py:147-184
  - id: chg_sample_to_population
    name: "Sample cross-tabulation scaled to the population"
    level: map
    theme: components
    unit: "population units"
    range: "≥ 0"
    what: |
      Rescales each row of a sample cross-tabulation to the known size of its class in the population, so that the
      sample counts estimate map areas.
    use: |
      For a stratified sample whose strata are the classes of the map.
    formula: |
      N_{ij} = P_i\,\frac{n_{ij}}{n_{i+}}
    symbols:
      'P_i': "population (e.g. cells) of the row's class"
      'n_{ij}': "sample counts. Unlike diffeR the row is matched to its population by class, not by position."
    python: 'tf.simulate.sample_to_population(pd.DataFrame([[40, 10], [5, 45]], index=[1, 2], columns=[1, 2]), {1: 5000, 2: 1200})'
    operator: change.sample_to_population
    refs:
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"

  # impl: _difference.py:380-435 (components, lines 417-422)
  - id: chg_mad_quantity
    name: "MAD quantity"
    level: map
    theme: components
    unit: "unit of the maps"
    range: "≥ 0"
    what: |
      For two continuous maps, the part of the mean absolute deviation due to a net difference in the mean (bias) over
      the strata.
    use: |
      Zero when the two maps have the same mean.
    formula: |
      MAD_{Q} = \Bigl|\frac{1}{n}\sum_{h}\sum_{c \in h} (x_c - y_c)\Bigr|
    symbols:
      'x, y': "the two maps"
      'h': "strata (one by default)"
      'n': "cells in any stratum."
    python: 'tf.simulate.mad(sim, t1)["Quantity"].iloc[0]'
    operator: change.mad
    refs:
      - "Pontius et al. (2008). Components of information for multiple resolution comparison between maps that share a real variable. Environmental and Ecological Statistics 15: 111-142."

  # impl: _difference.py:420
  - id: chg_mad_strata
    name: "MAD strata"
    level: map
    theme: components
    unit: "unit of the maps"
    range: "≥ 0"
    what: |
      The part of the MAD due to deviations that cancel inside each stratum but not between strata.
    use: |
      Give a `strata` map to see whether the bias differs between regions. The term is 0 when the net deviation has
      the same sign in every stratum, as here with a west and an east half.
    formula: |
      MAD_{S} = \frac{1}{n}\sum_{h} \Bigl|\sum_{c \in h} (x_c - y_c)\Bigr| - MAD_{Q}
    symbols:
      'x, y': "the two maps"
      'h': "the strata (one by default, and then this term is 0)"
      'n': "cells in any stratum"
    python: 'tf.simulate.mad(sim, t1, strata=zones)["Strata"].iloc[0]'
    operator: change.mad

  # impl: _difference.py:427-431
  - id: chg_mad_element
    name: "MAD element"
    level: map
    theme: components
    unit: "unit of the maps"
    range: "≥ 0"
    what: |
      The rest of the MAD: the cell-level deviations that cancel when the maps are summed over larger blocks. It falls
      to zero at coarse resolutions.
    use: |
      Shows how much of the error is a displacement at fine scale.
    formula: |
      MAD_{E} = MAD - MAD_{Q} - MAD_{S}
    symbols:
      'MAD, MAD_{Q}, MAD_{S}': "the total, quantity and strata parts of the card above and below; computed per resolution from sums of the deviations over blocks of 2, 4, 8, ... cells (`multiple=True`)"
    python: 'tf.simulate.mad(sim, t1)[["Multiples", "Element"]]'
    operator: change.mad

  # impl: _difference.py:421
  - id: chg_mad_total
    name: "Mean absolute deviation (MAD total)"
    level: map
    theme: components
    unit: "unit of the maps"
    range: "≥ 0"
    what: |
      The mean absolute difference between two continuous maps over the cells with data.
    use: |
      Unlike RMSE it is not dominated by outliers.
    formula: |
      MAD = \frac{1}{n}\sum_{c} |x_c - y_c|
    symbols:
      'x_c, y_c': "values of cell \\(c\\) in the two maps"
      'n': "cells with data in both; the total of the components, `Total`"
    python: 'tf.simulate.mad(sim, t1, multiple=False)["Total"]'
    operator: change.mad

  # impl: _change.py:341-368
  - id: chg_count
    name: "Number of changes per cell (change count)"
    level: cell
    theme: components
    unit: "count"
    range: "0 ≤ k ≤ number of intervals"
    what: |
      For a series of maps, how many times each cell changed class, and the share of the area with each count.
    use: |
      Highlights cells that flicker (map errors or shifting cultivation) versus stable change.
    formula: |
      k_c = \sum_{t} 1[\,x_{c,t} \neq x_{c,t+1}\,],\qquad Percent_k = 100\,\frac{\#\{c: k_c = k\}}{\#\{c\}}
    symbols:
      'x_{c,t}': "class of cell \\( c \\) at time \\( t \\). Cells missing in any map get -1 and are excluded from the shares."
    python: 'tf.simulate.changes(lu).change_count()[1]'
    operator: change.count
    refs:
      - "Exavier & Zeilhofer (2021). OpenLand: software for quantitative analysis and visualization of land use and cover change. The R Journal 12(2): 359-371 (function acc_changes). doi:10.32614/RJ-2021-021"

  # impl: _change.py:272-278
  - id: chg_interval_change
    name: "Interval change (PercentChange, St)"
    level: interval
    theme: intensity
    unit: "% of the study area (PercentChange); % per time unit (St)"
    range: "≥ 0"
    what: |
      The share of the study area that changed in a time interval, and the same per year (annual change intensity).
    use: |
      The interval level of the intensity analysis; compare \( S_t \) between periods and with the uniform intensity
      U.
    formula: |
      PercentChange_t = 100\,\frac{C_t}{A},\qquad S_t = 100\,\frac{C_t}{\Delta_t\, A}
    symbols:
      'C_t': "area that changed in interval \\( t \\)"
      '\Delta_t': "length of the interval"
      'A': "study area (the first period's total)."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).interval'
    operator: change.intensity
    refs:
      - "Aldwaik & Pontius (2012). Intensity analysis to unify measurements of size and stationarity of land changes by interval, category, and transition. Landscape and Urban Planning 106: 103-114."
      - "Exavier & Zeilhofer (2021). OpenLand: software for quantitative analysis and visualization of land use and cover change. The R Journal 12(2): 359-371. doi:10.32614/RJ-2021-021"

  # impl: _change.py:276
  - id: chg_u
    name: "Uniform change intensity (U)"
    level: interval
    theme: intensity
    unit: "% per time unit"
    range: "≥ 0"
    what: |
      The annual intensity that would apply if the change were spread evenly over the whole series. Intervals with St
      above U are fast, below U slow.
    use: |
      The reference line of the interval level.
    formula: |
      U = 100\,\frac{\sum_t C_t}{\Delta\, A}
    symbols:
      '\Delta': "the total length of the series"
      'C_t': "area changed in interval \\( t \\)."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).interval["U"].iloc[0]'
    operator: change.intensity
    refs:
      - "Aldwaik & Pontius (2012). Intensity analysis to unify measurements of size and stationarity of land changes by interval, category, and transition. Landscape and Urban Planning 106: 103-114."

  # impl: _change.py:281-290
  - id: chg_gtj
    name: "Category gain intensity (Gtj)"
    level: class
    theme: intensity
    unit: "% per time unit"
    range: "≥ 0"
    what: |
      For each class and interval, the gross gain relative to the size of the class at the end of the interval. Gains
      are active when Gtj exceeds the interval intensity St.
    use: |
      Class levels of the intensity analysis; `Test` = Y in the stationarity table says the class is active (or
      dormant) in every interval.
    formula: |
      G_{tj} = 100\,\frac{GG_{tj}}{\Delta_t\, A_{t+1,j}}
    symbols:
      'GG_{tj}': "area gained by class \\( j \\) in interval \\( t \\) (`GG_km2`)"
      'A_{t+1,j}': "area of class \\( j \\) at the end of the interval."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).category_gain'
    operator: change.intensity
    refs:
      - "Aldwaik & Pontius (2012). Intensity analysis to unify measurements of size and stationarity of land changes by interval, category, and transition. Landscape and Urban Planning 106: 103-114."

  # impl: _change.py:291
  - id: chg_lti
    name: "Category loss intensity (Lti)"
    level: class
    theme: intensity
    unit: "% per time unit"
    range: "≥ 0"
    what: |
      For each class and interval, the gross loss relative to the size of the class at the start. Losses are active
      when Lti exceeds St.
    use: |
      As Gtj.
    formula: |
      L_{ti} = 100\,\frac{GL_{ti}}{\Delta_t\, A_{t,i}}
    symbols:
      'GL_{ti}': "area lost by class \\( i \\) (`GL_km2`)"
      'A_{t,i}': "area of class \\( i \\) at the start."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).category_loss'
    operator: change.intensity
    refs:
      - "Aldwaik & Pontius (2012). Intensity analysis to unify measurements of size and stationarity of land changes by interval, category, and transition. Landscape and Urban Planning 106: 103-114."

  # impl: _change.py:293-305
  - id: chg_rtin
    name: "Transition intensity into a class (Rtin, Wtn)"
    level: transition
    theme: intensity
    unit: "% per time unit"
    range: "≥ 0"
    what: |
      For the chosen gaining class n, how intensively it takes over each other class i (Rtin), compared with the
      uniform intensity of its gains over all the classes that could be taken (Wtn). Class i is targeted by n when
      Rtin > Wtn.
    use: |
      Tells whether a land use expands preferentially into particular classes. Targeted / avoided classes are listed
      in the transition stationarity table.
    formula: |
      R_{tin} = 100\,\frac{T_{tin}}{\Delta_t\, A_{t,i}},\qquad W_{tn} = 100\,\frac{GG_{tn}}{\Delta_t \sum_{i \neq n} A_{t,i}}
    symbols:
      'T_{tin}': "area that changed from \\( i \\) to \\( n \\) (`T_i2n_km2`)"
      'A_{t,i}': "area of \\( i \\) at the start"
      'GG_{tn}': "gain of \\( n \\). Chosen with `gain=` of `intensity`."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).transition_gain'
    operator: change.intensity
    setting: gain = 2
    refs:
      - "Aldwaik & Pontius (2012). Intensity analysis to unify measurements of size and stationarity of land changes by interval, category, and transition. Landscape and Urban Planning 106: 103-114."

  # impl: _change.py:307-319
  - id: chg_qtmj
    name: "Transition intensity out of a class (Qtmj, Vtm)"
    level: transition
    theme: intensity
    unit: "% per time unit"
    range: "≥ 0"
    what: |
      For the chosen losing class m, how intensively it is lost to each other class j (Qtmj), compared with the
      uniform intensity of its losses over all the classes that could take it (Vtm). Class j targets m when Qtmj >
      Vtm.
    use: |
      Tells which classes replace a given land use.
    formula: |
      Q_{tmj} = 100\,\frac{T_{tmj}}{\Delta_t\, A_{t+1,j}},\qquad V_{tm} = 100\,\frac{GL_{tm}}{\Delta_t \sum_{j \neq m} A_{t+1,j}}
    symbols:
      'T_{tmj}': "area that changed from \\( m \\) to \\( j \\) (`T_m2j_km2`)"
      'A_{t+1,j}': "area of \\( j \\) at the end"
      'GL_{tm}': "loss of \\( m \\). Chosen with `loss=` of `intensity`."
    python: 'tf.simulate.changes(lu).intensity(gain=2, loss=1).transition_loss'
    operator: change.intensity
    setting: loss = 1
    refs:
