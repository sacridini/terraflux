  # impl: _validation.py:353-363
  - id: chg_kappa
    name: "Cohen's kappa of two maps"
    level: map
    theme: kappa
    unit: "none"
    range: "-1 ≤ kappa ≤ 1"
    aliases: [kappa, KIA]
    what: |
      The agreement of two maps cell by cell beyond what chance would give from the class proportions of each map.
    use: |
      Overall agreement can look high only because one class dominates; kappa corrects for that but conflates quantity
      and location (use the next two variants or the disagreement components).
    formula: |
      \kappa = \frac{P_o - P_e}{1 - P_e},\quad P_o = \sum_i p_{ii},\quad P_e = \sum_i p_{i+}\, p_{+i}
    symbols:
      'p_{ij} = n_{ij}/N': "cross-tabulation in proportions over the classes of both maps"
      'p_{i+}, p_{+i}': "marginals."
    python: 'tf.simulate.compare_maps(t1, sim)["kappa"]'
    operator: validate.kappa
    refs:
      - "Cohen (1960). A coefficient of agreement for nominal scales. Educational and Psychological Measurement 20: 37-46."
      - "MOLUSCE plugin for QGIS (validation tab)."

  # impl: _validation.py:364
  - id: chg_kappa_location
    name: "Kappa for location (klocation)"
    level: map
    theme: kappa
    unit: "none"
    range: "≤ 1"
    aliases: [Klocation, K-location]
    what: |
      How well the maps agree in location given the quantities of the classes: kappa rescaled by the best agreement
      possible with those quantities.
    use: |
      High when allocation is right even if the quantities are off.
    formula: |
      \kappa_{loc} = \frac{P_o - P_e}{P_{max} - P_e},\qquad P_{max} = \sum_i \min(p_{i+}, p_{+i})
    symbols:
      'P_o, P_e': "observed agreement and the agreement expected by chance (see kappa)"
      'p_{i+}, p_{+i}': "marginals of the cross-tabulation in proportions; returned as `kappa_location`"
    python: 'tf.simulate.compare_maps(t1, sim)["kappa_location"]'
    operator: validate.kappa
    refs:
      - "Pontius (2000). Quantification error versus location error in comparison of categorical maps. Photogrammetric Engineering and Remote Sensing 66: 1011-1016."
      - "MOLUSCE plugin for QGIS (validation tab)."

  # impl: _validation.py:365
