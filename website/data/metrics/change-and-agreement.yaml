      - "Pontius et al. (2008). Comparing the input, output, and validation maps for several models of land change. Annals of Regional Science 42: 11-37."
      - "r.futures.validation, GRASS GIS addon."

  # impl: _similarity.py:77-122
  - id: chg_similarity
    name: "Fuzzy similarity of two maps"
    level: cell
    theme: similarity
    unit: "none"
    range: "0 ≤ s ≤ 1"
    aliases: [fuzzy kappa, reciprocal similarity]
    what: |
      For each cell with a class, how well that class is found nearby in the other map: 1 if present in the cell,
      2^(-d/2) for the nearest cell of the class at d cells inside a square window, 0 if none. The map mean is the
      similarity.
    use: |
      Tolerates small displacements, unlike cell-by-cell agreement. The result depends on the window size and decay.
    formula: |
      s_c = \min\bigl(m_{c},\, m^{rev}_{c}\bigr),\qquad m_c = 2^{-d_c/2}
    symbols:
      'd_c': "distance in cells from \\( c \\) to the nearest cell of the same class in the other map inside the \\( w \\times w \\) window around \\( c \\) (\\( m_c = 0 \\) if there is none)"
      'm^{rev}_c': "the reverse membership, taken where the other map has a class too (`decay=\"constant\"` gives 1 everywhere in the window). The two means are `first_mean`, `second_mean`; the smaller is `minimum` (Dinamica's two-way similarity)."
    python: 'tf.simulate.fuzzy_similarity(t1, sim, window=5)'
    operator: validate.similarity
    refs:
      - "Hagen (2003). Fuzzy set approach to assessing similarity of categorical maps. International Journal of Geographical Information Science 17: 235-249."
      - "Dinamica EGO software (CSR, UFMG)."

  # impl: _similarity.py:135-170
  - id: chg_similarity_differences
    name: "Similarity of the changes (per window)"
    level: map
    theme: similarity
    unit: "none"
    range: "0 ≤ s ≤ 1"
    what: |
      The fuzzy similarity of the observed change and the simulated change: only cells that changed since the start
      are compared, each in its new class, in windows of growing size. The result per window is the smaller of the two
      means.
    use: |
      Dinamica EGO's validation: a simulation is acceptable when the minimum similarity reaches about 0.5 at the
      window of the spatial tolerance you accept. Windows are odd (1 = exact).
    formula: |
      S_w = \min\bigl(\bar{s}^{sim}_w,\, \bar{s}^{obs}_w\bigr)
    symbols:
      '\bar{s}^{sim}_w': "mean similarity over the simulated changes"
      '\bar{s}^{obs}_w': "over the observed changes, both in a window of side \\( w \\). Columns `simulated`, `observed`, `minimum` and the number of cells of each."
    python: 'tf.simulate.similarity_of_differences(t0, t1, sim, windows=[1, 3, 5])'
    operator: validate.similarity
    setting: windows = [1, 3, 5]
    refs:
      - "Hagen (2003). Fuzzy set approach to assessing similarity of categorical maps. International Journal of Geographical Information Science 17: 235-249."
      - "Dinamica EGO software (CSR, UFMG)."

  # impl: accuracy.py:413-473 (olofsson), 498-579 (stehman)
  - id: chg_assess_overall
    name: "Overall accuracy (with standard error)"
    level: map
    theme: accuracy
    unit: "none"
    range: "0 ≤ OA ≤ 1"
    what: |
      The proportion of the map's area that is correctly classified, estimated from a stratified random sample of
      reference points; given with its standard error and confidence interval.
    use: |
      Not the share of sample points that agree, unless the sample is proportional. Needs a design-based sample
      (`accuracy.sample`).
    formula: |
      OA = \sum_j \hat{p}_{jj},\quad \hat{p}_{ij} = W_i\,\frac{n_{ij}}{n_{i+}},\quad SE(OA) = \sqrt{\sum_i W_i^{2}\,\frac{U_i(1 - U_i)}{n_{i+} - 1}},\quad CI = z\,SE
    symbols:
      'W_i = A_i/A': "mapped area share of stratum (map class) \\( i \\)"
      'n_{ij}': "sample points of map class \\( i \\) with reference class \\( j \\)"
      'U_i = \hat{p}_{ii}/\hat{p}_{i+}': "user's accuracy"
      'z': "normal quantile of `confidence` (0.95). With `strata` of their own (`estimator=\"stehman\"`) the estimator of Stehman (2014) with finite population correction is used."
    python: 'tf.accuracy.assess(lu.isel(band=1), pts, cell_area=250_000).overall'
    operator: accuracy.assess
    refs:
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"
      - "Stehman (2014). Estimating area and map accuracy for stratified random sampling when the strata are different from the map classes. International Journal of Remote Sensing 35: 4923-4939."

  # impl: accuracy.py:446, 452-458
  - id: chg_assess_user
    name: "User's accuracy (with standard error)"
    level: class
    theme: accuracy
    unit: "none"
    range: "0 ≤ UA ≤ 1"
    aliases: [commission error, reliability]
    what: |
      For each map class, the probability that a cell mapped as that class really is that class: 1 minus the
      commission error.
    use: |
      Tells the map user how far to trust a class.
    formula: |
      UA_j = \frac{\hat{p}_{jj}}{\hat{p}_{j+}} = \frac{n_{jj}}{n_{j+}},\qquad SE(UA_j) = \sqrt{\frac{UA_j(1 - UA_j)}{n_{j+} - 1}}
    symbols:
      '\hat{p}_{jj}, \hat{p}_{j+}': "estimated area share of the cells mapped as class \\(j\\) that are \\(j\\), and of all cells mapped as \\(j\\)"
      'n_{jj}, n_{j+}': "sample points mapped and referenced as \\(j\\), and mapped as \\(j\\); columns `user_accuracy`, `user_se`, `user_ci`"
    python: 'tf.accuracy.assess(lu.isel(band=1), pts, cell_area=250_000).table[["class", "user_accuracy", "user_se"]]'
    operator: accuracy.assess
    refs:
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"

  # impl: accuracy.py:447, 459-465
  - id: chg_assess_producer
    name: "Producer's accuracy (with standard error)"
    level: class
    theme: accuracy
    unit: "none"
    range: "0 ≤ PA ≤ 1"
    aliases: [omission error, sensitivity]
    what: |
      For each reference class, the probability that a cell that really is that class was mapped as such: 1 minus the
      omission error, weighted by the mapped areas.
    use: |
      Differs from the share of the class's points correctly mapped because the strata have different sizes.
    formula: |
      PA_j = \frac{\hat{p}_{jj}}{\hat{p}_{+j}},\qquad \hat{p}_{+j} = \sum_i W_i\,\frac{n_{ij}}{n_{i+}}
    symbols:
      '\hat{p}_{jj}': "estimated area share of the cells that are class \\(j\\) in both the map and the reference"
      '\hat{p}_{+j}': "estimated area share of reference class \\(j\\); the standard error follows Olofsson et al. (2014), eq. 6; columns `producer_accuracy`, `producer_se`, `producer_ci`"
      'W_i': "area share of map class \\(i\\)"
    python: 'tf.accuracy.assess(lu.isel(band=1), pts, cell_area=250_000).table[["class", "producer_accuracy", "producer_se"]]'
    operator: accuracy.assess
    refs:
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"

  # impl: accuracy.py:448, 466-470, 812-815
  - id: chg_assess_area
    name: "Estimated class area (with confidence interval)"
    level: class
    theme: accuracy
    unit: "share, cells and hectares"
    range: "≥ 0"
    aliases: [area estimate, adjusted area]
    what: |
      The area of each class estimated from the sample (error-adjusted), instead of counted on the map, with its
      standard error and confidence interval. It corrects for the classification errors.
    use: |
      Report these areas with their intervals, particularly for rare classes and change, where the map count is
      biased.
    formula: |
      A_j = A\,\hat{p}_{+j},\qquad SE(\hat{p}_{+j}) = \sqrt{\sum_i W_i^{2}\,\frac{\frac{n_{ij}}{n_{i+}}\bigl(1 - \frac{n_{ij}}{n_{i+}}\bigr)}{n_{i+} - 1}}
    symbols:
      'A': "total number of cells"
      '\hat{p}_{+j}': "estimated area share of class \\( j \\). Columns `area_share`, `area_cells`, `area_ha` and their `se` / `ci`; hectares use `cell_area` (m2)."
    python: 'tf.accuracy.assess(lu.isel(band=1), pts, cell_area=250_000).table[["class", "area_share", "area_ha", "area_ha_ci"]]'
    operator: accuracy.assess
    refs:
      - "Olofsson et al. (2013). Making better use of accuracy data in land change studies: estimating accuracy and area and quantifying uncertainty using stratified estimation. Remote Sensing of Environment 129: 122-131."
      - "Olofsson et al. (2014). Good practices for estimating area and assessing accuracy of land change. Remote Sensing of Environment 148: 42-57. doi:10.1016/j.rse.2014.02.015"

