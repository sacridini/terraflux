  # ---------------------------------------------------------------- turnover
  # impl: indices.cpp:1725
  - id: SORENSON
    name: Sorenson dissimilarity
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: 'Presence-absence dissimilarity between the two neighbour sets: 0 when they hold the same labels, 1 when they share none.'
    formula: '\mathrm{SORENSON} = 1 - \frac{2A}{2A+B+C}'
    symbols:
      'A': 'the labels in both sets'
      'B': 'the labels only in set 1'
      'C': 'the labels only in set 2'
    use: Needs two conditions. Undefined (NaN) when both sets are empty; it is 1 when \(A=0\) but both \(B\) and \(C\) are non-zero. Also a `cluster` dissimilarity (the default).
    python: 'at(tf.bio.spatial_analysis(bd, C2, "sorenson"), "SORENSON")'
    operator: bio.spatial
    setting: calculations = sorenson
    aliases: [Sørensen, Dice]

  # impl: indices.cpp:1729
  - id: JACCARD
    name: Jaccard dissimilarity
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: One minus the share of labels the two sets have in common out of all labels found in either.
    formula: 'J = 1 - \frac{A}{A+B+C}'
    symbols:
      'A, B, C': 'the labels in both sets, only in set 1 and only in set 2, as in SORENSON'
    use: Same edge rules as SORENSON; counts unshared labels more heavily.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "jaccard"), "JACCARD")'
    operator: bio.spatial
    setting: calculations = jaccard

  # impl: indices.cpp:1770
  - id: S2
    name: S2 dissimilarity (Lennon)
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: 'Turnover that does not depend on differences in richness between the sets: the shared labels are compared with the smaller of the two unshared parts.'
    formula: 'S2 = 1 - \frac{A}{A + \min(B, C)}'
    symbols:
      'A, B, C': 'the labels in both sets, only in set 1 and only in set 2, as in SORENSON'
    use: Use when the sets differ much in richness, where Sorenson mixes turnover with nestedness. Undefined when no label is found.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "s2"), "S2")'
    operator: bio.spatial
    setting: calculations = s2
    refs: ["Lennon et al. (2001). The geographical structure of British bird distributions: diversity, spatial turnover and scale. Journal of Animal Ecology 70: 966-979. doi:10.1046/j.0021-8790.2001.00563.x"]

  # impl: indices.cpp:1719
  - id: KULCZYNSKI2
    name: Kulczynski 2 dissimilarity
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: One minus the mean of the share of set 1 labels found in set 2 and of set 2 labels found in set 1.
    formula: 'K2 = 1 - \frac{1}{2}\left(\frac{A}{A+B} + \frac{A}{A+C}\right)'
    symbols:
      'A, B, C': 'the labels in both sets, only in set 1 and only in set 2, as in SORENSON'
    use: Treats the two sets symmetrically while weighting by each set's own richness.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "kulczynski2"), "KULCZYNSKI2")'
    operator: bio.spatial
    setting: calculations = kulczynski2

  # impl: indices.cpp:1767
  - id: BETA_2
    name: Beta diversity (Whittaker form)
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Gamma richness over the larger set richness, minus one.
    formula: '\beta = \frac{A+B+C}{\max(A+B,\ A+C)} - 1'
    symbols:
      'A, B, C': 'the labels in both sets, only in set 1 and only in set 2, as in SORENSON'
    use: 0 when one set contains the other; the maximum depends on the set sizes.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "beta_diversity"), "BETA_2")'
    operator: bio.spatial
    setting: calculations = beta_diversity
    aliases: [Whittaker beta]

  # impl: indices.cpp:1736
  - id: NEST_RESULTANT
    name: Nestedness-resultant dissimilarity
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: The part of dissimilarity that comes from nestedness, the poorer set being a subset of the richer one (Baselga).
    formula: 'D_{nest} = \frac{|B - C|}{2A+B+C}\cdot\frac{A}{A + \min(B, C)}'
    symbols:
      'A, B, C': 'the labels in both sets, only in set 1 and only in set 2, as in SORENSON'
    use: 0 when \(A = 0\) and both \(B, C > 0\) (no overlap), NaN with no overlap and one set empty. Subtract from Sorenson for the spatial turnover part.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "nestedness_resultant"), "NEST_RESULTANT")'
    operator: bio.spatial
    setting: calculations = nestedness_resultant
    refs: ["Baselga (2010). Partitioning the turnover and nestedness components of beta diversity. Global Ecology and Biogeography 19: 134-143. doi:10.1111/j.1466-8238.2009.00490.x"]

  # impl: indices.cpp:1749
  - id: BRAY_CURTIS
    name: Bray-Curtis dissimilarity
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Abundance-based dissimilarity between the two sets, with sample counts summed over each set. The calculation also gives the parts BC_A, BC_B (totals of set 1 and set 2) and BC_W (shared minimum).
    formula: 'BC = 1 - \frac{2W}{\sum_l n_{1l} + \sum_l n_{2l}},\quad W = \sum_l \min(n_{1l}, n_{2l})'
    symbols:
      'n_{1l}, n_{2l}': 'samples of label \(l\) in set 1 and in set 2 (0 when absent)'
    use: Sets with many more groups have larger counts; the normalised version divides by group numbers.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "bray_curtis"))'
    operator: bio.spatial
    setting: calculations = bray_curtis
    aliases: [BC_A, BC_B, BC_W]

  # impl: indices.cpp:1749
  - id: BRAY_CURTIS_NORM
    name: Bray-Curtis dissimilarity, normalised by group counts
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Bray-Curtis with each set's counts divided by its number of groups, so the sets are compared as mean samples per group (BCN_A, BCN_B, BCN_W are the parts).
    formula: 'BC_N = 1 - \frac{2W}{\sum_l \bar n_{1l} + \sum_l \bar n_{2l}},\quad \bar n_{kl} = n_{kl}/E_k'
    symbols:
      'n_{kl}': 'samples of label \(l\) in set \(k\)'
      'E_k': 'groups in set \(k\)'
      'W': '\(\sum_l \min(\bar n_{1l}, \bar n_{2l})\)'
    use: Prefer it when the two sets contain different numbers of cells.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "bray_curtis_norm_by_gp_counts"))'
    operator: bio.spatial
    setting: calculations = bray_curtis_norm_by_gp_counts
    aliases: [BCN_A, BCN_B, BCN_W]

  # impl: indices.cpp:1820
  - id: RW_TURNOVER
    name: Range-weighted turnover
    level: cell
    theme: turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Jaccard-type turnover in which every label counts by its endemism weight, so shared widespread species matter little and shared endemics a lot (RW_TURNOVER_A, _B, _C are the weighted parts).
    formula: 'RW = 1 - \frac{A_w}{A_w + B_w + C_w},\quad X_w = \sum_{l \in X} \frac{r_l}{R_l}'
    symbols:
      'A_w': 'weights of labels in both sets'
      'B_w': 'only in set 1'
      'C_w': 'only in set 2'
      'r_l/R_l': 'as in ENDW_WE (local range over the whole neighbourhood)'
    use: Turnover that focuses on restricted-range species. NaN when A and B, or A and C, are both zero.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "rw_turnover"))'
    operator: bio.spatial
    setting: calculations = rw_turnover
    aliases: [RW_TURNOVER_A, RW_TURNOVER_B, RW_TURNOVER_C]
    refs: ["Laffan et al. (2016). Range-weighted metrics of species and phylogenetic turnover can better resolve biogeographic transition zones. Methods in Ecology and Evolution 7: 580-588. doi:10.1111/2041-210X.12513"]

