    range: '> 0'
    what: 'PE counting each branch once, whatever its local range: the sum of branch length over branch range (PE_WE_SINGLE_P relative to the trimmed tree).'
    formula: 'PE_{single} = \sum_{b \in \mathrm{PE\ nodes}} \frac{L_b}{R_b}'
    symbols:
      'L_b': 'branch length'
      'R_b': 'its range in the basedata'
    use: The phylogenetic version of Rosauer's single-cell endemism; independent of how many neighbour cells share the branch.
    python: 'at(tf.bio.spatial_analysis(bd, C, "pe_single", tree=tree))'
    operator: bio.spatial
    setting: calculations = pe_single
    aliases: [PE_WE_SINGLE_P]

