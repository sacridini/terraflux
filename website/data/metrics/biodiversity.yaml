  # ---------------------------------------------------------------- randomisation
  # impl: _randomise.py:406-445
  - id: P_RANK
    name: P-rank of an index (randomisation)
    level: cell
    theme: randomisation
    unit: none
    range: 0 ≤ p ≤ 1
    what: Where the observed index lies among its randomised values. High (near 1) means the observed value is larger than most random ones, low means smaller.
    formula: 'P = \frac{C}{Q},\quad \text{rank} = \begin{cases} P & P > 0.5 \\ (C + T)/Q & \text{else}\end{cases}'
    symbols:
      'C': 'number of randomisations in which the observed value exceeds the random one (by more than a tolerance)'
      'T': 'ties'
      'Q': 'comparisons made (those with both values defined)'
    use: 'The significance test of Biodiverse: rank above 0.95 or below 0.05 for a two-tailed 10% test. Counts, p-ranks and z-scores come from `randomise(...)` on a SpatialResult; they are not calculations to list in the analysis.'
    python: 'rn = tf.bio.randomise(tf.bio.spatial_analysis(bd, C, ["pe", "phylo_rpe2"], tree=tree), "rand_structured", iterations=99, seed=1); rn.p_rank().loc[G]'
    operator: bio.randomise
    setting: function = rand_structured
    aliases: [p-rank, randomisation p, COMPARE_C, COMPARE_T, COMPARE_Q]

  # impl: _randomise.py:437-444
  - id: Z_SCORE
    name: Z-score of an index (randomisation)
    level: cell
    theme: randomisation
    unit: standard deviations
    range: unbounded
    what: Observed index minus the mean of the randomised values, over their standard deviation (the population form, divided by Q).
    formula: 'z = \frac{x_{obs} - \bar x_{rand}}{s_{rand}},\quad s_{rand}^2 = \frac{\sum x^2 - (\sum x)^2/Q}{Q}'
    symbols:
      'x_{obs}': 'observed value'
      'x': 'randomised values'
      'Q': 'their number; z is 0 when they do not vary'
      '\sum x, \sum x^2': 'held in SUMX and SUMXX'
    use: Complements the p-rank when the null distribution is roughly normal; `rn.comparison()` also gives the counters C, T, Q, P, SUMX, SUMXX.
    python: 'rn = tf.bio.randomise(tf.bio.spatial_analysis(bd, C, ["pe", "phylo_rpe2"], tree=tree), "rand_structured", iterations=99, seed=1); rn.z_scores().loc[G]'
    operator: bio.randomise
    setting: function = rand_structured
    aliases: [z-score, SUMX, SUMXX]

  # impl: _randomise.py:596-625
  - id: CANAPE_CODE
    name: CANAPE categories
    level: cell
    theme: randomisation
    unit: category code
    range: 0 to 4
    what: 'Categorical analysis of neo- and palaeo-endemism: each cell is classed from the p-ranks of PE, the PE of the equalised tree (the null PE) and RPE as not significant (0), neo-endemism (1), palaeo-endemism (2), mixed (3) or super (4); also as indicator columns NEO, PALAEO, MIXED, SUPER.'
    formula: 'code = \begin{cases} 0 & p_{PE} \le 0.95 \ \wedge\ p_{null} \le 0.95\\ 1 & p_{RPE} < 0.025\\ 2 & p_{RPE} > 0.975\\ 4 & p_{PE} > 0.99 \ \wedge\ p_{null} > 0.99\\ 3 & \text{otherwise}\end{cases}'
    symbols:
      'p': 'the p-ranks (missing counted 0.5) of PE_WE, PHYLO_RPE_NULL2 and PHYLO_RPE2 (the diff variant uses PHYLO_RPE_DIFF2; `central=True` uses PEC_WE, PHYLO_RPE_NULLC, PHYLO_RPEC). Tests are applied in the order shown.'
    use: Needs `pe` and `phylo_rpe2` in the analysis and randomisations (use rand_structured). Palaeo cells are rich in long-branch endemics, neo cells in short-branch ones.
    python: 'tf.bio.randomise(tf.bio.spatial_analysis(bd, C, ["pe", "phylo_rpe2"], tree=tree), "rand_structured", iterations=99, seed=1).canape().loc[G]'
    operator: bio.randomise
    setting: calculations = pe, phylo_rpe2
    aliases: [NEO, PALAEO, MIXED, SUPER, CANAPE]
    refs: ["Mishler et al. (2014). Phylogenetic measures of biodiversity and neo- and paleo-endemism in Australian Acacia. Nature Communications 5: 4473. doi:10.1038/ncomms5473"]


