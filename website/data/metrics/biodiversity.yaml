  # ---------------------------------------------------------------- phylogenetic endemism
  # impl: indices.cpp:2091, phylo.cpp:40-100
  - id: PE_WE
    name: Phylogenetic endemism (PE)
    level: cell
    theme: phylogenetic endemism
    unit: branch length units
    range: ≥ 0
    what: 'Endemism summed over branches: each branch of the neighbourhood''s PD tree counts its length times the share of its range inside the neighbourhood. PE_WE_P gives it relative to the trimmed tree.'
    formula: 'PE = \sum_{b} L_b \frac{r_b}{R_b},\quad PE_P = \frac{PE}{\sum_{b \in T_{trim}} L_b}'
    symbols:
      'L_b': 'branch length'
      'r_b': 'groups of the neighbourhood whose labels descend from \(b\)'
      'R_b': 'groups in the whole basedata that do (the range of the branch)'
      'T_{trim}': 'the tree trimmed to the labels present in the basedata'
    use: High where narrow-ranged, long branches concentrate; confounded with richness (compare with CWE or randomisations).
    python: 'at(tf.bio.spatial_analysis(bd, C, "pe", tree=tree))'
    operator: bio.spatial
    setting: calculations = pe
    aliases: [PE, PE_WE_P, phylogenetic endemism]
    refs: ["Rosauer et al. (2009). Phylogenetic endemism: a new approach for identifying geographical concentrations of evolutionary history. Molecular Ecology 18: 4061-4072. doi:10.1111/j.1365-294X.2009.04311.x"]

  # impl: indices.cpp:2105
