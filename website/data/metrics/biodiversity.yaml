  # impl: indices.cpp:2803-2820, phylo.cpp:208-241
  - id: RWIBALD_CODES
    name: RWiBaLD branch codes
    level: cell
    theme: phylogenetic structure
    unit: code / branch length units
    range: codes 0 to 3
    what: 'Classifies each branch of the neighbourhood''s PD tree against a tree of equal branch lengths: code 0 for branches that are not range-restricted, 1 for shorter than the equalised length, 2 for about equal, 3 for longer. The lists give the codes (RWIBALD_CODES), counts (RWIBALD_CODE_COUNTS), the length differences (RWIBALD_DIFFS, RWIBALD_RR_DIFFS for the range-restricted ones) and the thresholds (RWIBALD_METADATA).'
    formula: 'd_b = \frac{L_b - \ell_{eq}[L_b \ne 0]}{R_b}'
    symbols:
      'L_b': 'branch length'
      '\ell_{eq}': 'the equalised length'
      'R_b': 'branch range; a branch is range-restricted when \(1/R_b\) reaches an elbow threshold of the sorted \(1/R\) values'
      'd_b': 'the length difference; codes 1 and 3 are \(d\) at or beyond the negative and positive elbow thresholds of the sorted \(d\)'
    use: A branch-level counterpart of RPE; thresholds are found per tree by the elbow rule, so they vary with the data.
    python: 'at(tf.bio.spatial_analysis(bd, C, "rwibald", tree=tree), "RWIBALD_CODES")'
    operator: bio.spatial
    setting: calculations = rwibald
    aliases: [RWIBALD_CODE_COUNTS, RWIBALD_DIFFS, RWIBALD_RR_DIFFS, RWIBALD_METADATA]

