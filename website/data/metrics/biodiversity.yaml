      'L_{eq}': 'total length of the equalised tree'
      'PE_{eq}': 'the PE of the equalised tree, summed over the groups of the neighbourhood and over the branches of each group; PHYLO_RPE_NULL2 is \(PE_{eq}/L_{eq}\) and PHYLO_RPE_DIFF2 the scaled difference'
    use: Above 1 the lineages are longer than expected (palaeo-endemism), below 1 shorter (neo-endemism); significance by randomisation, see CANAPE.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_rpe2", tree=tree))'
