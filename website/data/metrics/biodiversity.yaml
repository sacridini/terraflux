  # ---------------------------------------------------------------- phylogenetic diversity
  # impl: indices.cpp:1994-2005
  - id: PD
    name: Phylogenetic diversity (PD)
    level: cell
    theme: phylogenetic diversity
    unit: branch length units
    range: ≥ 0
    what: Total length of the branches of the tree that connect the neighbourhood labels to the root. PD_P is it as a share of the whole tree, PD_per_taxon and PD_P_per_taxon divide by the labels on the tree.
    formula: 'PD = \sum_{b \in \mathrm{span}(N)} L_b,\quad PD_P = \frac{PD}{\sum_b L_b},\quad PD_{taxon} = \frac{PD}{S_{tree}}'
    symbols:
      '\mathrm{span}(N)': 'branches on the paths from the labels of the neighbourhood that are on the tree up to the root'
      'L_b': 'branch length'
      'S_{tree}': 'labels on the tree'
      '\sum_b L_b': 'the length of the full tree (not trimmed), the divisor of PD_P'
    use: Includes the path to the root, so a single species has PD > 0. Rises with richness; compare with relative PD (RPD) or randomisation.
    python: 'at(tf.bio.spatial_analysis(bd, C, "pd", tree=tree))'
    operator: bio.spatial
    setting: calculations = pd
    aliases: [PD_P, PD_per_taxon, PD_P_per_taxon, Faith PD]
    refs: ["Faith (1992). Conservation evaluation and phylogenetic diversity. Biological Conservation 61: 1-10. doi:10.1016/0006-3207(92)91201-3"]

  # impl: indices.cpp:2031-2049
  - id: PD_LOCAL
    name: Local phylogenetic diversity
    level: cell
    theme: phylogenetic diversity
    unit: branch length units
    range: ≥ 0
    what: 'PD without the stem: the length shared by all labels from their last common ancestor up to the root is removed (PD_LOCAL, and PD_LOCAL_P as a share of the whole tree).'
    formula: 'PD_{local} = PD - \sum_{b \in \mathrm{path}(a \to root)} L_b'
    symbols:
      'a': 'the last shared ancestor of the neighbourhood labels on the tree, included in the removed path. Not applied if the ancestor is a terminal.'
    use: Separates the spread of a group within the tree from how deep its clade sits.
    python: 'at(tf.bio.spatial_analysis(bd, C, "pd_local", tree=tree))'
    operator: bio.spatial
    setting: calculations = pd_local
    aliases: [PD_LOCAL_P]

