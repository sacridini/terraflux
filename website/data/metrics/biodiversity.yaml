  # impl: indices.cpp:2773
  - id: MX_RAO_QE
    name: Rao quadratic entropy from a matrix
    level: cell
    theme: label matrix
    unit: of the matrix values
    range: ≥ 0
    what: Rao's quadratic entropy with the pairwise distances taken from a label matrix; MX_RAO_TN is the number of pairs counted (n squared) and MX_RAO_TLABELS the label proportions.
    formula: 'Q = \sum_{i \le j} 2\, v_{ij}\, p_i p_j,\quad p_i = 1/n'
    symbols:
      'v_{ij}': 'matrix distance (a missing value counts 0)'
      'n': 'labels of the neighbourhood that are in the matrix'
      'p_i': '\(1/n\), as presence only; the sum includes \(i=j\) with the factor 2, so the diagonal values count double'
    use: Needs `matrix=`. Presence-only (label weights are 1/n); with a zero diagonal it equals the usual quadratic entropy of equal proportions.
