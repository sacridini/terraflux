  # impl: indices.cpp:2582-2640
  - id: IEI_MEAN
    name: Inter-event interval statistics (IEI)
    level: cell
    theme: numeric labels
    unit: of the label values
    range: ≥ 0
    what: 'In each group of the neighbourhood the numeric labels are treated as event times; the intervals between consecutive labels, plus zero intervals for repeated samples, are summarised: N, MEAN, SD, MIN, MAX, RANGE, CV, GMEAN, SKEW, KURT (IEI_*). IEI_DATA_ARRAY and IEI_DATA_HASH hold the intervals.'
