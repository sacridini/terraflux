  # ---------------------------------------------------------------- phylogenetic turnover
  # impl: indices.cpp:2210-2264
  - id: PHYLO_SORENSON
    name: Phylogenetic Sorenson dissimilarity
    level: cell
    theme: phylogenetic turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Sorenson turnover with branch lengths in place of label counts.
    formula: '\mathrm{PHYLO\_SORENSON} = 1 - \frac{2A}{2A+B+C}'
    symbols:
      'A': 'total length of the branches shared by the paths of the two sets (PHYLO_A)'
      'B': 'length of those only in set 1 (PHYLO_B)'
      'C': 'length of those only in set 2 (PHYLO_C); PHYLO_ABC is their sum'
    use: Needs two conditions and a tree. Compares what ancestry two cells share, not just the species.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "phylo_sorenson", tree=tree))'
    operator: bio.spatial
    setting: calculations = phylo_sorenson
    aliases: [phylosor]
    refs: ["Bryant et al. (2008). Microbes on mountainsides: contrasting elevational patterns of bacterial and plant diversity. PNAS 105: 11505-11511. doi:10.1073/pnas.0801920105"]

  # impl: indices.cpp:2255
  - id: PHYLO_JACCARD
    name: Phylogenetic Jaccard dissimilarity
    level: cell
    theme: phylogenetic turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: Jaccard turnover over branch lengths.
    formula: 'PJ = 1 - \frac{A}{A+B+C}'
    symbols:
      'A, B, C': 'branch length shared, only in set 1, only in set 2'
    use: As PHYLO_SORENSON, weighting unshared branches more.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "phylo_jaccard", tree=tree), "PHYLO_JACCARD")'
    operator: bio.spatial
    setting: calculations = phylo_jaccard

  # impl: indices.cpp:2259
  - id: PHYLO_S2
    name: Phylogenetic S2 dissimilarity
    level: cell
    theme: phylogenetic turnover
    unit: none
    range: 0 ≤ value ≤ 1
    what: S2 turnover over branch lengths.
    formula: 'PS2 = 1 - \frac{A}{A + \min(B, C)}'
    symbols:
      'A, B, C': 'branch length shared, only in set 1, only in set 2'
    use: Less affected by differences in PD between the cells than Sorenson.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "phylo_s2", tree=tree), "PHYLO_S2")'
    operator: bio.spatial
    setting: calculations = phylo_s2

  # impl: indices.cpp:2244
  - id: PHYLO_A
    name: Phylogenetic A, B, C counts
    level: cell
