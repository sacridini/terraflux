  # ---------------------------------------------------------------- phylogenetic structure (PhyloCom)
  # impl: indices.cpp:1495-1507, phylocom.cpp:342-410
  - id: PMPD1_MEAN
    name: Mean pairwise distance (MPD), variants 1 to 3
    level: cell
    theme: phylogenetic structure
    unit: tree distance units
    range: ≥ 0
    what: Mean of the tree distances between all pairs of labels of the neighbourhood. Variant 1 counts each label once, 2 weights it by its local range (groups holding it), 3 by its samples. Each gives MAX, MEAN, MIN, N, RMSD and VARIANCE (PMPD1_*, PMPD2_*, PMPD3_*).
    formula: 'MPD = \frac{\sum_{i \ne j} w_i w_j d_{ij}}{\sum_{i \ne j} w_i w_j}'
    symbols:
      'd_{ij}': 'path length between the tips of labels \(i, j\) on the tree'
      'w': 'the weight of the variant (1, local range or samples)'
      '\mathrm{N}': 'the pair weight total'
      '\mathrm{RMSD}': 'the root of the mean squared distance'
      '\mathrm{VARIANCE}': 'the variance of the distances'
    use: Dominated by deep splits; on trees that are not ultrametric the path cache of PhyloCom matters, and values can depend on the order the groups are processed.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_mpd_mntd1", tree=tree), like="PMPD1")'
    operator: bio.spatial
    setting: calculations = phylo_mpd_mntd1
    aliases: [MPD, PMPD1_MAX, PMPD1_MIN, PMPD1_N, PMPD1_RMSD, PMPD1_VARIANCE, PMPD2_MEAN, PMPD3_MEAN, phylo_mpd_mntd2, phylo_mpd_mntd3]
    refs: ["Webb et al. (2002). Phylogenies and community ecology. Annual Review of Ecology and Systematics 33: 475-505.", "Kembel et al. (2010). Picante: R tools for integrating phylogenies and ecology. Bioinformatics 26: 1463-1464."]

  # impl: indices.cpp:1495-1507
  - id: PNTD1_MEAN
    name: Mean nearest taxon distance (MNTD), variants 1 to 3
    level: cell
    theme: phylogenetic structure
    unit: tree distance units
    range: ≥ 0
    what: Mean over the labels of the distance to the nearest other label of the neighbourhood on the tree; same weighting variants and statistics as MPD (PNTD1_*, PNTD2_*, PNTD3_*).
    formula: 'MNTD = \frac{\sum_i w_i \min_{j \ne i} d_{ij}}{\sum_i w_i}'
    symbols:
      'd_{ij}': 'tree distance between labels \(i\) and \(j\)'
      'w_i': 'the weight of the variant'
      '\mathrm{N}': 'the labels counted with their weights'
    use: Emphasises tip clustering; MPD emphasises the deep structure.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_mpd_mntd1", tree=tree), like="PNTD1")'
    operator: bio.spatial
    setting: calculations = phylo_mpd_mntd1
    aliases: [MNTD, PNTD1_MAX, PNTD1_MIN, PNTD1_N, PNTD1_RMSD, PNTD1_VARIANCE, PNTD2_MEAN, PNTD3_MEAN]
    refs: ["Webb et al. (2002). Phylogenies and community ecology. Annual Review of Ecology and Systematics 33: 475-505."]

  # impl: indices.cpp:2784-2788, phylocom.cpp
  - id: PHYLO_NRI1
    name: Net relatedness index (NRI), variants 1 to 3
    level: cell
    theme: phylogenetic structure
    unit: standardised units
    range: unbounded
    what: The MPD of the neighbourhood standardised by the expected MPD of random draws of the same number of tips from the tree (PHYLO_NRI1, _NRI2, _NRI3 for the weighting variants).
    formula: 'NRI = \frac{MPD_{obs} - \overline{MPD}_{exp}}{SD_{exp}}'
    symbols:
      '\overline{MPD}_{exp}, SD_{exp}': 'mean and standard deviation of MPD over random sets of \(k\) tips, computed exactly (Tsirogiannis et al.) or sampled with the seed on non-ultrametric trees'
      'k': 'the labels on the tree'
    use: 'Sign is observed minus expected, so it is the negative of Webb''s NRI: here negative means clustered. Use `prng_seed` for repeatable values on non-ultrametric trees.'
    python: 'at(tf.bio.spatial_analysis(bd, C, "nri_nti1", tree=tree, prng_seed=1))'
    operator: bio.spatial
    setting: calculations = nri_nti1
    aliases: [NRI, PHYLO_NRI2, PHYLO_NRI3, nri_nti2, nri_nti3]
    refs: ["Webb et al. (2002). Phylogenies and community ecology. Annual Review of Ecology and Systematics 33: 475-505.", "Tsirogiannis et al. (2012). Efficient computation of popular phylogenetic tree measures. Algorithms in Bioinformatics, LNCS 7534: 30-43. doi:10.1007/978-3-642-33122-0_3"]

  # impl: indices.cpp:2784-2788
  - id: PHYLO_NTI1
    name: Nearest taxon index (NTI), variants 1 to 3
    level: cell
    theme: phylogenetic structure
    unit: standardised units
    range: unbounded
    what: The MNTD of the neighbourhood standardised by its expectation under random tips (PHYLO_NTI1, _NTI2, _NTI3).
    formula: 'NTI = \frac{MNTD_{obs} - \overline{MNTD}_{exp}}{SD_{exp}}'
    symbols:
      '\overline{MNTD}_{exp}, SD_{exp}': 'mean and standard deviation of MNTD over random sets of \(k\) tips'
    use: Same sign convention as NRI (observed minus expected). Negative means closer relatives than random.
    python: 'at(tf.bio.spatial_analysis(bd, C, "nri_nti1", tree=tree, prng_seed=1), "PHYLO_NTI1")'
    operator: bio.spatial
    setting: calculations = nri_nti1
    aliases: [NTI, PHYLO_NTI2, PHYLO_NTI3, nri_nti2, nri_nti3]
    refs: ["Webb et al. (2002). Phylogenies and community ecology. Annual Review of Ecology and Systematics 33: 475-505."]

  # impl: indices.cpp:2789
  - id: PHYLO_NRI_SAMPLE_MEAN
    name: NRI and NTI expected values
    level: cell
