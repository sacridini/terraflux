family: biodiversity
title: Biodiversity (Biodiverse)
order: 40
source: Biodiverse (Laffan, Lubarsky and Rosauer 2010), ported as tf.bio
intro: |
  Species (labels) counted in cells (groups). Every index is computed for each group over its neighbourhood: one or two
  sets of groups chosen by spatial conditions (set 1, set 2). The names are Biodiverse's and the values match its output.

  The cards show the values of one cell, `3350000:750000`, on Biodiverse's own example: 365 records of 31 species snapped
  to cells of 100 km (`tf.bio.example_data("sites")`), with the phylogeny of those species (`"tree"`). The neighbourhood
  is `C`, the cells within 200 km; the indices of two sets use `C2`, the cell itself as set 1 and its neighbourhood as
  set 2. A call gives a table (`.table`, a row per cell) and list indices (`.lists`); `at` picks what the cell `G` holds
  (a list shows its first six entries). The example has no label or group properties and no label matrix, so those cards
  use a small toy made with a seeded random generator: a mass between 1 and 50 for each species, an elevation between 0
  and 800 for each cell, and random symmetric distances between the species. The numeric-label cards read the record
  number of the table as the label. The toy values show how a calculation is called, not a result about the species.

  Shared notation: `S` richness (labels in the neighbourhood); `A`, `B`, `C` the labels in both sets, only in set 1 and
  only in set 2 (`ABC = A+B+C`); `R_l` the range of a label (the groups holding it in the whole basedata, or its RANGE
  property if larger); `r_l` its local range (groups of the neighbourhood holding it); `N_l` and `n_l` the same counts in
  samples. Where the code departs from the usual definition the card says so. Moran's I and Geary's C are not here: they
  live in `tf.stats`.
example: |
  import numpy as np
  import pandas as pd
  import terraflux as tf

  # Biodiverse's example records: 365 records of 31 species, snapped to cells of 100 km
  sites = tf.bio.example_data("sites")
  bd = tf.bio.BaseData.from_table(sites, group_columns=["x", "y"], label_columns=["genus", "species"],
                                  cell_sizes=[100000, 100000])
  tree = tf.bio.read_tree(tf.bio.example_data("tree"))  # the phylogeny of those species
  C = "sp_circle (radius => 200000)"                    # the neighbourhood: the cells within 200 km
  C2 = ["sp_self_only()", C]                            # two sets: the cell itself (set 1), its neighbourhood (set 2)
  G = "3350000:750000"                                  # the cell whose values the cards show

  # a small seeded toy where the example has no data: a mass per species, an elevation per cell, a label matrix
  rng = np.random.default_rng(1)
  bd.set_label_properties(pd.DataFrame({"MASS": rng.integers(1, 51, len(bd.labels)).astype(float)}, index=bd.labels))
  bd.set_group_properties(pd.DataFrame({"ELEV": rng.integers(0, 801, len(bd.groups)).astype(float)}, index=bd.groups))
  v = rng.random((len(bd.labels), len(bd.labels)))
  mx = tf.bio.Matrix(bd.labels, (v + v.T) / 2, self_similarity=0.0)
  # numeric labels: the record number of the table is the label
  bn = tf.bio.BaseData.from_table(sites, group_columns=["x", "y"], label_columns=["num"], cell_sizes=[100000, 100000])


  def at(res, *keys, like=None, n=6):
      """What a result holds for the cell G: columns of its table, or the first n entries of a list index."""
      if keys and keys[0] in res.lists:
          d = res.lists[keys[0]]
          return d[d["group"] == G].set_index("key")["value"].head(n)
      row = res.table.loc[G]
      if like:
          return row.filter(like=like)
      return row[keys[0]] if len(keys) == 1 else row[list(keys)] if keys else row

metrics:
  # ---------------------------------------------------------------- richness
  # impl: indices.cpp:1595
  - id: RICHNESS_ALL
    name: Richness
    level: cell
    theme: richness
    unit: labels
    range: ≥ 0
    what: Number of distinct labels (species) in the neighbourhood. RICHNESS_SET1 and RICHNESS_SET2 give it for each set alone.
    formula: 'S_{all} = A+B+C,\quad S_{1} = A+B,\quad S_{2} = A+C'
    symbols:
      'A': 'the labels in both sets'
      'B': 'the labels only in set 1'
      'C': 'the labels only in set 2'
    use: The base measure of diversity; depends on the cell size and on the neighbourhood. Sampling effort inflates or hides it, see the estimators.
    python: 'at(tf.bio.spatial_analysis(bd, C, "richness"), "RICHNESS_ALL")'
    operator: bio.spatial
    setting: calculations = richness
    aliases: [species richness, RICHNESS_SET1, RICHNESS_SET2]

  # impl: indices.cpp:1599
  - id: REDUNDANCY_ALL
    name: Redundancy
    level: cell
    theme: richness
    unit: none
    range: 0 ≤ value < 1 (undefined without samples)
    what: How much sampling exceeds richness, one minus labels per sample. Near 0 every sample is a different label, near 1 most are repeats.
    formula: 'Red = 1 - \frac{S}{\sum_l n_l}'
    symbols:
      'S': 'richness of the set'
      'n_l': 'the samples of label \(l\) in the neighbourhood. REDUNDANCY_SET1 and _SET2 use their own set.'
    use: A cheap check of sample completeness; unlike the estimators it says nothing about unseen labels.
    python: 'at(tf.bio.spatial_analysis(bd, C, "redundancy"), "REDUNDANCY_ALL")'
    operator: bio.spatial
    setting: calculations = redundancy

  # impl: indices.cpp:1610
  - id: ABC_A
    name: Shared and exclusive label counts (A, B, C, ABC)
    level: cell
    theme: richness
    unit: labels
    range: ≥ 0
    what: Counts of labels in both neighbour sets (ABC_A), only in set 1 (ABC_B), only in set 2 (ABC_C) and in either (ABC_ABC); the inputs of every taxonomic turnover index.
    formula: 'ABC = A + B + C'
    symbols:
      'A': 'the labels in both sets'
      'B': 'the labels only in set 1'
      'C': 'the labels only in set 2'
    use: Needs two conditions. Read them first when a turnover value looks odd.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "abc_counts"))'
    operator: bio.spatial
    setting: calculations = abc_counts
    aliases: [ABC_B, ABC_C, ABC_ABC]

  # impl: indices.cpp:1615
  - id: ABC_D
    name: Labels in the basedata but not in the neighbourhood (D)
    level: cell
    theme: richness
    unit: labels
    range: ≥ 0
    what: Count of labels of the whole basedata absent from both neighbour sets.
    formula: 'D = L - (A+B+C)'
    symbols:
      'L': 'number of labels in the basedata'
    use: Completes the 2x2 table of A, B, C, D that presence-absence indices work from.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "d"), "ABC_D")'
    operator: bio.spatial
    setting: calculations = d

  # impl: indices.cpp:1617
  - id: EL_COUNT_ALL
    name: Element (group) counts
    level: cell
    theme: richness
    unit: groups
    range: ≥ 0
    what: Number of groups in the neighbourhood, EL_COUNT_ALL for both sets, EL_COUNT_SET1 and EL_COUNT_SET2 for each; the nonempty version counts only groups holding at least one label.
    formula: 'E_{all} = |G_1 \cup G_2|'
    symbols:
      'G_1, G_2': 'the groups of set 1 and set 2'
    use: Gives the area in cells behind the other indices (it is the divisor of the normalised endemism indices).
    python: 'at(tf.bio.spatial_analysis(bd, C2, ["elements_used", "nonempty_elements_used"]))'
    operator: bio.spatial
    setting: calculations = elements_used
    aliases: [EL_COUNT_SET1, EL_COUNT_SET2, EL_COUNT_NONEMPTY_ALL, EL_COUNT_NONEMPTY_SET1, EL_COUNT_NONEMPTY_SET2, nonempty_elements_used]

  # impl: indices.cpp:1627
  - id: EL_LIST_ALL
    name: Element lists (groups of the neighbourhood)
    level: cell
    theme: lists
    unit: none
    range: 1 per group
    what: The groups of the neighbourhood as a list (key group name, value 1), for both sets and for each. The "as arrays" version gives the same keys in Biodiverse's array form.
    formula: 'L(g) = 1 \quad \forall g \in G_1 \cup G_2'
    symbols:
      'G_1, G_2': 'the groups of the two sets'
    use: To see or export which cells made up a neighbourhood.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "element_lists_used"), "EL_LIST_ALL")'
    operator: bio.spatial
    setting: calculations = element_lists_used
    aliases: [EL_LIST_SET1, EL_LIST_SET2, EL_ARRAY_ALL, EL_ARRAY_SET1, EL_ARRAY_SET2, element_lists_used_as_arrays]

  # impl: indices.cpp:1633
  - id: LABEL_COUNT_RANK_PCT
    name: Label count rank (percent)
    level: cell
    theme: abundance
    unit: percent
    range: 0 ≤ p ≤ 100
    what: For each label, the percentage of the other groups in the neighbourhood that hold fewer samples of it than the focal group (groups without it count as 0).
    formula: 'p_l = 100\,\frac{\#\{g \ne g_0 : n_{g,l} < n_{g_0,l}\}}{|G| - 1}'
    symbols:
      'g_0': 'the processing group'
      'G': 'the neighbourhood groups'
      'n_{g,l}': 'samples of label \(l\) in group \(g\)'
    use: Tells whether the focal cell is rich or poor in a species relative to its neighbours; a label absent from the focal group gets 0.
    python: 'at(tf.bio.spatial_analysis(bd, C, "label_count_quantile_position"), "LABEL_COUNT_RANK_PCT")'
    operator: bio.spatial
    setting: calculations = label_count_quantile_position

  # ---------------------------------------------------------------- abundance (local ranges and sample counts)
  # impl: indices.cpp:1674-1684
  - id: ABC2_MEAN_ALL
    name: Local range statistics
    level: cell
    theme: abundance
    unit: groups
    range: ≥ 1
    what: Mean and standard deviation, over the labels of the neighbourhood, of their local range (number of neighbourhood groups holding the label). Per set as ABC2_MEAN_SET1 / _SET2 and ABC2_SD_*.
    formula: '\bar r = \frac{1}{S}\sum_l r_l,\quad s_r = \sqrt{\frac{\sum_l (r_l-\bar r)^2}{S-1}}'
    symbols:
      'r_l': 'groups of the neighbourhood holding label \(l\)'
      'S': 'the number of labels'
    use: Separates a neighbourhood of widespread species from one of local ones; the lists ABC2_LABELS_ALL (_SET1, _SET2) give the \(r_l\) themselves (calculation local_range_lists).
    python: 'at(tf.bio.spatial_analysis(bd, C2, "local_range_stats"))'
    operator: bio.spatial
    setting: calculations = local_range_stats
    aliases: [ABC2_SD_ALL, ABC2_MEAN_SET1, ABC2_MEAN_SET2, ABC2_SD_SET1, ABC2_SD_SET2, ABC2_LABELS_ALL, local_range_lists]

  # impl: indices.cpp:1689-1700
  - id: ABC3_MEAN_ALL
    name: Local sample count statistics
    level: cell
    theme: abundance
    unit: samples
    range: ≥ 1
    what: Mean, standard deviation and sum of the sample counts of the labels over the neighbourhood (ABC3_MEAN_*, ABC3_SD_*, ABC3_SUM_*, for all, set 1, set 2).
    formula: 'n_l = \sum_{g \in G} n_{g,l},\quad \bar n = \frac{1}{S}\sum_l n_l,\quad \text{SUM} = \sum_l n_l'
    symbols:
      'n_{g,l}': 'samples of label \(l\) in group \(g\)'
      'n_l': 'samples of label \(l\) in the neighbourhood'
      'S': 'the number of labels'
      'SD': 'the sample standard deviation of \(n_l\)'
    use: A summary of abundance; ABC3_LABELS_ALL gives the \(n_l\) (local_sample_count_lists).
    python: 'at(tf.bio.spatial_analysis(bd, C2, "local_sample_count_stats"))'
    operator: bio.spatial
    setting: calculations = local_sample_count_stats
    aliases: [ABC3_SD_ALL, ABC3_SUM_ALL, ABC3_MEAN_SET1, ABC3_SUM_SET1, ABC3_LABELS_ALL, local_sample_count_lists]

  # impl: indices.cpp:1701
  - id: ABC3_QUANTILES_ALL
    name: Local sample count quantiles
    level: cell
    theme: abundance
    unit: samples
    range: ≥ 1
    what: The 0, 5, 10 ... 100 percent quantiles (keys Q000 to Q100) of the label sample counts over the neighbourhood, as a list.
    formula: 'Q_p = \text{percentile}_p\{n_l\}'
    symbols:
      'n_l': 'the sample count of label \(l\) in the neighbourhood'
      'p': 'the percentage: 0, 5, ..., 100'
    use: Shows the shape of the abundance distribution. With one set the lists for set 1 repeat the all-set values.
    python: 'at(tf.bio.spatial_analysis(bd, C2, "local_sample_count_quantiles"), "ABC3_QUANTILES_ALL")'
    operator: bio.spatial
    setting: calculations = local_sample_count_quantiles
    aliases: [ABC3_QUANTILES_SET1, ABC3_QUANTILES_SET2]

  # ---------------------------------------------------------------- diversity
  # impl: indices.cpp:1777
  - id: SIMPSON_D
    name: Simpson diversity
    level: cell
    theme: diversity
    unit: none
    range: 0 ≤ D < 1
    what: Probability that two samples drawn at random from the neighbourhood are different labels (one minus the sum of squared proportions).
    formula: 'D = 1 - \sum_l p_l^2,\quad p_l = \frac{n_l}{\sum_k n_k}'
    symbols:
      'n_l': 'samples of label \(l\) in the neighbourhood'
    use: Weights common species; insensitive to rare ones. It is the Gini-Simpson index (1 − Σp²), not Σp².
    python: 'at(tf.bio.spatial_analysis(bd, C, "simpson_shannon"), "SIMPSON_D")'
    operator: bio.spatial
    setting: calculations = simpson_shannon
    aliases: [Gini-Simpson]

  # impl: indices.cpp:1777
  - id: SHANNON_H
    name: Shannon entropy
    level: cell
    theme: diversity
    unit: nats
    range: 0 ≤ H ≤ ln S
    what: Entropy of the label proportions with the natural logarithm. The same calculation gives SHANNON_HMAX = ln S and the evenness SHANNON_E = H / ln S.
    formula: 'H = -\sum_l p_l \ln p_l,\quad H_{max} = \ln S,\quad E = H / H_{max}'
    symbols:
      'p_l': 'proportion of the samples that belong to label \(l\)'
      'S': 'richness'
      'E': 'evenness, undefined when \(S = 1\)'
    use: Sensitive to rare labels more than Simpson. SHANNON_E compares cells of different richness.
    python: 'at(tf.bio.spatial_analysis(bd, C, "simpson_shannon"), "SHANNON_H", "SHANNON_HMAX", "SHANNON_E")'
    operator: bio.spatial
    setting: calculations = simpson_shannon
    aliases: [SHANNON_E, SHANNON_HMAX, evenness]

  # impl: indices.cpp:1794
  - id: TX_RAO_QE
    name: Rao quadratic entropy (taxonomic)
    level: cell
    theme: diversity
    unit: none
    range: 0 ≤ Q < 1
    what: Rao's quadratic entropy with every pair of different labels at distance 1; TX_RAO_TN is the number of label pairs counted (S squared), TX_RAO_TLABELS the proportions.
    formula: 'Q = \sum_{i}\sum_{j \ne i} p_i p_j = 1 - \sum_l p_l^2'
    symbols:
      'p_l': 'proportion of the samples of label \(l\)'
    use: With distance 1 it equals SIMPSON_D; use the matrix version MX_RAO_QE for real label distances.
    python: 'at(tf.bio.spatial_analysis(bd, C, "tx_rao_qe"))'
    operator: bio.spatial
    setting: calculations = tx_rao_qe
    aliases: [TX_RAO_TN, TX_RAO_TLABELS]
    refs: ["Rao (1982). Diversity and dissimilarity coefficients: a unified approach. Theoretical Population Biology 21: 24-43."]

  # impl: indices.cpp:1920
  - id: HURLBERT_ES
    name: Hurlbert's rarefied richness (ES)
    level: cell
    theme: diversity
    unit: labels
    range: 1 ≤ ES(n) ≤ S
    what: Expected number of labels in a random draw of n samples, for n = 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000 (those not above the total samples), as a list keyed by n.
    formula: 'ES(n) = \sum_l \left[1 - \frac{\binom{N-N_l}{n}}{\binom{N}{n}}\right]'
    symbols:
      'n': 'the number of samples drawn'
      'N': 'total samples in the neighbourhood'
      'N_l': 'samples of label \(l\); a term is 1 when \(N - N_l < n\)'
    use: Compares richness between cells with different sampling effort. A cell with fewer than 5 samples returns nothing.
    python: 'at(tf.bio.spatial_analysis(bd, C, "hurlbert_es"), "HURLBERT_ES")'
    operator: bio.spatial
    setting: calculations = hurlbert_es
    refs: ["Hurlbert (1971). The nonconcept of species diversity: a critique and alternative parameters. Ecology 52: 577-586."]

  # ---------------------------------------------------------------- estimation
  # impl: indices.cpp:487
  - id: CHAO1_ESTIMATE
    name: Chao1 richness estimate
    level: cell
    theme: estimation
    unit: labels
    range: ≥ S
    what: Lower-bound estimate of the true richness from the singletons and doubletons of the sample counts, with the variance, standard error, 95% interval, undetected labels and the counts f1, f2 (CHAO1_*).
    formula: 'S_{Chao1} = S + \frac{n-1}{n}\cdot\begin{cases}\dfrac{f_1^2}{2 f_2} & f_2 > 0\\[4pt] \dfrac{f_1 (f_1-1)}{2} & f_2 = 0,\ f_1 > 1\\ 0 & \text{otherwise}\end{cases}'
    symbols:
      'S': 'observed labels'
      'n': 'total samples'
      'f_1, f_2': 'labels with exactly one and two samples (CHAO1_F1_COUNT, CHAO1_F2_COUNT)'
      'S_{Chao1} - S': 'the labels not yet seen (CHAO1_UNDETECTED)'
      'z': '1.959964, the normal quantile of the log-normal 95% interval (CHAO1_CI_LOWER, CHAO1_CI_UPPER); CHAO1_META lists the formulas used'
    use: Good for sample counts with many rare labels; uses sample counts (see CHAO2 for presence in groups). Unreliable with no singletons.
    python: 'at(tf.bio.spatial_analysis(bd, C, "chao1"), like="CHAO1")'
    operator: bio.spatial
    setting: calculations = chao1
    aliases: [CHAO1_SE, CHAO1_VARIANCE, CHAO1_UNDETECTED, CHAO1_CI_LOWER, CHAO1_CI_UPPER, CHAO1_F1_COUNT, CHAO1_F2_COUNT, CHAO1_META]
    refs: ["Chao (1984). Nonparametric estimation of the number of classes in a population. Scandinavian Journal of Statistics 11: 265-270.", "Chao (1987). Estimating the population size for capture-recapture data with unequal catchability. Biometrics 43: 783-791."]

  # impl: indices.cpp:487
  - id: CHAO2_ESTIMATE
    name: Chao2 richness estimate
    level: cell
    theme: estimation
    unit: labels
    range: ≥ S
    what: 'The incidence-based Chao estimator: it works on the number of groups each label occurs in, so the labels found in exactly one or two groups play the role of singletons and doubletons.'
    formula: 'S_{Chao2} = S + \frac{m-1}{m}\cdot\begin{cases}\dfrac{Q_1^2}{2 Q_2} & Q_2 > 0\\[4pt] \dfrac{Q_1 (Q_1-1)}{2} & Q_2 = 0,\ Q_1 > 1\\ 0 & \text{otherwise}\end{cases}'
    symbols:
      'm': 'groups in the neighbourhood'
      'Q_1, Q_2': 'labels in exactly one and two groups (CHAO2_Q1_COUNT, CHAO2_Q2_COUNT)'
      'S_{Chao2} - S': 'the labels not yet seen (CHAO2_UNDETECTED); the other CHAO2_* values are as for Chao1'
    use: Better when the data are presence per group rather than counts; needs several groups in the neighbourhood.
    python: 'at(tf.bio.spatial_analysis(bd, C, "chao2"), like="CHAO2")'
    operator: bio.spatial
    setting: calculations = chao2
    aliases: [CHAO2_SE, CHAO2_VARIANCE, CHAO2_UNDETECTED, CHAO2_CI_LOWER, CHAO2_CI_UPPER, CHAO2_Q1_COUNT, CHAO2_Q2_COUNT, CHAO2_META]
    refs: ["Chao (1987). Estimating the population size for capture-recapture data with unequal catchability. Biometrics 43: 783-791."]

  # impl: indices.cpp:707-
  - id: ACE_ESTIMATE
    name: ACE richness estimate
    level: cell
    theme: estimation
    unit: labels
    range: ≥ S
    what: Abundance-based coverage estimator. Labels with 10 or fewer samples are "rare"; their number is inflated by the sample coverage and a coefficient of variation. Falls back on Chao1 when coverage is 0.
    formula: 'S_{ACE} = S_{abund} + \frac{S_{rare}}{C} + \frac{f_1}{C}\gamma^2,\quad C = 1 - \frac{f_1}{N_{rare}}'
    symbols:
      'S_{abund}, S_{rare}': 'labels with more than / at most 10 samples'
      'N_{rare}': 'samples of the rare ones'
      'f_1': 'singletons'
      'C': 'the sample coverage of the rare labels, \(1 - f_1/N_{rare}\)'
      '\gamma^2': 'the coefficient-of-variation term, \(\max\left(\frac{S_{rare}}{C}\frac{\sum_i i(i-1)f_i}{N_{rare}(N_{rare}-1)}-1,\,0\right)\) with the sum over 1 to 10; ACE_ESTIMATE_USED_CHAO is 1 when the Chao1 fallback was used'
    use: Uses all the rare labels, not only singletons and doubletons; the cutoff 10 is fixed. Variance by the delta method as in EstimateS.
    python: 'at(tf.bio.spatial_analysis(bd, C, "ace"), like="ACE")'
    operator: bio.spatial
    setting: calculations = ace
    aliases: [ACE_SE, ACE_VARIANCE, ACE_UNDETECTED, ACE_CI_LOWER, ACE_CI_UPPER, ACE_INFREQUENT_COUNT, ACE_ESTIMATE_USED_CHAO]
    refs: ["Chao & Lee (1992). Estimating the number of classes via sample coverage. Journal of the American Statistical Association 87: 210-217."]

  # impl: indices.cpp:707-
  - id: ICE_ESTIMATE
    name: ICE richness estimate
    level: cell
    theme: estimation
    unit: labels
    range: ≥ S
    what: 'The incidence version of ACE: rare labels are those found in 10 or fewer groups, and the coverage and variation use the number of groups t that hold any label.'
    formula: 'S_{ICE} = S_{freq} + \frac{S_{infreq}}{C} + \frac{Q_1}{C}\gamma^2,\quad C = 1 - \frac{Q_1}{N_{infreq}}(1-A)'
    symbols:
      'S_{freq}, S_{infreq}': 'labels in more than / at most 10 groups'
      'Q_i': 'labels in exactly \(i\) groups'
      'N_{infreq}': 'the sum of the group counts of the infrequent labels'
      't': 'groups holding labels'
      'A': 'the correction \(\frac{2Q_2}{(t-1)Q_1+2Q_2}\) (a variant when \(Q_2=0\))'
      'C': 'the sample coverage of the infrequent labels'
      '\gamma^2': 'the coefficient-of-variation term, with the factor \(t/(t-1)\)'
    use: Use with presence data over several groups; needs t > 1 else it returns the observed richness.
    python: 'at(tf.bio.spatial_analysis(bd, C, "ice"), like="ICE")'
    operator: bio.spatial
    setting: calculations = ice
    aliases: [ICE_SE, ICE_VARIANCE, ICE_UNDETECTED, ICE_CI_LOWER, ICE_CI_UPPER, ICE_INFREQUENT_COUNT, ICE_ESTIMATE_USED_CHAO]
    refs: ["Lee & Chao (1994). Estimating population size via sample coverage for closed capture-recapture models. Biometrics 50: 88-97."]

  # ---------------------------------------------------------------- endemism
  # impl: indices.cpp:415
  - id: ENDW_WE
    name: Weighted endemism (whole neighbourhood)
    level: cell
    theme: endemism
    unit: label equivalents
    range: ≥ 0
    what: Sum over the labels of the neighbourhood of the share of each label's range that lies in it. A label wholly inside counts 1, a widespread one counts little.
    formula: 'WE = \sum_{l} \frac{r_l}{R_l}'
    symbols:
      'r_l': 'groups of the neighbourhood (both sets) that hold label \(l\)'
      'R_l': 'its range in the basedata (the RANGE property if larger)'
    use: Rises with richness as well as with narrow ranges; use the corrected version (ENDW_CWE) to compare cells.
    python: 'at(tf.bio.spatial_analysis(bd, C, "endemism_whole"))'
    operator: bio.spatial
    setting: calculations = endemism_whole
    aliases: [WE, weighted endemism, ENDW_RICHNESS]
    refs: ["Crisp et al. (2001). Endemism in the Australian flora. Journal of Biogeography 28: 183-198.", "Laffan & Crisp (2003). Assessing endemism at multiple spatial scales, with an example from the Australian vascular flora. Journal of Biogeography 30: 511-520."]

  # impl: indices.cpp:432
  - id: ENDW_CWE
    name: Corrected weighted endemism (whole neighbourhood)
    level: cell
    theme: endemism
    unit: none
    range: 0 ≤ CWE ≤ 1
    what: 'Weighted endemism divided by richness: the mean proportion of its range the labels of the neighbourhood have there.'
    formula: 'CWE = \frac{WE}{S}'
    symbols:
      'WE': 'as ENDW_WE'
      'S': 'labels in the neighbourhood'
    use: Removes the richness effect, so it shows range restriction rather than species numbers. Undefined for empty neighbourhoods.
    python: 'at(tf.bio.spatial_analysis(bd, C, "endemism_whole"), "ENDW_CWE")'
    operator: bio.spatial
    setting: calculations = endemism_whole
    aliases: [CWE]
    refs: ["Crisp et al. (2001). Endemism in the Australian flora. Journal of Biogeography 28: 183-198."]

  # impl: indices.cpp:415
  - id: ENDW_SINGLE
    name: Endemism, single (Rosauer)
    level: cell
    theme: endemism
    unit: none
    range: '> 0'
