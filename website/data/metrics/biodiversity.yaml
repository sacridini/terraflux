  # ---------------------------------------------------------------- evolutionary distinctiveness
  # impl: indices.cpp:2319, phylo.cpp:100-190
  - id: PHYLO_AED_LIST
    name: Evolutionary distinctiveness (ED, ES, AED lists)
    level: cell
    theme: evolutionary distinctiveness
    unit: branch length units
    range: '> 0'
    what: 'Per label of the neighbourhood that is on the tree, three distinctiveness scores of its tip: ED (fair proportion), ES (equal splits) and AED (abundance-weighted ED) in the lists PHYLO_ED_LIST, PHYLO_ES_LIST, PHYLO_AED_LIST.'
    formula: 'ED_l = \sum_{n \in \mathrm{anc}(l)} \frac{L_n}{T_n},\quad ES_l = \sum_n L_n \prod \frac{1}{c_a},\quad AED_l = \sum_n \frac{L_n}{N_n}'
    symbols:
      'n': 'the tip and its ancestors on the trimmed tree'
      'T_n': 'terminals below \(n\)'
      'c_a': 'children of each ancestor on the way up (ES)'
      'N_n': 'total samples (basedata-wide, not local) of the labels below \(n\)'
    use: ED/ES/AED rank species by how much unique evolutionary history they carry; AED weights by abundance.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_aed", tree=tree), "PHYLO_AED_LIST")'
    operator: bio.spatial
    setting: calculations = phylo_aed
    aliases: [PHYLO_ED_LIST, PHYLO_ES_LIST, AED, ED, ES]
    refs: ["Cadotte et al. (2010). Phylogenetic diversity metrics for ecological communities: integrating species richness, abundance and evolutionary history. Ecology Letters 13: 96-105.", "Redding & Mooers (2006). Incorporating evolutionary measures into conservation prioritization. Conservation Biology 20: 1670-1678. doi:10.1111/j.1523-1739.2006.00555.x", "Isaac et al. (2007). Mammals on the EDGE: conservation priorities based on threat and phylogeny. PLoS ONE 2: e296. doi:10.1371/journal.pone.0000296"]

