  # ---------------------------------------------------------------- phylogenetic relative
  # impl: indices.cpp:2356
  - id: PHYLO_RPD1
    name: Relative phylogenetic diversity, RPD1
    level: cell
    theme: phylogenetic relative
    unit: none
    range: ≥ 0
    what: PD as a share of the whole tree, divided by the share expected if all the terminals counted equally (labels on the tree over terminals). PHYLO_RPD_NULL1 is the denominator, PHYLO_RPD_DIFF1 the difference scaled to tree length.
    formula: 'RPD1 = \frac{PD_P}{S_{tree}/S_T},\quad DIFF = L_T (PD_P - NULL)'
    symbols:
      'PD_P': 'as PD_P'
      'S_{tree}': 'labels of the neighbourhood on the tree'
      'S_T': 'terminals of the tree'
      'L_T': 'total tree length'
    use: Above 1 the cell holds more phylogenetic history than its richness predicts, below 1 less. Use RPD2 on trees with zero-length branches.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_rpd1", tree=tree))'
    operator: bio.spatial
    setting: calculations = phylo_rpd1
    aliases: [PHYLO_RPD_DIFF1, PHYLO_RPD_NULL1, RPD]
    refs: ["Mishler et al. (2014). Phylogenetic measures of biodiversity and neo- and paleo-endemism in Australian Acacia. Nature Communications 5: 4473. doi:10.1038/ncomms5473"]

  # impl: indices.cpp:2356
  - id: PHYLO_RPD2
    name: Relative phylogenetic diversity, RPD2
    level: cell
    theme: phylogenetic relative
    unit: none
    range: ≥ 0
    what: PD as a share of the tree divided by the same share on a tree with all non-zero branches of equal length.
    formula: 'RPD2 = \frac{PD_P}{k_{PD}/k_T},\quad DIFF = L_T (PD_P - NULL)'
    symbols:
      'k_{PD}': 'non-zero-length branches in the PD tree of the cell'
      'k_T': 'non-zero-length branches in the whole tree; NULL is \(k_{PD}/k_T\) (PHYLO_RPD_NULL2)'
    use: Removes the effect of branch lengths, so it tests whether the cell's lineages are long or short relative to the tree's shape.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_rpd2", tree=tree))'
    operator: bio.spatial
    setting: calculations = phylo_rpd2
    aliases: [PHYLO_RPD_DIFF2, PHYLO_RPD_NULL2]

  # impl: indices.cpp:2375
  - id: PHYLO_RPE1
    name: Relative phylogenetic endemism, RPE1
    level: cell
    theme: phylogenetic relative
    unit: none
    range: ≥ 0
    what: PE as a share of the trimmed tree divided by the weighted endemism of the labels on the trimmed tree over the number of terminals, the PE of a star tree.
    formula: 'RPE1 = \frac{PE_P}{WE_{trim}/S_{trim}},\quad DIFF = L_{trim}(PE_P - NULL)'
    symbols:
      'PE_P': 'as PE_WE_P'
      'WE_{trim}': 'weighted endemism (ENDW_WE) over the labels on the trimmed tree'
      'S_{trim}': 'terminals of the trimmed tree'
      'L_{trim}': 'trimmed tree length'
    use: Tests whether endemism is on long or short branches given the range sizes. Prefer RPE2 when the tree has zero-length branches.
    python: 'at(tf.bio.spatial_analysis(bd, C, "phylo_rpe1", tree=tree))'
    operator: bio.spatial
    setting: calculations = phylo_rpe1
    aliases: [PHYLO_RPE_DIFF1, PHYLO_RPE_NULL1, RPE]
    refs: ["Mishler et al. (2014). Phylogenetic measures of biodiversity and neo- and paleo-endemism in Australian Acacia. Nature Communications 5: 4473. doi:10.1038/ncomms5473"]

  # impl: indices.cpp:2389-2455
  - id: PHYLO_RPE2
    name: Relative phylogenetic endemism, RPE2
    level: cell
    theme: phylogenetic relative
    unit: none
    range: ≥ 0
    what: PE as a share of the tree divided by the PE of the same tree with all non-zero branches set to one equal length. The RPE of the CANAPE test.
    formula: 'RPE2 = \frac{PE_P}{PE_{eq}/L_{eq}},\quad PE_{eq} = \bar\ell\sum_{g}\sum_{b \in g}\frac{[L_b \ne 0]}{R_b}'
    symbols:
      'PE_P': 'as PE_WE_P'
