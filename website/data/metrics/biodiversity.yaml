  # impl: indices.cpp:2517, props.cpp:305
  - id: LBPROP_GISTAR_LIST
    name: Getis-Ord Gi* of label properties
    level: cell
    theme: label properties
    unit: z-score
    range: unbounded
    what: Z-score of the sum of a label property over the neighbourhood against its global mean and spread; positive when the neighbourhood holds unusually high values (LBPROP_GISTAR_LIST per property; the _abc2 version weights labels by range).
    formula: 'G^* = \frac{\sum_l x_l - w\bar x}{s\sqrt{\dfrac{nw - w^2}{n-1}}}'
    symbols:
      'x_l': 'property of label \(l\) in the neighbourhood'
      'w': 'their count (or summed weights)'
      'n': 'the number of labels in the basedata (weights summed)'
      '\bar x, s': 'the global mean and standard deviation, with weight 1 (or the label range for abc2)'
    use: Uses the labels, not the groups, as the units, so it is a hotspot measure of trait values rather than of space. Undefined when \(w=0\).
    python: 'at(tf.bio.spatial_analysis(bd, C, "lbprop_gistar"), "LBPROP_GISTAR_LIST")'
    operator: bio.spatial
    setting: calculations = lbprop_gistar
    aliases: [LBPROP_GISTAR_LIST_ABC2, lbprop_gistar_abc2, Gi*]
    refs: ["Getis & Ord (1992). The analysis of spatial association by use of distance statistics. Geographical Analysis 24: 189-206. doi:10.1111/j.1538-4632.1992.tb00261.x"]

  # impl: indices.cpp:2483-2530, props.cpp:305
  - id: GPPROP_STATS_LIST
    name: Group property statistics
    level: cell
    theme: label properties
    unit: of the property
    range: any
    what: The same statistics as LBPROP_STATS for group properties over the groups of the neighbourhood (COUNT, MEAN, MIN, MAX, MEDIAN, SUM, SD, IQR), quantiles (GPPROP_QUANTILE_LIST, keys GPPROP_STATS_PROP_Q05 ...) and Gi* (GPPROP_GISTAR_LIST).
    formula: '\bar x = \frac{1}{|G|}\sum_{g \in G} x_g,\quad G^* = \frac{\sum_g x_g - |G|\bar x_{glob}}{s\sqrt{\dfrac{n|G| - |G|^2}{n-1}}}'
    symbols:
      'x_g': 'the property of group \(g\)'
      'G': 'the groups of both sets'
      'n': 'all groups of the basedata'
      '\bar x_{glob}, s': 'their mean and standard deviation'
    use: To summarise a cell attribute (elevation, rainfall) over the neighbourhood; Gi* marks hot and cold spots.
    python: 'at(tf.bio.spatial_analysis(bd, C, ["gpprop_stats", "gpprop_quantiles", "gpprop_gistar"]), "GPPROP_STATS_LIST")'
    operator: bio.spatial
    setting: calculations = gpprop_stats
    aliases: [GPPROP_QUANTILE_LIST, GPPROP_GISTAR_LIST, gpprop_quantiles, gpprop_gistar, gpprop_lists, gpprop_hashes]

