  # impl: graph.py:828-847
  - id: conn_diic_fractions
    name: "dIIC fractions (intra, flux, connector)"
    level: node
    theme: importance
    unit: "% of IIC"
    range: "0 ≤ x ≤ 100"
    what: |
      Splits dIIC into the loss of the node's own area, of pairs that have the node as an endpoint, and of pairs whose
      shortest path passed through it.
    use: |
      A large connector part flags a stepping stone; a large intra part flags a patch important by size alone.
    formula: |
      dIIC^{intra}_i = 100\frac{a_i^{2}}{IIC_{num}},\quad dIIC^{flux}_i = 100\frac{2 a_i \sum_{j\neq i}\frac{a_j}{1+nl_{ij}}}{IIC_{num}},\quad dIIC^{connector}_i = dIIC_i - dIIC^{intra}_i - dIIC^{flux}_i
    symbols:
      'dIIC^{intra}_i, dIIC^{flux}_i, dIIC^{connector}_i': "the columns `dIICintra`, `dIICflux`, `dIICconnector`; the connector part is the loss of the pairs that do not contain \\(i\\) but whose shortest path used it"
      'IIC_{num}': "numerator of IIC"
      'nl_{ij}': "links on the shortest path between \\(i\\) and \\(j\\)"
    python: 'top(net.node_importance("IIC", distance=1000), "dIIC", "dIICintra", "dIICflux", "dIICconnector")'
    operator: conn.node_importance
    setting: metrics = IIC
    refs:
      - "Saura & Rubio (2010). A common currency for the different ways in which patches and links can contribute to habitat availability and connectivity in the landscape. Ecography 33: 523-537."

  # impl: graph.py:848-850
