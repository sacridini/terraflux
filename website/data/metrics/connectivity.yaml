  # impl: protconn.py:481-513
  - id: protconn_dprot
    name: "Importance of a protected area (dProt, dProtConn, varProtConn)"
    level: node
    theme: protected-area
    unit: "% (dProt, dProtConn); % of the region (varProtConn)"
    range: "0 ≤ x ≤ 100"
    what: |
      With `delta=True`, each protected area (cut to the region) is rated by the share of the protected surface it
      holds (dProt), by the percent of ProtConn lost when it is removed (dProtConn) and by that loss in percent of the
      region (varProtConn).
    use: |
      Ranks protected areas for their contribution to connected protection.
    formula: |
      dProt_i = 100\frac{a_i}{\sum_k a_k},\quad dProtConn_i = 100\Bigl(1 - \sqrt{1 - dPC_i/100}\Bigr),\quad varProtConn_i = ProtConn\Bigl(1-\sqrt{1 - dPC_i/100}\Bigr)
    symbols:
      'dPC_i': "node importance for PC of area \\( i \\) in the graph of the clipped areas (PC computed without a probability cut); \\( ProtConn \\) here is that graph's value."
    python: 'tf.conn.protconn(reserves, region, distance=2000, delta=True)[1].nlargest(3, "dProtConn")[["dProt", "dProtConn", "varProtConn"]].round(3)'
    operator: conn.protconn
    setting: delta = true
