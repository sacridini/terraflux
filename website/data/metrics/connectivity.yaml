    use: |
      Use when absolute changes of PC are summed across nodes or scenarios.
    formula: |
      varPC_i = PC - PC_{-i} = \frac{dPC_i\,PC_{num}}{100\, LA^{2}}
    symbols:
      'PC_{-i}': "PC of the graph without node \\(i\\), with the same landscape area"
      'dPC_i': "the percent loss of the card above"
