family: connectivity
title: Connectivity
order: 70
source: "Conefor Sensinode (Saura & Torne 2009; Saura & Pascual-Hortal 2007; Pascual-Hortal & Saura 2006) and Makurhini (MK_dPCIIC, MK_dECA, MK_RMCentrality, MK_Focal_nodes, MK_ProtConn)"
intro: |
  Indices of a habitat graph: the nodes are habitat patches with an attribute (usually the area) and the links join patches
  that are close enough for the species to disperse between them. They are the measures of the
  [habitat networks tutorials](../../tutorials/habitat-networks/connectivity-as-a-graph/), and of Conefor Sensinode and
  Makurhini.

  The cards show their values on the forests (CORINE classes 23, 24 and 25) of the 50 x 50 km excerpt around Lake Steinhude
  and Hannover, Lower Saxony, that those tutorials use, on 100 m cells: `net` is the graph of its 154 forest patches
  (51 569 ha of forest in a landscape of 250 000 ha), with edge-to-edge distances, read at a dispersal distance of 1000 m
  and, for the probabilistic indices, a probability of 0.5 at that distance. `scrub` is the same graph with the
  transitional woodland-shrub of class 29 as habitat too. The importance of a node or a link comes as a row for each of the
  154 nodes, so the cards show the three highest, with the small function `top`. The ProtConn cards use the 18 forests of
  500 ha or more as hypothetical reserves (they are not the real protected areas of the region) in the whole square; the
  cards that need a transboundary zone use a region 30 x 30 km inside it, with a zone of 5 km around.

  Conventions: the default `makurhini` convention links pairs closer than the distance (`d < t`), derives the probability
  of a direct link as \(p_{ij} = P^{d_{ij}/t}\) and drops it below `pij_min` (0.01); the `conefor` convention links pairs
  up to the distance (`d <= t`) and keeps every probability. Node importance is the percent loss of an index when the node
  is removed.
example: |
  import geopandas as gpd
  import numpy as np
  import rasterio.features
  import shapely
  import terraflux as tf

  # CORINE land cover of the Steinhude-Hannover excerpt (EPSG:3035) on 100 m cells; the forests are the habitat
  land = tf.reproject(tf.load_raster(tf.example_data("clc")), res=100, resampling="mode")
  kw = dict(area_unit="ha", distance="edge", landscape_area=250_000)       # ha, edge-to-edge distances, a 50 x 50 km landscape
  net = tf.HabitatGraph.from_raster(land, habitat=[23, 24, 25], **kw)
  scrub = tf.HabitatGraph.from_raster(land, habitat=[23, 24, 25, 29], **kw)   # with transitional woodland-shrub as habitat too
  nodes = tf.conn.node_table(land, habitat=[23, 24, 25], area_unit="ha")
  candidate = (nodes["attribute"] >= 40).astype(int).to_numpy()            # 0 marks the forests under 40 ha, candidates to add

  # hypothetical reserves: the forests of 500 ha or more as polygons, in the whole square and in a region inside it
  ids = net.to_raster(nodes[nodes["attribute"] >= 500], "id")
  grid = np.nan_to_num(ids.values).astype("int32")
  shapes = rasterio.features.shapes(grid, mask=grid > 0, transform=land.rio.transform(), connectivity=8)
  reserves = gpd.GeoDataFrame(geometry=[shapely.geometry.shape(s) for s, _ in shapes], crs=land.rio.crs)
  x0, y0, x1, y1 = land.rio.bounds()
  region = gpd.GeoDataFrame(geometry=[shapely.box(x0, y0, x1, y1)], crs=land.rio.crs)
  inner = gpd.GeoDataFrame(geometry=[shapely.box(x0 + 10_000, y0 + 10_000, x1 - 10_000, y1 - 10_000)], crs=land.rio.crs)


  def top(table, by, *cols, n=3):
      """The n rows of a table with the highest value of a column, with some other columns."""
      return table.nlargest(n, by)[["id", by, *cols]].round(4)
metrics:
  # impl: graph.py:706
  - id: conn_a
    name: "Total node attribute (A)"
    level: network
    theme: structural
    unit: "unit of the attribute (e.g. ha)"
    range: "A ≥ 0"
    what: |
      The sum of the attributes of all nodes, normally the total habitat area. It is the denominator of CCP and of the
      node importance dA.
    use: |
      Context for the other indices. Not a connectivity measure by itself.
    formula: |
      A = \sum_{i=1}^{n} a_i
    symbols:
      'a_i': "attribute of node \\( i \\)"
      'n': "number of nodes."
    python: 'net.overall("A", distance=1000)["A"][0]'
    operator: conn.overall
    setting: metrics = A
    refs:
      - "Saura & Torné (2009). Conefor Sensinode 2.2: a software package for quantifying the importance of habitat patches for landscape connectivity. Environmental Modelling & Software 24: 135-139. doi:10.1016/j.envsoft.2008.05.005"

  # impl: graph.py:708 (counted in the Rust core, conn_analyse)
  - id: conn_nc
    name: "Number of components (NC)"
    level: network
    theme: structural
    unit: "count"
    range: "1 ≤ NC ≤ n"
    what: |
      How many groups of nodes are connected to each other by links at the chosen distance. A single component means
      any patch can be reached from any other through stepping stones.
    use: |
      A coarse indicator; it ignores patch size and the strength of connections. Use IIC, PC or CCP when sizes matter.
    formula: |
      NC = \#\{\text{connected components of the link graph}\}
    symbols:
      'l_{ij}': "1 when nodes \\(i\\) and \\(j\\) are linked, that is when \\(d_{ij} < t\\) (\\(d_{ij} \\le t\\) with the Conefor convention)"
    python: 'net.overall("NC", distance=1000)["NC"][0]'
    operator: conn.overall
    setting: metrics = NC
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:710
  - id: conn_nl
    name: "Number of links (NL)"
    level: network
    theme: structural
    unit: "count"
    range: "0 ≤ NL ≤ n(n-1)/2"
    what: |
      The number of node pairs that are linked at the chosen distance.
    use: |
      Grows with the threshold; it does not tell whether the links join separate groups or only add redundancy.
    formula: |
      NL = \sum_{i<j} l_{ij}, \qquad l_{ij}=\begin{cases}1 & d_{ij} < t\\ 0 & \text{otherwise}\end{cases}
    symbols:
      'l_{ij}': "1 when nodes \\( i \\) and \\( j \\) are linked"
      'd_{ij}': "distance"
      't': "distance threshold."
    python: 'net.overall("NL", distance=1000)["NL"][0]'
    operator: conn.overall
    setting: metrics = NL
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:712 (r["h"]); example: 1 + 1 + 1/2 = 2.5
  - id: conn_h
    name: "Harary index (H)"
    level: network
    theme: structural
    unit: "none"
    range: "H ≥ 0"
    what: |
      The sum, over node pairs, of the inverse of the number of links on the shortest path. Pairs in different
      components contribute nothing; closely linked pairs contribute most.
    use: |
      Topological only (ignores areas). Sensitive to the number of nodes, so compare graphs with the same nodes.
    formula: |
      H = \sum_{i<j} \frac{1}{nl_{ij}}
    symbols:
      'nl_{ij}': "number of links on the shortest path between \\( i \\) and \\( j \\) in the link graph; pairs without a path add 0."
    python: 'net.overall("H", distance=1000)["H"][0]'
    operator: conn.overall
    setting: metrics = H
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:715 (comp_sq / total^2); (170^2 + 80^2) / 250^2
  - id: conn_ccp
    name: "Class coincidence probability (CCP)"
    level: network
    theme: structural
    unit: "none"
    range: "0 < CCP ≤ 1"
    what: |
      The probability that two random points in the habitat fall in the same component. It is 1 when all habitat is in
      one component and falls as the habitat splits into pieces.
    use: |
      Normalised by the habitat present, not by the landscape. Use LCP when different landscapes (or habitat amounts)
      are compared.
    formula: |
      CCP = \frac{\sum_{k} A_k^{2}}{A^{2}}
    symbols:
      'A_k': "sum of node attributes in component \\( k \\); \\( A = \\sum_i a_i \\)."
    python: 'net.overall("CCP", distance=1000)["CCP"][0]'
    operator: conn.overall
    setting: metrics = CCP
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:716-718
  - id: conn_lcp
    name: "Landscape coincidence probability (LCP)"
    level: network
    theme: structural
    unit: "none"
    range: "0 ≤ LCP ≤ 1"
    what: |
      Like CCP but divided by the whole landscape area, so it also drops when habitat is lost.
    use: |
      Needs a landscape area. Good for comparing landscapes or scenarios of the same extent.
    formula: |
      LCP = \frac{\sum_{k} A_k^{2}}{LA^{2}}
    symbols:
      'A_k': "attribute total of component \\( k \\)"
      'LA': "landscape attribute (`landscape_area`). Without `landscape_area` Makurhini gives only the numerator (here NaN), Conefor uses \\( LA = 1 \\). The numerator is also returned as `LCPnum`."
    python: 'net.overall("LCP", distance=1000)["LCP"][0]'
    operator: conn.overall
    setting: metrics = LCP
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:719-722, 741-750
  - id: conn_iic
    name: "Integral index of connectivity (IIC)"
    level: network
    theme: structural
    unit: "none"
    range: "0 ≤ IIC ≤ 1"
    aliases: [integral index of connectivity]
    what: |
      Habitat available in the landscape, counting each pair of patches weighted by their sizes and discounted by the
      number of links between them. It rises with larger patches and with shorter link paths, and is 1 when all the
      landscape is one habitat patch.
    use: |
      Binary links: it does not use dispersal probabilities. Prefer PC for graded dispersal. Needs `landscape_area`,
      otherwise NaN.
    formula: |
      IIC = \frac{1}{LA^{2}} \sum_{i=1}^{n}\sum_{j=1}^{n} \frac{a_i\, a_j}{1 + nl_{ij}}
    symbols:
      'a_i': "node attribute"
      'nl_{ij}': "links on the shortest path (0 for \\( i = j \\))"
      'LA': "landscape attribute. Pairs without a path add 0 (Conefor); with the `makurhini` convention they add \\( a_i a_j/(1+16443701) \\) (Makurhini's stand-in for an unreachable pair, practically 0), and the value is capped at 1. The numerator is `IICnum`."
    python: 'net.overall("IIC", distance=1000)["IIC"][0]'
    operator: conn.overall
    setting: metrics = IIC
    refs:
      - "Pascual-Hortal & Saura (2006). Comparison and development of new graph-based landscape connectivity indices: towards the prioritization of habitat patches and corridors for conservation. Landscape Ecology 21: 959-967."

  # impl: graph.py:742, 750
  - id: conn_ec_iic
    name: "Equivalent connectivity of IIC (EC(IIC))"
    level: network
    theme: structural
    unit: "unit of the attribute (e.g. ha)"
    range: "0 ≤ EC(IIC) ≤ LA"
    aliases: [ECA, equivalent connected area]
    what: |
      The size of a single habitat patch that would give the same IIC as the real graph. It puts IIC back in area
      units (also called ECA).
    use: |
      Easier to read than IIC and comparable across scenarios; changes of EC in % are what `eca_change` reports.
    formula: |
      EC(IIC) = \sqrt{\sum_{i}\sum_{j} \frac{a_i\, a_j}{1 + nl_{ij}}} = LA\sqrt{IIC}
    symbols:
      'IIC': "the integral index of connectivity (the card above)"
      'LA': "landscape attribute; with the `makurhini` convention the result is capped at it"
    python: 'net.overall("IIC", distance=1000)["EC(IIC)"][0]'
    operator: conn.overall
    setting: metrics = IIC
    refs:
      - "Saura et al. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."

  # impl: graph.py:723-724, 752-755 (direct = r["iic_direct"], step = reach - intra - direct)
  - id: conn_iic_fractions
    name: "IIC fractions (intra, direct, step)"
    level: network
    theme: structural
    unit: "% of IICnum"
    range: "0 ≤ x ≤ 100; the three sum to 100"
    what: |
      Splits the IIC numerator into the part from within the patches themselves, the part from directly linked pairs
      and the part from pairs reached through stepping stones.
    use: |
      Shows how much connectivity depends on patch size alone, on neighbours, or on stepping stones.
    formula: |
      IIC_{intra} = \frac{100\sum_i a_i^{2}}{IIC_{num}},\quad IIC_{direct} = \frac{100\sum_{i\neq j,\, nl_{ij}=1}\frac{a_i a_j}{2}}{IIC_{num}},\quad IIC_{step} = 100 - IIC_{intra} - IIC_{direct}
    symbols:
      'IIC_{num}': "numerator of IIC; direct pairs are those one link apart (the sum runs over ordered pairs). Columns `IICintra(%)`, `IICdirect(%)`, `IICstep(%)`."
    python: 'net.overall("IIC", distance=1000)[["IICintra(%)", "IICdirect(%)", "IICstep(%)"]]'
    operator: conn.overall
    setting: metrics = IIC
    refs:
      - "Saura & Rubio (2010). A common currency for the different ways in which patches and links can contribute to habitat availability and connectivity in the landscape. Ecography 33: 523-537."

  # impl: graph.py:725-726 (sum of the rows); checked by hand: 2 x 1.806 = 3.613
  - id: conn_f
    name: "Flux (F)"
    level: network
    theme: probabilistic
    unit: "none"
    range: "F ≥ 0"
    what: |
      The total dispersal flux between patches: the sum of the direct dispersal probabilities over all ordered pairs
      of different nodes.
    use: |
      Uses direct links only (no stepping stones) and no areas; AWF adds the areas. Needs distances or probabilities.
    formula: |
      F = \sum_{i \neq j} p_{ij}
    symbols:
      'p_{ij} = P^{d_{ij}/t}': "probability of direct dispersal at distance \\( d_{ij} \\) (\\( P \\) is the probability at the threshold \\( t \\)); values below `pij_min` are dropped."
    python: 'net.overall("F", distance=1000, probability=0.5)["F"][0]'
    operator: conn.overall
    setting: metrics = F
    refs:
      - "Saura & Torné (2009). Conefor Sensinode 2.2: a software package for quantifying the importance of habitat patches for landscape connectivity. Environmental Modelling & Software 24: 135-139. doi:10.1016/j.envsoft.2008.05.005"

  # impl: graph.py:727-728 (a . awf_row)
  - id: conn_awf
    name: "Area-weighted flux (AWF)"
    level: network
    theme: probabilistic
    unit: "unit of the attribute squared"
    range: "AWF ≥ 0"
    what: |
      Like the flux, but each pair of patches is weighted by the product of their attributes, so exchange between
      large patches counts most.
    use: |
      Direct dispersal only. PC extends it with the best path through stepping stones and adds the intra-patch term.
    formula: |
      AWF = \sum_{i \neq j} a_i\, a_j\, p_{ij}
    symbols:
      'a_i': "attribute of node \\(i\\)"
      'p_{ij}': "probability of direct dispersal between \\(i\\) and \\(j\\) (as F)"
    python: 'net.overall("AWF", distance=1000, probability=0.5)["AWF"][0]'
    operator: conn.overall
    setting: metrics = AWF
    refs:
      - "Saura & Torné (2009). Conefor Sensinode 2.2: a software package for quantifying the importance of habitat patches for landscape connectivity. Environmental Modelling & Software 24: 135-139. doi:10.1016/j.envsoft.2008.05.005"

  # impl: graph.py:729-733, 741-750
  - id: conn_pc
    name: "Probability of connectivity (PC)"
    level: network
    theme: probabilistic
    unit: "none"
    range: "0 ≤ PC ≤ 1"
    aliases: [probability of connectivity]
    what: |
      The probability that two random points of the landscape fall in habitat areas that are connected, taking into
      account the best dispersal path (possibly through stepping stones) between every pair of patches.
    use: |
      The preferred index when dispersal probabilities are known. Needs `landscape_area` for the 0-1 value (NaN
      otherwise); depends on the probability chosen at the distance.
    formula: |
      PC = \frac{1}{LA^{2}} \sum_{i=1}^{n}\sum_{j=1}^{n} a_i\, a_j\, p^{*}_{ij}
    symbols:
      'p^{*}_{ij}': "the highest product of direct probabilities \\( p_{ij} = P^{d_{ij}/t} \\) along any path between \\( i \\) and \\( j \\) (1 for \\( i = j \\), 0 if no path stays above `pij_min`)"
      'LA': "landscape attribute. The numerator is `PCnum`; the Makurhini convention caps PC at 1."
    python: 'net.overall("PC", distance=1000, probability=0.5)["PC"][0]'
    operator: conn.overall
    setting: metrics = PC
    refs:
      - "Saura & Pascual-Hortal (2007). A new habitat availability index to integrate connectivity in landscape conservation planning: comparison with existing indices and application to a case study. Landscape and Urban Planning 83: 91-103."

  # impl: graph.py:742, 750
  - id: conn_ec_pc
    name: "Equivalent connectivity of PC (EC(PC))"
    level: network
    theme: probabilistic
    unit: "unit of the attribute (e.g. ha)"
    range: "0 ≤ EC(PC) ≤ LA"
    aliases: [ECA, equivalent connected area]
    what: |
      The size of a single patch with the same PC as the graph, in area units. It is the ECA most often reported.
    use: |
      Compare habitat-area changes with `eca_change`. A drop of EC larger than the drop of habitat area means
      connectivity was lost too.
    formula: |
      EC(PC) = \sqrt{\sum_i\sum_j a_i\, a_j\, p^{*}_{ij}} = LA \sqrt{PC}
    symbols:
      'PC': "the probability of connectivity (the card above)"
      'LA': "landscape attribute; with the `makurhini` convention the result is capped at it"
    python: 'net.overall("PC", distance=1000, probability=0.5)["EC(PC)"][0]'
    operator: conn.overall
    setting: metrics = PC
    refs:
      - "Saura et al. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."

  # impl: graph.py:732-733, 752-755
  - id: conn_pc_fractions
    name: "PC fractions (intra, direct, step)"
    level: network
    theme: probabilistic
    unit: "% of PCnum"
    range: "0 ≤ x ≤ 100; the three sum to 100"
    what: |
      The share of PC due to the area of the patches themselves, to direct dispersal between patches, and to dispersal
      through stepping stones.
    use: |
      A high step share means the network works through stepping stones; removing the middle patches would hurt most.
    formula: |
      PC_{intra} = \frac{100\sum_i a_i^{2}}{PC_{num}},\quad PC_{direct} = \frac{100\sum_{i\neq j} a_i a_j p_{ij}}{PC_{num}},\quad PC_{step} = 100 - PC_{intra} - PC_{direct}
    symbols:
      'PC_{num}': "numerator of PC, \\(\\sum_i\\sum_j a_i a_j p^{*}_{ij}\\)"
      'p_{ij}': "probability of direct dispersal between \\(i\\) and \\(j\\); the columns are `PCintra(%)`, `PCdirect(%)`, `PCstep(%)`"
    python: 'net.overall("PC", distance=1000, probability=0.5)[["PCintra(%)", "PCdirect(%)", "PCstep(%)"]]'
    operator: conn.overall
    setting: metrics = PC

  # impl: graph.py:806-807
  - id: conn_da
    name: "Node importance of area (dA)"
    level: node
    theme: importance
    unit: "%"
    range: "0 < dA < 100"
    what: |
      The share of the total attribute held by the node: what is lost if only its area counted.
    use: |
      The baseline against which dIIC and dPC show the extra weight of connectivity.
    formula: |
      dA_i = 100\,\frac{a_i}{A}
    symbols:
      'a_i': "attribute of node \\( i \\)"
      'A': "total attribute."
    python: 'top(net.node_importance("A", distance=1000), "dA")'
    operator: conn.node_importance
    setting: metrics = A
    refs:
      - "Saura & Rubio (2010). A common currency for the different ways in which patches and links can contribute to habitat availability and connectivity in the landscape. Ecography 33: 523-537."

  # impl: graph.py:812-813
  - id: conn_dnc
    name: "Node importance for NC (dNC)"
    level: node
    theme: importance
    unit: "%"
    range: "can be negative (removal splits a component)"
    what: |
      The percent change in the number of components when the node is removed. Negative when removing it splits its
      component in two or more, positive when it was a component on its own.
    use: |
      Finds cut nodes (negative values). Ignores sizes.
    formula: |
      dNC_i = 100\,\frac{NC - NC_{-i}}{NC}
    symbols:
      'NC_{-i}': "components of the graph without node \\( i \\). An isolated node gives \\( +100/NC \\)."
    python: 'net.node_importance("NC", distance=1000).nsmallest(3, "dNC")[["id", "dNC"]].round(4)'
    operator: conn.node_importance
    setting: metrics = NC

  # impl: graph.py:814-816
  - id: conn_dnl
    name: "Node importance for NL (dNL)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dNL ≤ 100"
    what: |
      The share of all links that are lost when the node is removed, i.e. its degree relative to NL.
    use: |
      A degree measure; blind to the sizes and to what lies behind the links.
    formula: |
      dNL_i = 100\,\frac{k_i}{NL}
    symbols:
      'k_i': "number of links of node \\( i \\)."
    python: 'top(net.node_importance("NL", distance=1000), "dNL")'
    operator: conn.node_importance
    setting: metrics = NL

  # impl: graph.py:817-819
  - id: conn_dh
    name: "Node importance for H (dH)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dH ≤ 100"
    what: |
      The percent of the Harary index lost when the node is removed, both from its own pairs and from pairs whose
      shortest path went through it.
    use: |
      Topological importance; needs the links only.
    formula: |
      dH_i = 100\,\frac{H - H_{-i}}{H}
    symbols:
      'H_{-i}': "Harary index of the graph without node \\( i \\)."
    python: 'top(net.node_importance("H", distance=1000), "dH")'
    operator: conn.node_importance
    setting: metrics = H

  # impl: graph.py:820-823
  - id: conn_dccp
    name: "Node importance for CCP (dCCP)"
    level: node
    theme: importance
    unit: "%"
    range: "can be negative"
    what: |
      The percent change of CCP when the node is removed. Negative when removing the node leaves a more concentrated
      habitat, as for a patch that was poorly connected to the rest.
    use: |
      Because CCP is normalised by the remaining habitat, a negative sign can reflect that the removed node was poorly
      connected.
    formula: |
      dCCP_i = 100\,\frac{CCP - CCP_{-i}}{CCP}
    symbols:
      'CCP_{-i}': "CCP of the graph without node \\( i \\) (recomputed with \\( A - a_i \\))."
    python: 'top(net.node_importance("CCP", distance=1000), "dCCP")'
    operator: conn.node_importance
    setting: metrics = CCP

  # impl: graph.py:824-825
  - id: conn_dlcp
    name: "Node importance for LCP (dLCP)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dLCP ≤ 100"
    what: |
      The percent of LCP lost when the node is removed (its component's area leaves the sum of squares).
    use: |
      Rates nodes by their weight in the largest components.
    formula: |
      dLCP_i = 100\,\frac{LCP - LCP_{-i}}{LCP}
    symbols:
      'LCP_{-i}': "LCP of the graph without node \\( i \\), with the same landscape area."
    python: 'top(net.node_importance("LCP", distance=1000), "dLCP")'
    operator: conn.node_importance
    setting: metrics = LCP

  # impl: graph.py:826-847
  - id: conn_diic
    name: "Node importance for IIC (dIIC)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dIIC ≤ 100"
    what: |
      The percent of IIC lost when the node is removed. It is the node's own area, its flux with other nodes and its
      role as a connector (stepping stone) between others.
    use: |
      The standard priority ranking for habitat patches with binary links. With the `makurhini` convention unreachable
      pairs count in the whole graph but not in the reduced graph, which slightly changes flux and connector.
    formula: |
      dIIC_i = 100\,\frac{IIC - IIC_{-i}}{IIC} = dIIC^{intra}_i + dIIC^{flux}_i + dIIC^{connector}_i
    symbols:
      'IIC_{-i}': "IIC of the graph without node \\( i \\), same landscape area."
