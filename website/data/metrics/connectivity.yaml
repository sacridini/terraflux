  # impl: graph.py:854-859
  - id: conn_dpc
    name: "Node importance for PC (dPC)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dPC ≤ 100"
    aliases: [dI, node importance]
    what: |
      The percent of PC lost when the node is removed, combining its area, its direct exchange with other nodes and
      its role as stepping stone.
    use: |
      The standard ranking of patches for conservation priority with probabilistic dispersal.
    formula: |
      dPC_i = 100\,\frac{PC - PC_{-i}}{PC} = dPC^{intra}_i + dPC^{flux}_i + dPC^{connector}_i
    symbols:
      'PC_{-i}': "PC of the graph without node \\( i \\), same landscape area."
    python: 'top(net.node_importance("PC", distance=1000, probability=0.5), "dPC")'
    operator: conn.node_importance
    setting: metrics = PC
    refs:
      - "Saura & Rubio (2010). A common currency for the different ways in which patches and links can contribute to habitat availability and connectivity in the landscape. Ecography 33: 523-537."

  # impl: graph.py:856-862
  - id: conn_dpc_fractions
    name: "dPC fractions (intra, flux, connector)"
    level: node
    theme: importance
    unit: "% of PC"
    range: "0 ≤ x ≤ 100"
    what: |
      The parts of dPC due to the node's own area, to the flux with other nodes and to its role as connector.
    use: |
      As for IIC: separates size, position and stepping-stone value.
    formula: |
      dPC^{intra}_i = 100\frac{a_i^{2}}{PC_{num}},\quad dPC^{flux}_i = 100\frac{2 a_i\sum_{j\neq i} a_j p^{*}_{ij}}{PC_{num}},\quad dPC^{connector}_i = dPC_i - dPC^{intra}_i - dPC^{flux}_i
    symbols:
      'dPC^{intra}_i, dPC^{flux}_i, dPC^{connector}_i': "the columns `dPCintra`, `dPCflux`, `dPCconnector`"
      'PC_{num}': "numerator of PC, \\(\\sum_i\\sum_j a_i a_j p^{*}_{ij}\\)"
      'p^{*}_{ij}': "highest product of direct probabilities along a path between \\(i\\) and \\(j\\)"
    python: 'top(net.node_importance("PC", distance=1000, probability=0.5), "dPC", "dPCintra", "dPCflux", "dPCconnector")'
    operator: conn.node_importance
    setting: metrics = PC

  # impl: graph.py:863
  - id: conn_varpc
    name: "Absolute loss of PC (varPC)"
