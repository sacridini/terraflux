    name: "Node importance for F (dF)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ dF ≤ 100"
    what: |
      The percent of the flux lost when the node is removed (all its direct links).
    use: |
      Direct links only; sizes ignored.
    formula: |
      dF_i = 100\,\frac{2\sum_{j\neq i} p_{ij}}{F}
    symbols:
      'p_{ij}': "direct dispersal probability"
