  # impl: change.py:27 ff.
  - id: conn_eca
    name: "ECA of a time (ECA)"
    level: network
    theme: change
    unit: "unit of the attribute (e.g. ha)"
    range: "0 ≤ ECA ≤ LA"
    what: |
      The equivalent connected area of the graph of each time or scenario, EC(PC) or EC(IIC), together with its share
      of the landscape (ECA_LA) and of the habitat area (ECA_area).
    use: |
      ECA_area near 100 means the habitat is almost fully connected; a falling value means fragmentation within the
      habitat.
    formula: |
      ECA = EC(\mathrm{PC\ or\ IIC}),\quad ECA_{LA} = 100\,\frac{ECA}{LA},\quad ECA_{area} = 100\,\frac{ECA}{A}
    symbols:
      'A': "habitat area of that time (the sum of the node attributes or the habitat area of raster or vector nodes)"
      'LA': "landscape area, common to all times."
    python: 'tf.conn.eca_change([net, scrub], "PC", distance=1000, probability=0.5, landscape_area=250_000)[["ECA", "ECA_LA", "ECA_area"]].round(3)'
    operator: conn.eca_change
    refs:
      - "Saura et al. (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package, function MK_dECA. doi:10.5281/zenodo.3748095"

  # impl: change.py:14-24 and eca_change body
  - id: conn_deca
    name: "Change of ECA and of habitat area (dECA, dA, rECA)"
    level: network
    theme: change
    unit: "% (dECA, dA); none (rECA)"
    range: "dECA, dA > -100 after the first time"
    what: |
      The percent change of ECA and of habitat area between consecutive times (the first time is compared with LA),
      and their ratio. It separates habitat loss from connectivity loss.
    use: |
      rECA above 1 means connectivity changes faster than the area. Needs a common landscape area.
    formula: |
      dECA_t = 100\,\frac{ECA_t - ECA_{t-1}}{ECA_{t-1}},\quad dA_t = 100\,\frac{A_t - A_{t-1}}{A_{t-1}},\quad rECA_t = \frac{dECA_t}{dA_t}
    symbols:
      'ECA_t': "equivalent connected area at time \\(t\\)"
      'A_t': "habitat area at time \\(t\\)"
      'LA': "landscape area, used as \\(ECA_{t-1}\\) and \\(A_{t-1}\\) at the first time; `comparison` and `change` classify the pair (dECA < dA < 0: connectivity loss beyond habitat loss; dA < dECA < 0: habitat loss; equal; or a gain), as Makurhini's dECAfun"
    python: 'tf.conn.eca_change([net, scrub], "PC", distance=1000, probability=0.5, landscape_area=250_000)[["dA", "dECA", "rECA", "change"]].round(3)'
    operator: conn.eca_change
    refs:
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package, function MK_dECA. doi:10.5281/zenodo.3748095"

  # impl: focal.py:25-110
  - id: conn_icomp
    name: "Composite connectivity of a focal node (IComp)"
    level: node
    theme: importance
    unit: "none"
    range: "IComp ≥ 0"
    what: |
      For a node and the neighbourhood of nodes around it (within a search buffer), the product of the neighbourhood's
      IIC (or PC) and the node's dIIC (or dPC). It is high where the surroundings are connected and the focal node
      matters in them.
    use: |
      Ranks nodes locally; the neighbourhood is defined by the buffer you choose.
    formula: |
      IComp_i = IIC_{N(i)} \times dIIC_i^{N(i)}
    symbols:
      'N(i)': "nodes whose polygons intersect the buffer of node \\( i \\); IIC and dIIC are computed on that sub-graph with the area of its bounding box as landscape (PC and dPC with `metric=\"PC\"`). NaN with fewer than three nodes."
    python: 'tf.conn.focal_nodes(reserves, distance=2000, search_buffer=12000).nlargest(3, "IComp")[["id", "dIIC", "IComp"]].round(4)'
    operator: conn.focal_nodes
    refs:
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package, function MK_Focal_nodes. doi:10.5281/zenodo.3748095"

  # impl: protconn.py:292-305
  - id: protconn_eca
    name: "ProtConn ECA (ECA)"
    level: region
    theme: protected-area
    unit: "unit of area_unit (m2, ha, km2)"
    range: "0 ≤ ECA ≤ LA"
    what: |
      The equivalent connected area of the protected areas in a region: the area of one protected patch that would
      give the same PC.
    use: |
      With a single protected node the result is the node's area (capped at LA).
    formula: |
      ECA = \sqrt{\sum_{i}\sum_{j} a_i\, a_j\, p^{*}_{ij}}
    symbols:
      'a_i': "area of protected node \\(i\\): the protected areas cut to the region, dissolved and split into separate polygons (distances between edges, or least-cost)"
      'p^{*}_{ij}': "highest product of direct probabilities along a path between \\(i\\) and \\(j\\); transboundary and region nodes take part as stepping stones, their products \\(a_i a_j\\) replaced by `transboundary_weight` (1 for Makurhini; 0 for Saura et al. 2017)"
    python: 'tf.conn.protconn(reserves, region, distance=2000, area_unit="ha")["ECA"][0]'
    operator: conn.protconn
    refs:
      - "Saura et al. (2017). Protected areas in the world's ecoregions: how well connected are they? Ecological Indicators 76: 144-158."
      - "Saura et al. (2018). Protected area connectivity: shortfalls in global targets and country-level priorities. Biological Conservation 219: 53-67."
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package, function MK_ProtConn. doi:10.5281/zenodo.3748095"

  # impl: protconn.py:305
  - id: protconn_pc
    name: "ProtConn PC (PC)"
    level: region
    theme: protected-area
    unit: "none"
    range: "0 ≤ PC ≤ 1"
    what: |
      The probability of connectivity of the protected-area network in the region.
    use: |
      Usually read through ProtConn (its square root, in %).
    formula: |
      PC = \frac{ECA^{2}}{LA^{2}}
    symbols:
      'LA': "area of the region."
    python: 'tf.conn.protconn(reserves, region, distance=2000)["PC"][0]'
    operator: conn.protconn

  # impl: protconn.py:138, 284
  - id: protconn_la
    name: "Region area (LA)"
    level: region
    theme: protected-area
    unit: "unit of area_unit"
    range: "LA > 0"
    what: |
      The area of the region (all polygons merged) in the chosen unit.
    use: |
      The denominator of all percentages below.
    formula: |
      LA = \sum \text{areas of the region polygons}
    symbols:
      'LA': "area of the region polygons, computed with GDAL areas on the projected polygons"
    python: 'tf.conn.protconn(reserves, region, distance=2000, area_unit="ha")["LA"][0]'
    operator: conn.protconn
    setting: area_unit = "ha"

  # impl: protconn.py:304-305
  - id: protconn_protected_surface
    name: "Protected surface"
    level: region
    theme: protected-area
    unit: "unit of area_unit"
    range: "0 ≤ x ≤ LA"
    what: |
      The total area of the protected areas inside the region (non-transboundary nodes, after dissolving).
    use: |
      Overlapping protected areas are dissolved, so overlaps are not double counted.
    formula: |
      A_{prot} = \sum_{i \in \text{inside}} a_i
    symbols:
      'a_i': "area of protected node \\(i\\); only nodes of type Non-Transboundary are summed"
    python: 'tf.conn.protconn(reserves, region, distance=2000, area_unit="ha")["Protected_surface"][0]'
    operator: conn.protconn

  # impl: protconn.py:306
  - id: protconn_prot
    name: "Protected area (Prot)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "0 ≤ Prot ≤ 100"
    what: |
      The share of the region that is protected.
    use: |
      The Aichi/Kunming-Montreal style coverage indicator; says nothing about connectivity.
    formula: |
      Prot = 100\,\frac{A_{prot}}{LA}
    symbols:
      'A_{prot}': "protected surface"
      'LA': "region area."
    python: 'tf.conn.protconn(reserves, region, distance=2000)["Prot"][0]'
    operator: conn.protconn

  # impl: protconn.py:307
  - id: protconn_protconn
    name: "Protected connected land (ProtConn)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "0 ≤ ProtConn ≤ Prot"
    what: |
      The share of the region that is both protected and connected: the ECA of the protected-area network as a
      percentage of the region.
    use: |
      The headline indicator; it depends on the dispersal distance and the probability assumed. Compare with Prot to
      see how much of the protection is connected.
    formula: |
      ProtConn = 100\,\frac{ECA}{LA}
    symbols:
      'ECA': "equivalent connected area of the protected areas (above)."
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn"][0]'
    operator: conn.protconn
    refs:
      - "Saura et al. (2017). Protected areas in the world's ecoregions: how well connected are they? Ecological Indicators 76: 144-158."
      - "Saura et al. (2018). Protected area connectivity: shortfalls in global targets and country-level priorities. Biological Conservation 219: 53-67."

  # impl: protconn.py:308
  - id: protconn_protunconn
    name: "Protected unconnected land (ProtUnconn)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "0 ≤ ProtUnconn ≤ Prot"
    what: |
      The part of the protected area that is not connected: Prot minus ProtConn.
    use: |
      Shows how much protected land is isolated at the chosen distance.
    formula: |
      ProtUnconn = Prot - ProtConn
    symbols:
      'Prot': "share of the region that is protected"
      'ProtConn': "share of the region that is protected and connected"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtUnconn"][0]'
    operator: conn.protconn

  # impl: protconn.py:309
  - id: protconn_relconn
    name: "Relative connectivity (RelConn)"
    level: region
    theme: protected-area
    unit: "% of protected area"
    range: "0 ≤ RelConn ≤ 100"
    what: |
      The share of the protected area that is connected.
    use: |
      Useful for comparing regions with different coverage.
    formula: |
      RelConn = 100\,\frac{ProtConn}{Prot}
    symbols:
      'ProtConn': "share of the region that is protected and connected"
      'Prot': "share of the region that is protected"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["RelConn"][0]'
    operator: conn.protconn

  # impl: protconn.py:310
  - id: protconn_unprotected
    name: "Unprotected land (Unprotected)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of the region that is not protected.
    use: |
      Complement of Prot.
    formula: |
      Unprotected = 100 - Prot
    symbols:
      'Prot': "share of the region that is protected"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["Unprotected"][0]'
    operator: conn.protconn

  # impl: protconn.py:324-326
  - id: protconn_protunconn_design
    name: "Design of unconnected land (ProtUnconn_Design)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "any real"
    what: |
      The change in connected area when the region itself is added as a stepping-stone node. Only given when
      `bound=True` and transboundary nodes exist; NaN otherwise.
    use: |
      A technical term of the ProtConn[Bound] decomposition.
    formula: |
      ProtUnconn_{Design} = 100\,\frac{ECA_{all} - ECA}{LA}
    symbols:
      'ECA_{all}': "ECA of the graph with the region node included."
    python: 'tf.conn.protconn(reserves, inner, distance=2000, transboundary=5000, bound=True)["ProtUnconn_Design"][0]'
    operator: conn.protconn
    setting: bound = true

  # impl: protconn.py:327
  - id: protconn_protconn_bound
    name: "ProtConn within the boundary (ProtConn_Bound)"
    level: region
    theme: protected-area
    unit: "% of the region"
    range: "0 ≤ x ≤ Prot"
    what: |
      The part of the protected area that is connected through the region's boundary, as Prot minus
      ProtUnconn[Design].
    use: |
      Technical term of the decomposition.
    formula: |
      ProtConn_{Bound} = Prot - ProtUnconn_{Design}
    symbols:
      'Prot': "share of the region that is protected"
      'ProtUnconn_{Design}': "the card above; NaN unless `bound=True` with transboundary nodes"
    python: 'tf.conn.protconn(reserves, inner, distance=2000, transboundary=5000, bound=True)["ProtConn_Bound"][0]'
    operator: conn.protconn
    setting: bound = true

  # impl: protconn.py:311
  - id: protconn_protconn_prot
    name: "ProtConn[Prot]"
    level: region
    theme: protected-area
    unit: "% of ProtConn"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of ProtConn that comes from the area of the protected nodes themselves (intra-node connectivity).
    use: |
      Together with Trans and Unprot it sums to 100 (with Within and Contig, a second decomposition).
    formula: |
      ProtConn_{Prot} = 100\,\frac{100\sqrt{\sum_i a_i^{2}}\,/\,LA}{ProtConn}
    symbols:
      'a_i': "area of protected node \\( i \\)."
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn_Prot"][0]'
    operator: conn.protconn

  # impl: protconn.py:312-316
  - id: protconn_protconn_trans
    name: "ProtConn[Trans]"
    level: region
    theme: protected-area
    unit: "% of ProtConn"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of ProtConn that depends on transboundary protected areas (outside the region within the transboundary
      distance).
    use: |
      Needs `transboundary`. Shows how much a region relies on its neighbours.
    formula: |
      ProtConn_{Trans} = 100\,\frac{100\,(ECA - ECA_{no\,trans})\,/\,LA}{ProtConn}
    symbols:
      'ECA_{no\,trans}': "ECA computed without transboundary nodes. 0 without transboundary nodes."
    python: 'tf.conn.protconn(reserves, inner, distance=2000, transboundary=5000, bound=True)["ProtConn_Trans"][0]'
    operator: conn.protconn
    setting: transboundary = 5000

  # impl: protconn.py:317
  - id: protconn_protconn_unprot
    name: "ProtConn[Unprot]"
    level: region
    theme: protected-area
    unit: "% of ProtConn"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of ProtConn due to dispersal between protected areas across unprotected land.
    use: |
      The part that would be lost if the matrix between reserves became impassable.
    formula: |
      ProtConn_{Unprot} = \max(100 - ProtConn_{Prot} - ProtConn_{Trans},\, 0)
    symbols:
      'ProtConn_{Prot}': "share of ProtConn from the area of the nodes"
      'ProtConn_{Trans}': "share from transboundary areas"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn_Unprot"][0]'
    operator: conn.protconn

  # impl: protconn.py:318-320
  - id: protconn_protconn_within
    name: "ProtConn[Within]"
    level: region
    theme: protected-area
    unit: "% of ProtConn"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of ProtConn that comes from within the individual protected areas before they were dissolved (so
      overlapping or touching areas are treated as separate pieces).
    use: |
      Compare with Contig. With one dissolved node it is 100.
    formula: |
      ProtConn_{Within} = \min\!\left(100\,\frac{w_1 w_2}{ProtConn},\, 100\right),\quad w_1 = 100\frac{\sqrt{\sum_k s_k^{2}}}{LA},\; w_2 = \sqrt{\frac{A_{prot}}{\sum_k s_k}}
    symbols:
      's_k': "area of piece \\( k \\) before dissolving (`pieces`)."
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn_Within"][0]'
    operator: conn.protconn

  # impl: protconn.py:321
  - id: protconn_protconn_contig
    name: "ProtConn[Contig]"
    level: region
    theme: protected-area
    unit: "% of ProtConn"
    range: "0 ≤ x ≤ 100"
    what: |
      The share of ProtConn that comes from contiguous protected areas that were merged into one node.
    use: |
      Zero when no protected areas touch or overlap.
    formula: |
      ProtConn_{Contig} = \max(100 - ProtConn_{Within},\, 0)
    symbols:
      'ProtConn_{Within}': "the share of ProtConn from within the individual pieces (the card above)"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn_Contig"][0]'
    operator: conn.protconn

  # impl: protconn.py:322-323
  - id: protconn_protconn_within_land
    name: "ProtConn[Within] as land"
    level: region
