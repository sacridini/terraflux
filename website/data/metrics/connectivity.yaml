    unit: "% of the region"
    range: "0 ≤ x ≤ ProtConn"
    what: |
      ProtConn[Within] expressed as percent of the region rather than of ProtConn.
    use: |
      The same decomposition on the same scale as Prot.
    formula: |
      ProtConn_{Within}^{land} = ProtConn_{Within}\,\frac{ProtConn}{100}
    symbols:
