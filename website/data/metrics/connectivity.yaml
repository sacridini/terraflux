  # impl: graph.py:865-867
  - id: conn_bc
    name: "Betweenness centrality (BC)"
    level: node
    theme: importance
    unit: "none"
    range: "0 ≤ BC ≤ 1"
    what: |
      How often the node lies on the shortest link path between two other nodes (Freeman betweenness), normalised by
      the number of pairs of other nodes. Asked for by name; it is not in the default metric list.
    use: |
      Topological. For graph-theory ranking of stepping stones. Zero for n < 3.
    formula: |
      BC_i = \frac{\sum_{j<k;\, j,k\neq i} \sigma_{jk}(i)/\sigma_{jk}}{(n-1)(n-2)/2}
    symbols:
      '\sigma_{jk}': "number of shortest paths between \\( j \\) and \\( k \\)"
      '\sigma_{jk}(i)': "those through \\( i \\)."
    python: 'top(net.node_importance("BC", distance=1000), "BC")'
    operator: conn.node_importance
    setting: metrics = BC
    refs:
      - "Freeman (1977). A set of measures of centrality based on betweenness. Sociometry 40: 35-41."
      - "Bodin & Saura (2010). Ranking individual habitat patches as connectivity providers: integrating network analysis and patch removal experiments. Ecological Modelling 221: 2393-2405."

  # impl: graph.py:868-870
  - id: conn_dbc_iic
    name: "Betweenness importance for IIC (dBC_IIC)"
    level: node
    theme: importance
    unit: "% of IICnum"
    range: "0 ≤ dBC_IIC ≤ 100"
    what: |
      The part of the IIC numerator that flows over the shortest paths running through the node, in percent. It
      isolates the stepping-stone role of the node.
    use: |
      Compare with the connector part of dIIC; it is the betweenness-based version (Bodin & Saura 2010).
    formula: |
      dBC_{IIC,i} = 100\,\frac{varBC_{IIC,i}}{IIC_{num}}
    symbols:
      'varBC_{IIC,i}': "the betweenness contribution to IIC of node \\(i\\) (the next card)"
      'IIC_{num}': "IIC numerator (the Conefor value, without the unreachable-pair term)"
    python: 'top(net.node_importance("BCIIC", distance=1000), "dBC_IIC")'
    operator: conn.node_importance
    setting: metrics = BCIIC
    refs:
      - "Bodin & Saura (2010). Ranking individual habitat patches as connectivity providers: integrating network analysis and patch removal experiments. Ecological Modelling 221: 2393-2405."

  # impl: graph.py:868-870; node 2 carries 2 x (100 x 20)/3 = 1333.3
  - id: conn_varbc_iic
    name: "Betweenness contribution to IIC (varBC_IIC)"
    level: node
    theme: importance
    unit: "unit of the attribute squared"
    range: "varBC_IIC ≥ 0"
    what: |
      The sum, over ordered pairs of other nodes, of the share of their shortest paths that pass through the node
      times the IIC weight of the pair.
    use: |
      Absolute version of dBC_IIC.
    formula: |
      varBC_{IIC,i} = \sum_{j\neq k;\; j,k\neq i} \frac{\sigma_{jk}(i)}{\sigma_{jk}} \cdot \frac{a_j\, a_k}{1 + nl_{jk}}
    symbols:
      '\sigma_{jk}(i)/\sigma_{jk}': "share of shortest \\( j \\)-\\( k \\) paths through \\( i \\)"
      'nl_{jk}': "links on the shortest path."
    python: 'top(net.node_importance("BCIIC", distance=1000), "varBC_IIC")'
    operator: conn.node_importance
    setting: metrics = BCIIC
    refs:
      - "Bodin & Saura (2010). Ranking individual habitat patches as connectivity providers: integrating network analysis and patch removal experiments. Ecological Modelling 221: 2393-2405."

