  # impl: graph.py:1293-1294
  - id: conn_degree
    name: "Degree or strength"
    level: node
    theme: centrality
    unit: "count (degree) or none (strength)"
    range: "≥ 0"
    what: |
      The number of links of the node (binary graph) or the sum of the edge weights 1/p over its edges (weighted
      graph, when a probability is given).
    use: |
      Local importance only. Note the strength sums lengths, so a larger value means weaker connections.
    formula: |
      k_i = \sum_j l_{ij}, \qquad s_i = \sum_j \frac{1}{p_{ij}}
    symbols:
      'l_{ij}': "link indicator; \\( p_{ij} = P^{d_{ij}/t} \\); in the weighted graph \\( 1/p_{ij} \\) is the length of the edge. Column `degree` (binary) or `strength`."
    python: 'top(net.centrality(1000), "degree")'
    operator: conn.centrality
    refs:
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package, function MK_RMCentrality. doi:10.5281/zenodo.3748095"

  # impl: graph.py:1307-1321
  - id: conn_eigen
    name: "Eigenvector centrality (eigen)"
    level: node
    theme: centrality
    unit: "none"
    range: "0 ≤ eigen ≤ 1"
    what: |
      A node scores high when it is linked to nodes that themselves score high; scaled so the highest node is 1.
    use: |
      Highlights well-connected clusters. Meaningful within one component; isolated nodes get 0.
    formula: |
      A\,v = \lambda_{max}\, v, \qquad eigen_i = v_i / \max_k |v_k|
    symbols:
      'A': "adjacency matrix (weights \\( 1/p_{ij} \\) when weighted)"
      'v': "the leading eigenvector."
    python: 'top(net.centrality(1000), "eigen")'
    operator: conn.centrality

  # impl: graph.py:1288-1292
  - id: conn_close
    name: "Closeness centrality (close)"
    level: node
    theme: centrality
    unit: "none"
    range: "> 0, NaN for a node that reaches no other"
    what: |
      The inverse of the total path length from the node to all nodes it can reach; high for nodes close to the rest.
    use: |
      Only reachable nodes count, so values are not comparable between components of different size.
    formula: |
      close_i = \frac{1}{\sum_{j} \ell_{ij}} \;\text{(binary)},\qquad close_i = \frac{r_i - 1}{\sum_j \ell_{ij}} \;\text{(weighted)}
    symbols:
      '\ell_{ij}': "shortest path length (hops, or the sum of \\( 1/p \\))"
      'r_i': "number of nodes reached including \\( i \\)."
    python: 'top(net.centrality(1000), "close")'
    operator: conn.centrality

  # impl: graph.py:1295
  - id: conn_bwc
    name: "Betweenness centrality of the graph (BWC)"
    level: node
    theme: centrality
    unit: "none"
    range: "≥ 0"
    what: |
      The number of shortest paths between pairs of other nodes that pass through the node (unnormalised), as igraph
      computes it; paths of equal length within 1e-10 share it.
    use: |
      Unlike `BC` of the node importance table it is not normalised.
    formula: |
      BWC_i = \sum_{j<k;\, j,k\neq i} \frac{\sigma_{jk}(i)}{\sigma_{jk}}
    symbols:
      '\sigma_{jk}': "number of shortest paths between \\( j \\) and \\( k \\) (lengths 1 per link, or \\( 1/p \\) when weighted)."
    python: 'top(net.centrality(1000), "BWC")'
    operator: conn.centrality

