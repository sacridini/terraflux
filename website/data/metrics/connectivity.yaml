  # impl: graph.py:956-1055 (_conefor_additions)
  - id: conn_dadd
    name: "Gain of a node to add (d...add, Conefor adding mode)"
    level: node
    theme: importance
    unit: "%"
    range: "can be negative"
    what: |
      With `restoration` flags and `convention="conefor"`, every index of the existing graph gets a gain column for
      each candidate node (dAadd, dNCadd, dNLadd, dHadd, dCCPadd, dLCPadd, dIICadd, dFadd, dAWFadd, dPCadd).
    use: |
      Rates sites for restoration. Candidates are those with restoration flag 0; values for existing nodes are NaN.
    formula: |
      d\mathrm{X}^{add}_c = 100\,\frac{\mathrm{X}_{+c} - \mathrm{X}}{\mathrm{X}}
    symbols:
      '\mathrm{X}': "the index of the existing nodes"
      '\mathrm{X}_{+c}': "the index once candidate \\( c \\) is added with its links to existing nodes. dAadd is \\( 100\\,a_c/A \\) and the flux gains use the added direct probabilities; the rest follow the pattern above."
    python: 'top(tf.HabitatGraph.from_raster(land, habitat=[23, 24, 25], restoration=candidate, convention="conefor", **kw).node_importance("PC", distance=1000, probability=0.5), "dPCadd")'
    operator: conn.node_importance
    setting: metrics = PC (graph restoration column set)
    refs:
      - "Saura & Torné (2009). Conefor Sensinode 2.2: a software package for quantifying the importance of habitat patches for landscape connectivity. Environmental Modelling & Software 24: 135-139. doi:10.1016/j.envsoft.2008.05.005"

  # impl: graph.py:946-954 (line 953)
  - id: conn_dres
    name: "Gain of a node to add (dIICres, dPCres)"
    level: node
    theme: importance
    unit: "%"
    range: "0 ≤ x < 100"
    what: |
      Makurhini's restoration importance: for the nodes flagged 0 (possible additions), the gain of IIC or PC in
      percent of the graph that includes them.
    use: |
      Different normalisation from Conefor's `...add` gains (share of the graph with the node, not of the existing
      graph).
    formula: |
      d\mathrm{X}^{res}_c = 100\,\frac{\Delta_c}{\mathrm{X}_{num} + \Delta_c}
    symbols:
      '\Delta_c': "increase of the numerator of IIC or PC from adding candidate \\( c \\) to the existing nodes"
      '\mathrm{X}_{num}': "numerator of the existing graph."
    python: 'top(tf.HabitatGraph.from_raster(land, habitat=[23, 24, 25], restoration=candidate, **kw).node_importance("PC", distance=1000, probability=0.5), "dPCres")'
    operator: conn.node_importance
    setting: metrics = PC (graph restoration column set)
    refs:
      - "Godínez-Gómez & Correa Ayram (2020). Makurhini: analyzing landscape connectivity. R package. doi:10.5281/zenodo.3748095"

