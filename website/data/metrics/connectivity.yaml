      'ProtConn': "share of the region that is protected and connected"
    python: 'tf.conn.protconn(reserves, region, distance=2000)["ProtConn_Within_land"][0]'
    operator: conn.protconn

  # impl: protconn.py:322-323
  - id: protconn_protconn_contig_land
    name: "ProtConn[Contig] as land"
