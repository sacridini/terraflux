  # impl: extern/terraflux-py/src/terraflux/intactness.py:104-175
  - id: intactness_q
    name: Ecological intactness (Q)
    level: cell
    theme: intactness
    unit: none
    range: "0 to 1"
    aliases: [habitat intactness, plangea intactness, ecoregion intactness]
    what: |
      How intact a cell and its surroundings are, from the human footprint: high when the cell and its neighbours within
      a radius all have a high habitat quality, the near neighbours counting more. The card shows the middle row of the
      toy footprint, from the wild side to the town.
    use: |
      Give `cell_size` in km (or a projected grid). The cells without a footprint value are left out, and at the raster's
      edge the window is the part inside it (plangea leaves the edge cells out and fills them with the mean). With
      `reduction` and `restored`, the footprint is lowered first by the share restored.
    formula: 'Q_i = \frac{\sum_{j} \left(q_i q_j\right)^{z} w_{ij}}{\sum_{j} w_{ij}}, \quad q = e^{-\gamma\, HFI}, \quad w_{ij} = e^{\beta d_{ij}}'
    symbols:
      'HFI': 'the human footprint index of the cell'
      'q': 'the habitat quality, 1 with no footprint'
      '\gamma': '\(-\ln 0.2 / 4\): a footprint of 4 gives a quality of 0.2'
      'd_{ij}': 'the distance between the cells'' centres, in km; the cells \(j\) are those within `radius` cells of \(i\), itself included'
      '\beta': '-0.2 per km'
      'z': '0.5'
    python: 'tf.intactness(hfi, radius=1, cell_size=1.0)[2]'
    operator: restoration.intactness
    setting: 'radius = 1'
    api: terraflux.intactness
    refs:
      - "Beyer, Venter, Grantham & Watson (2020). Substantial losses in ecoregion intactness highlight urgency of globally coordinated action. Conservation Letters 13: e12692. doi:10.1111/conl.12692"

  # impl: extern/terraflux-py/src/terraflux/intactness.py:178-240
  - id: intactness_gradient
    name: Intactness gradient (the benefit of restoring a cell)
    level: cell
    theme: intactness
    unit: intactness per unit restored
    range: "0 or more"
    aliases: [restoration benefit, intactness derivative]
    what: |
      How much the total intactness of the map grows per unit of a cell restored: the derivative of the sum of \(Q\) with
      respect to the share of the cell restored. 0 where the footprint is already 0. The card's cells lose 2 points of
      footprint per unit restored.
    use: |
      The linear benefit of restoration for intactness in a restoration plan. It is the whole derivative, through the
      cell's neighbours too; plangea's changes only the cell's own factor.
    formula: '\frac{\partial \sum_i Q_i}{\partial x_k} = z\,\gamma\, a_k\left(Q_k + q_k^{z}\sum_{i}\frac{q_i^{z}\, w_{ik}}{W_i}\right)'
    symbols:
      'x_k': 'the share of cell \(k\) restored'
      'a_k': 'the footprint it loses per unit restored (`reduction`)'
      'W_i': 'the sum of the weights of cell \(i\), \(\sum_j w_{ij}\)'
    python: 'tf.intactness_gradient(hfi, reduction=2.0, radius=1, cell_size=1.0)[2]'
    operator: restoration.intactness_gradient
    setting: 'radius = 1'
    api: terraflux.intactness_gradient
    refs:
      - "Beyer, Venter, Grantham & Watson (2020). Substantial losses in ecoregion intactness highlight urgency of globally coordinated action. Conservation Letters 13: e12692. doi:10.1111/conl.12692"

  # impl: extern/terraflux-py/src/terraflux/gtn.py:215-380
  - id: gtn_eca
    name: Equivalent connected area (ECA) of the MSPA network
    level: map
    theme: habitat networks
    unit: cells (hectares with the cell size)
    range: "0 to ECA_max"
    aliases: [equivalent connected area, ECA, GTN]
    what: |
      The area of a single core that would be as connected as the network of cores and bridges is. The network's
      components (8-connected groups of MSPA core and bridge cells) add as the root of the sum of their squared core areas:
      only the cores are habitat, the bridges connect them.
    use: |
      Needs an MSPA map; the components depend on its edge width. Give `pixel_size` for hectares.
    formula: 'ECA = \sqrt{\sum_{c} A_c^{2}}'
    symbols:
      'A_c': 'the core area (cells of MSPA''s core) of component \(c\)'
    python: 'tf.gtn_components(mspa).eca_pixels'
    operator: networks.gtn_components
    api: terraflux.gtn_components
    refs:
      - "Saura, Estreguil, Mouton & Rodríguez-Freire (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/gtn.py:215-380
  - id: gtn_eca_max
    name: Largest possible ECA of the MSPA network
    level: map
    theme: habitat networks
    unit: cells
    range: "0 or more"
    aliases: [maximum ECA, total core area]
    what: |
      The ECA if all the core area formed one component: the total core area.
    use: |
      The denominator of the degree of coherence.
    formula: 'ECA_{max} = \sum_{c} A_c'
    symbols:
      'A_c': 'the core area of component \(c\)'
    python: 'tf.gtn_components(mspa).eca_max_pixels'
    operator: networks.gtn_components
    api: terraflux.gtn_components
    refs:
      - "Saura, Estreguil, Mouton & Rodríguez-Freire (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."

  # impl: extern/terraflux-py/src/terraflux/gtn.py:215-380
  - id: gtn_doc
    name: Degree of coherence (DOC) of the MSPA network
    level: map
    theme: habitat networks
    unit: "%"
    range: "more than 0, up to 100"
    aliases: [degree of coherence, coherence, DOC]
    what: |
      The ECA as a share of the total core area: 100 % when all the cores are in one component, low when the habitat is
      split into many unconnected pieces.
    use: |
      It does not depend on the size of the map, so it compares maps; keep the MSPA settings the same.
    formula: 'DOC = 100 \cdot \frac{ECA}{ECA_{max}}'
    symbols:
      'ECA, ECA_{max}': 'the two cards above'
    python: 'tf.gtn_components(mspa).doc'
    operator: networks.gtn_components
    api: terraflux.gtn_components
    refs:
      - "Saura, Estreguil, Mouton & Rodríguez-Freire (2011). Network analysis to assess landscape connectivity trends: application to European forests (1990-2000). Ecological Indicators 11: 407-416."
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/gtn.py:600-650
  - id: gtn_link_dpc
    name: Importance of a link (dPC of a bridge)
    level: link
    theme: habitat networks
    unit: "%"
    range: "0 to 100"
    aliases: [dPC, delta PC, link importance, bridge importance]
    what: |
      The loss of connectivity when a link (an MSPA bridge) is cut: the drop of the numerator of PC, in percent, when the
      link is removed and its component may split. The card shows the three most important links.
    use: |
      Finds the bridges whose loss would split the network. In a network with loops most bridges are 0, since the cores
      stay connected the other way. Only the links of components with at least one link are evaluated. The numerator is the
      sum of squared core areas, not the whole PC.
    formula: 'dPC_l = 100 \cdot \frac{PC_{num} - PC^{(-l)}_{num}}{PC_{num}}, \quad PC_{num} = \sum_{c} A_c^{2}'
    symbols:
      'A_c': 'the core area of component \(c\)'
      'PC^{(-l)}_{num}': 'the same sum once link \(l\) is removed'
    python: 'tf.gtn_importance(mspa).links.nlargest(3, "dpc")[["link_id", "component_id", "pixels", "dpc"]]'
    operator: networks.gtn_importance
    api: terraflux.gtn_importance
    refs:
      - "Saura & Pascual-Hortal (2007). A new habitat availability index to integrate connectivity in landscape conservation planning: comparison with existing indices and application to a case study. Landscape and Urban Planning 83: 91-103."

  # impl: extern/terraflux-py/src/terraflux/gtn.py:652-700
  - id: gtn_node_dpc
    name: Importance of a stepping stone (dPC of a core)
    level: node
    theme: habitat networks
    unit: "%"
    range: "0 to 100"
    aliases: [stepping stone, node importance]
    what: |
      What a core with two links or more does to connect the others: the loss of connectivity among the other cores when
      it is removed, leaving out its own area on purpose. The card shows the three most important cores.
    use: |
      Finds the stepping stones whose loss splits the network. Only cores with at least two linked neighbours are
      evaluated. In the importance map the nodes carry minus their dPC; the table's `dpc` is positive.
    formula: 'dPC_n = 100 \cdot \frac{\left(\sum_{k \ne n} A_k\right)^{2} - \sum_{c^{\prime}} A_{c^{\prime}}^{2}}{PC_{num}}'
    symbols:
      'A_k': 'the area of core \(k\); the first term is the squared core area of the component without core \(n\), all still connected'
      'A_{c^{\prime}}': 'the core area of each component left once core \(n\) is removed'
    python: 'tf.gtn_importance(mspa).nodes.nlargest(3, "dpc")[["node_id", "component_id", "pixels", "degree", "dpc"]]'
    operator: networks.gtn_importance
    api: terraflux.gtn_importance
    refs:
      - "Saura & Pascual-Hortal (2007). A new habitat availability index to integrate connectivity in landscape conservation planning: comparison with existing indices and application to a case study. Landscape and Urban Planning 83: 91-103."

  # impl: extern/terraflux-py/src/terraflux/gtn.py:703-728
  - id: gtn_normalized_importance
    name: Normalised importance of links and cores
    level: link
    theme: habitat networks
    unit: "%"
    range: "0 to 100"
    aliases: [normalized importance, relative dPC]
    what: |
      The dPC of a link (or a core) as a percentage of the largest dPC among the links (or among the cores).
    use: |
      Maps the most important links and cores: those at 99, 95 and 90 % of the largest.
    formula: 'I^{norm} = 100 \cdot \frac{dPC}{\max dPC}'
    symbols:
      '\max dPC': 'the largest dPC among the links, for a link, or among the cores, for a core (0 when that largest is 0)'
    python: 'tf.gtn_importance(mspa).links.nlargest(3, "normalized_importance")[["link_id", "dpc", "normalized_importance"]]'
    operator: networks.gtn_importance
    api: terraflux.gtn_importance
    refs:
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/influence.py:187-240
  - id: influence_object_area
    name: Zones of influence, area of the objects
    level: patch
    theme: zones of influence
    unit: cells
    range: "min_area or more"
    aliases: [object area, zone of influence, influence zones]
    what: |
      The area of each object that has a zone of influence: an 8-connected piece of the foreground of at least `min_area`
      cells, its holes not counted (with `core_buffer`, the foreground within that many cells of its edge left out
      first). The zones are the watershed basins of the distance to the objects.
    use: |
      The pieces smaller than `min_area` are not objects (they are coded 176 in the map).
    formula: 'a_k = \#\{\text{cells of object } k\}, \quad a_k \ge \text{min area}'
    symbols:
      'a_k': 'the area of object \(k\) without its holes (`object_area[k - 1]`)'
    python: 'tf.influence_zones(habitat, min_area=5000).object_area.tolist()'
    operator: distance.influence_zones
    setting: 'min_area = 5000'
    api: terraflux.influence_zones
    refs:
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/influence.py:243-310
  - id: proximity_distance
    name: Proximity of the objects (on the watershed lines)
    level: link
    theme: zones of influence
    unit: 2 × cells
    range: "0 or more"
    aliases: [proximity, gap between objects]
    what: |
      How close neighbouring objects come: on the watershed lines between their zones of influence, twice the distance to
      the nearest object, so the smallest value on a line is the width of the gap between the two objects. The card gives
      the smallest proximity on all the lines (`prox_min`) and the number of line cells with it.
    use: |
      `prox_max` marks the lines below a threshold, the gaps worth closing. Experimental: GuidosToolbox's distance
      transform is not reproduced exactly.
    formula: 'prox = \operatorname{round}\left(2\, d_{obj}\right)'
    symbols:
      'd_{obj}': 'the distance, in cells, from the line cell to the nearest object (a chamfer distance close to the Euclidean); on lines between more than two zones the value is scaled by their number'
    python: |
      p = tf.proximity(habitat, min_area=5000)
      pd.Series({"prox_min": p.prox_min, "cells with it": p.prox_min_count})
    operator: distance.objects_proximity
    setting: 'min_area = 5000'
    api: terraflux.proximity
    refs:
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"

  # impl: extern/terraflux-py/src/terraflux/influence.py:147-155
  - id: proximity_cag
    name: Connected area gain (CAG)
    level: link
    theme: zones of influence
    unit: cells
    range: "0 or more"
    aliases: [CAG, connected area gain]
    what: |
      What joining the objects that meet on a watershed line would gain in connected area: the square root of twice the
      sum of the products of their areas. Two objects of 214 811 and 7 927 cells give 58 358. The card shows the line cells
      with the largest gain.
    use: |
      Ranks the gaps by what closing them would gain; read it with the proximity, which says how wide the gap is.
    formula: 'CAG = \operatorname{round}\left(\sqrt{2 \sum_{i<j} a_i\, a_j}\right)'
    symbols:
      'a_i, a_j': 'the areas of the objects whose zones meet at the line cell'
    python: 'tf.proximity(habitat, min_area=5000).lines.nlargest(3, "cag")[["x", "y", "nbr", "cag", "areas"]]'
    operator: distance.objects_proximity
    api: terraflux.proximity
    refs:
      - "Vogt & Riitters (2017). GuidosToolbox: universal digital image object analysis. European Journal of Remote Sensing 50: 352-361. doi:10.1080/22797254.2017.1330650"
