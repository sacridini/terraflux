family: conservation-indices
title: Conservation planning and habitat networks
order: 140
source: "prioritizr (R), Zonation 5, plangea, GuidosToolbox"
intro: |
  The measures that judge a conservation plan and the habitat it protects: how a prioritization's solution performs
  (prioritizr's `eval_*` functions: cost, boundary, representation of the features, targets met, the importance of each
  selected unit), the priority surfaces of Zonation (the top fraction of a ranking, the comparison of two rankings, the
  impact of a planned land use), the ecological intactness of a human footprint, and the habitat networks and zones of
  influence that GuidosToolbox computes from a map of habitat.

  The cards show their values on several examples of the library, each the smallest that shows the measure:

  - **Serra Verde** (`tf.prioritize.example_data`), an imaginary coastal region of 60 x 90 cells of 1 km with a cost and
    eight species: `problem` is a minimum-set problem with targets of 20 % of each species, `solution` its optimal
    solution (534 cells), `caz` and `abf` two Zonation rankings of the species (core-area and additive benefit).
  - **A toy impact assessment**: two random features on 30 x 40 cells and a planned road along one row, with a footprint
    that destroys everything and a buffer of 3 cells that halves the features (the library's own example).
  - **A toy human footprint** of 5 x 5 cells of 1 km, wild on the left and a town on the right, for intactness.
  - **The habitat map** of `tf.example_data("input")` (1000 x 1000 cells, GuidosToolbox's example), and `mspa` its MSPA
    map, for the networks and the zones of influence.
example: |
  import numpy as np
  import pandas as pd
  import terraflux as tf

  P = tf.prioritize
  # Serra Verde (imaginary, 60 x 90 cells of 1 km): a cost and eight species; a minimum-set problem with 20 % targets
  cost = tf.load_raster(P.example_data("cost"))
  features = tf.load_raster(P.example_data("features"))
  problem = P.problem(cost, features).add_min_set_objective().add_relative_targets(0.2).add_binary_decisions()
  solution = problem.solve()
  caz = P.zonation(features, rule="CAZ1")    # two Zonation rankings of the same species
  abf = P.zonation(features, rule="ABF")

  # a toy impact assessment: two random features on 30 x 40 cells, a road planned along row 15
  species = np.random.default_rng(0).random((2, 30, 40))
  road = np.zeros((30, 40), np.uint16)
  road[15, :] = 1
  scenario = P.ImpactScenario(road, [P.ImpactSource(group=1, source=1, footprint=100, buffers=((3, 50),))])

  # a toy human footprint, 5 x 5 cells of 1 km: wild on the left, a town on the right
  hfi = np.array([[0, 0, 0, 10, 40]] * 5, dtype=float)

  # GuidosToolbox's example habitat map (1000 x 1000 cells) and its MSPA
  habitat = tf.load_raster(tf.example_data("input"))
  mspa = tf.mspa(habitat)
metrics:
  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:140-159
  - id: eval_n
    name: Planning units selected
    level: model
    theme: solution summaries
    unit: planning units
    range: "0 or more"
    aliases: [number of units, n_summary, eval_n_summary]
    what: |
      The number of planning units a solution selects: the sum of its values (1 selected, 0 not; a share of the unit
      with proportion decisions).
    use: |
      It counts units, not area: with units of different sizes, weigh them by area in the cost or the features. With
      zones the table has a row overall and one per zone.
    formula: 'n = \sum_i x_i'
    symbols:
      'x_i': 'the value of the solution for unit \(i\)'
    python: 'P.eval_n_summary(problem, solution)'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_n_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:162-181
  - id: eval_cost
    name: Cost of a solution
    level: model
    theme: solution summaries
    unit: the cost's unit
    range: "0 or more"
    aliases: [cost_summary, eval_cost_summary, total cost]
    what: |
      The total cost of the planning units a solution selects.
    use: |
      The objective of a minimum-set problem: compare it between solutions of the same problem (with and without a
      boundary penalty, say), or against the cost of the units already protected.
    formula: 'C = \sum_i c_i x_i'
    symbols:
      'c_i': 'the cost of unit \(i\)'
      'x_i': 'the value of the solution for it'
    python: 'P.eval_cost_summary(problem, solution)'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_cost_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/cpp/opt/eval.cpp:97-113
  - id: eval_boundary
    name: Boundary length of a solution
    level: model
    theme: solution summaries
    unit: length (the CRS units for raster cells)
    range: "0 or more"
    aliases: [boundary_summary, eval_boundary_summary, perimeter of a solution]
    what: |
      The length of the edges between selected and unselected units, plus a share (`edge_factor`) of the edges of the
      selected units that face no other unit (the edge of the planning region). A compact solution has a short boundary.
    use: |
      Raster cells use their own edges; planning units in a table need the boundary matrix (`data`). With zones, a zones
      matrix weighs the boundaries between zones.
    formula: 'B = \sum_i x_i \left[(T_i - E_i) + e\,E_i\right] - 2\sum_{i<j} b_{ij}\, x_i x_j'
    symbols:
      'T_i': 'the perimeter of unit \(i\) (the diagonal of the boundary matrix)'
      'b_{ij}': 'the length of the edge units \(i\) and \(j\) share'
      'E_i': 'the edge of unit \(i\) that faces no other unit, \(T_i - \sum_{j \ne i} b_{ij}\)'
      'e': '`edge_factor` (0.5 by default)'
    python: 'P.eval_boundary_summary(problem, solution, edge_factor=0.5)'
    operator: prioritize.evaluate
    setting: 'edge_factor = 0.5'
    api: terraflux.prioritize.eval_boundary_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/cpp/opt/eval.cpp:115-143
  - id: eval_connectivity
    name: Connectivity of a solution
    level: model
    theme: solution summaries
    unit: the matrix's unit
    range: "0 or more for a matrix of positive values"
    aliases: [connectivity_summary, asym_connectivity_summary, eval_connectivity_summary]
    what: |
      The connectivity among the selected units: the sum of the connectivity values between every pair of selected units.
      `eval_asym_connectivity_summary` does the same with an asymmetric matrix, over its directed entries. The card's matrix
      is the shared boundary of neighbouring cells times the mean amount of the first species in the two
      ([`tf.prioritize.connectivity_matrix`][terraflux.prioritize.connectivity_matrix]).
    use: |
      Compare solutions of one problem with the same matrix. The library warns when a symmetric matrix is given to the
      asymmetric function, or the other way round.
    formula: 'K = \sum_{i}\sum_{j} d_{ij}\, x_i x_j'
    symbols:
      'd_{ij}': 'the connectivity between units \(i\) and \(j\) (the diagonal counted once); with zones a zones matrix weighs each pair of zones'
      'x_i': 'the value of the solution for unit \(i\)'
    python: 'P.eval_connectivity_summary(problem, solution, P.connectivity_matrix(cost, features[0]))'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_connectivity_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:325-357
  - id: eval_representation
    name: Representation of the features (amount held and its share)
    level: species
    theme: solution summaries
    unit: the feature's unit; proportion
    range: "share 0 to 1"
    aliases: [feature representation summary, held amount, relative_held]
    what: |
      For each feature, its total amount over the planning units and the amount the solution holds, as an amount and as a
      share of the total.
    use: |
      The shares can be above the targets: the cheapest solution that meets every target often holds more of some features
      than they need (here the harpy eagle, at 30 %).
    formula: 'H_f = \sum_i r_{fi}\, x_i, \qquad h_f = \frac{H_f}{T_f}, \quad T_f = \sum_i r_{fi}'
    symbols:
      'r_{fi}': 'the amount of feature \(f\) in unit \(i\)'
      'x_i': 'the value of the solution for unit \(i\)'
      'T_f': 'the total of the feature over all the planning units'
      'h_f': '`relative_held` (0 when the total is 0)'
    python: 'P.eval_feature_representation_summary(problem, solution)[["feature", "total_amount", "absolute_held", "relative_held"]]'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_feature_representation_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:360-420
  - id: eval_target_coverage
    name: Target coverage and shortfall
    level: species
    theme: solution summaries
    unit: the feature's unit; proportion
    range: "shortfall 0 or more"
    aliases: [target_coverage_summary, shortfall, targets met]
    what: |
      For each target, whether the solution meets it (`met`) and by how much it falls short, as an amount and as a share
      of the feature's total.
    use: |
      A solver stopped at a gap can leave a small shortfall: check `met` before reporting. `met` is true when the
      shortfall is below 1e-10.
    formula: 'S = \begin{cases} 0 & H \ge t \\ |t - H| & \text{otherwise} \end{cases}, \qquad S^{rel} = \frac{S}{T_f}'
    symbols:
      'H': 'the amount the solution holds'
      't': 'the target, as an amount; for a target of at most \(t\) the shortfall is 0 when \(H \le t\), for an exact target when the difference is within 1e-10'
      'T_f': 'the total of the feature'
    python: 'P.eval_target_coverage_summary(problem, solution)[["feature", "met", "absolute_target", "absolute_held", "absolute_shortfall"]]'
    operator: prioritize.evaluate
    setting: 'relative_targets = 0.2'
    api: terraflux.prioritize.eval_target_coverage_summary
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:424-461
  - id: eval_extinction_risk
    name: Extinction risk (species-area)
    level: species
    theme: solution summaries
    unit: probability (per feature); features (the sum)
    range: "0 to 1 per feature"
    aliases: [expected species loss, species-area relationship]
    what: |
      The risk of losing each feature by the species-area relationship, from the share of its habitat the solution
      holds; the sum over the features is the expected number of features lost if only the solution remained.
    use: |
      A rough index: the exponent is a general value, not one fitted to the features. The last row of the table is the
      expected loss.
    formula: 'R_f = 1 - h_f^{\,z}, \qquad R = \sum_f R_f'
    symbols:
      'h_f': 'the share of feature \(f\) held (`relative_held`, kept within 0 and 1)'
      'z': 'the exponent of the species-area curve (`extinction_z`, 0.25 by default; one value or one per feature)'
    python: 'P.eval_extinction_risk(problem, solution, z=0.25)'
    operator: prioritize.evaluate
    setting: 'extinction_z = 0.25'
    api: terraflux.prioritize.eval_extinction_risk
    refs:
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/cpp/opt/eval.cpp:225-285
  - id: eval_ferrier
    name: Ferrier irreplaceability of the selected units
    level: cell
    theme: importance of units
    unit: score
    range: "0 to 1"
    aliases: [irreplaceability, ferrier importance, eval_ferrier_importance]
    what: |
      How much each selected unit is needed to meet each feature's target, and in total: the chance that the target fails
      without it, when the rest of a portfolio of the same size is drawn at random (a normal approximation). A band per
      feature and a `total`; 0 for the units not selected. The card summarises the total.
    use: |
      It needs one target of "at least" per feature and amounts of 0 or more. With many units each one's chance is small,
      so the values are small; compare them between units, not with 1.
    formula: 'F_{fi} = \frac{(P^{in}_{fi} - P^{rem}_{fi})\, w_{in}}{P^{in}_{fi} w_{in} + P^{ex}_{fi} w_{ex}}, \qquad F_{i} = \sum_f F_{fi}'
    symbols:
      'P^{in}_{fi}': 'the probability that the target of \(f\) is met when unit \(i\) is in the portfolio; \(P^{rem}_{fi}\) when it is taken out, \(P^{ex}_{fi}\) when it is not selected. Each is the normal tail of the mean and variance of the other units'' amounts, the standard deviation adjusted for the size of the portfolio'
      'w_{in}': 'the share of the units selected, \(s / N\); \(w_{ex} = 1 - w_{in}\)'
    python: 'P.eval_ferrier_importance(problem, solution).sel(band="total")'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_ferrier_importance
    refs:
      - "Ferrier, Pressey & Barrett (2000). A new predictor of the irreplaceability of areas for achieving a conservation goal, its application to real-world planning, and a research agenda for further refinement. Biological Conservation 93: 303-325."

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:518-562
  - id: eval_rare_richness
    name: Rarity-weighted richness of the selected units
    level: cell
    theme: importance of units
    unit: score (rescaled to 0.01-1)
    range: "0, or 0.01 to 1"
    aliases: [rarity weighted richness, RWR]
    what: |
      A score for each selected unit: the sum over the features of the unit's amount relative to the feature's largest
      amount and to its total, so that units with much of a rare feature score high. 0 for the units not selected.
    use: |
      A quick measure of each unit's contribution; it ignores the targets. `rescale=True` (the default) rescales the
      scores of the selected units to 0.01-1.
    formula: 'RWR_i = \sum_f \frac{r_{fi}}{\max_k r_{fk}\; T_f}'
    symbols:
      'r_{fi}': 'the amount of feature \(f\) in unit \(i\)'
      '\max_k r_{fk}': 'its largest amount in a unit'
      'T_f': 'its total'
    python: 'P.eval_rare_richness_importance(problem, solution)'
    operator: prioritize.evaluate
    api: terraflux.prioritize.eval_rare_richness_importance
    refs:
      - "Albuquerque & Beier (2015). Rarity-weighted richness: a simple and reliable alternative to integer programming and heuristic algorithms for minimum set and maximum coverage problems in conservation planning. PLoS ONE 10: e0119905. doi:10.1371/journal.pone.0119905"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:565-662
  - id: eval_replacement
    name: Replacement cost of the selected units
    level: cell
    theme: importance of units
    unit: objective units (rescaled to 0.01-1)
    range: "0 or more, or infinite"
    aliases: [replacement importance, eval_replacement_importance]
    what: |
      How much the objective worsens when a selected unit is forbidden and the problem is solved again with the other
      selected units kept: the cost of replacing it. Infinite when nothing can replace the unit (a target cannot be met
      without it).
    use: |
      One solve per selected unit (534 on the example, in parallel; a fraction of a second here, but it grows with the
      size of the problem). Not defined for a solution that does not meet the problem's constraints. `rescale=True`
      rescales the finite values above 0 to 0.01-1.
    formula: 'RC_i = z_i - z^{*}'
    symbols:
      'z^{*}': 'the objective of the solution (its selected units locked in)'
      'z_i': 'the objective of the solve with unit \(i\) set to 0 (the sign is turned for a maximisation)'
    python: 'P.eval_replacement_importance(problem, solution)'
    operator: prioritize.evaluate
    setting: 'replacement = true'
    api: terraflux.prioritize.eval_replacement_importance
    refs:
      - "Cabeza & Moilanen (2006). Replacement cost: a practical measure of site value for cost-effective reserve planning. Biological Conservation 132: 336-342."

  # impl: extern/terraflux-py/src/terraflux/prioritize/_milp_eval.py:665-770
  - id: eval_rank
    name: Rank importance of the selected units
    level: cell
    theme: importance of units
    unit: score (rescaled to 0.01-1)
    range: "0, or 0.01 to 1"
    aliases: [rank importance, eval_rank_importance]
    what: |
      How early a selected unit enters the solution when it is built with growing budgets: the problem is solved with
      increasing budgets (its objective turned into a minimum shortfall), allowed only the solution's units and keeping
      the units of the step before. Units that enter at the first budget rank highest. The call returns the ranks and a
      table of the budgets; the card shows the table.
    use: |
      A priority order inside a solution: what to protect first. More budgets give a finer order, at one solve each.
    formula: 'rank_i = \operatorname{rescale}_{[0.01,\,1]}\left(n - k_i + 1\right)'
    symbols:
      'n': 'the number of budgets (`rank`), evenly spaced between the cost of the locked-in units and the cost of the solution (or the `budgets` given)'
      'k_i': 'the first budget step (1 to \(n\)) at which unit \(i\) is selected'
    python: 'P.eval_rank_importance(problem, solution, n=4)[1]'
    operator: prioritize.evaluate
    setting: 'rank = 4'
    api: terraflux.prioritize.eval_rank_importance
    refs:
      - "Jung et al. (2021). Areas of global importance for conserving terrestrial biodiversity, carbon and water. Nature Ecology & Evolution 5: 1499-1509. doi:10.1038/s41559-021-01528-7"
      - "Hanson, Schuster, Strimas-Mackey, Morrell, Edwards, Arcese, Bennett & Possingham (2025). Systematic conservation prioritization with the prioritizr R package. Conservation Biology. doi:10.1111/cobi.14376"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_landscape.py:77-101
  - id: position_rank
    name: Rank by position (Zonation's rank)
    level: cell
    theme: priority surfaces
    unit: rank, 0 to 1
    range: "0 to 1 (exclusive)"
    aliases: [Zonation rank, priority rank, percentile rank]
    what: |
      The rank of each cell of a surface by its position: the \(i\)-th lowest of the \(N\) cells with a value gets
      \(i/N\), in single precision, so that a top fraction is the same as Zonation's. Ties keep the order of the cells;
      cells without a value stay without one. The card ranks a 2 x 2 grid with a tie and a missing cell.
    use: |
      Use it to turn any priority surface (an importance, a selection frequency) into Zonation's scale, and to take a top
      fraction \(f\): the cells ranked at least \(1 - f\).
    formula: '\rho_{(i)} = \operatorname{float32}\left(\frac{i}{N}\right), \quad i = 0, \ldots, N - 1'
    symbols:
      'i': 'the position of the cell in the ascending order of the values (ties: the earlier cell first)'
      'N': 'the number of cells with a value'
    python: 'P.position_rank(np.array([[3.0, 1.0], [np.nan, 1.0]])).ravel()'
    api: terraflux.prioritize.position_rank
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_landscape.py:157-250
  - id: lsi_area
    name: Landscape identification (areas of the top fraction)
    level: region
    theme: priority surfaces
    unit: cells; the surface's, the cost's and the features' units
    range: "areas of min_size cells or more"
    aliases: [LSI, landscape identification, area statistics of separate areas]
    what: |
      The separate areas of the top fraction of a priority surface and what each holds: its cells, the mean value of the
      surface, its cost and the amount of every feature with its share of the feature's total. The cells are ranked as
      Zonation does, so the areas are Zonation's area statistics of separate areas. The card takes the top 10 % of the
      core-area ranking.
    use: |
      Use it to turn a ranking into candidate sites. Areas are 8-connected (or 4) groups of top cells; `min_size` drops
      the small ones and `merge_distance` merges areas that many cells apart.
    formula: 'A = \{i : \rho_i \ge 1 - f\}'
    symbols:
      '\rho_i': 'the rank by position of cell \(i\) (the card above)'
      'f': '`top_fraction`'
    python: 'P.eval_landscape_identification(caz, 0.1, min_size=5, problem=problem).table[["area", "cells", "mean_value", "cost", "jaguar_share"]]'
    operator: prioritize.zonation
    setting: 'area_statistics = [0.9, 1.0, 5]'
    api: terraflux.prioritize.eval_landscape_identification
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_landscape.py:286-345
  - id: lsc_jaccard
    name: Landscape comparison (Jaccard index of the top fractions)
    level: model
    theme: priority surfaces
    unit: none
    range: "0 to 1"
    aliases: [LSC, solution comparison, overlap of top fractions]
    what: |
      How much the top fractions of two priority surfaces overlap: the cells in both over the cells in either, at several
      fractions, on the cells with a value in both. The table also counts the cells of both, of only one and of neither,
      and the share of the first's top cells that the second has (`share_of_a_in_b`).
    use: |
      Compare two rankings (two Zonation rules, with and without a cost) at the fractions you will act on: they often agree
      on the best few percent and differ further down, or the other way round.
    formula: 'J_f = \frac{|A_f \cap B_f|}{|A_f \cup B_f|}'
    symbols:
      'A_f, B_f': 'the cells in the top fraction \(f\) of the two surfaces, by Zonation''s rule'
    python: 'P.eval_landscape_comparison(caz, abf, fractions=[0.1, 0.3]).table[["fraction", "both", "only_a", "only_b", "jaccard"]]'
    api: terraflux.prioritize.eval_landscape_comparison
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_impacts.py:569-579
  - id: impact_area
    name: Impact, area affected
    level: species
    theme: impacts
    unit: the area unit (cells × area_factor)
    range: "0 or more"
    aliases: [affected area, impact area]
    what: |
      The area of the cells where the feature is present and an impact reaches, by area, impact group, source and zone
      (0 the footprint, then the buffers), in the area unit of the scenario (a cell's area is `area_factor`). On the toy
      road, 40 cells under the road and 240 in its buffer of 3 cells.
    use: |
      It is the `cells` column of the impact table, times `area_factor` in the files Zonation writes.
    formula: 'A = a_{cell} \cdot \#\{i : v_i > 0,\; m_i < 1\}'
    symbols:
      'v_i': 'the value of the feature in cell \(i\) (positive: present)'
      'm_i': 'the share the impact zones covering the cell leave, \(\prod_z (1 - s_z)\), with \(s_z\) the loss of the footprint or of the buffer'
      'a_{cell}': '`area_factor`'
    python: 'P.zonation(species, impact_groups=[1, -1], impact=scenario).impacts["zones"][["feature", "zone", "cells"]]'
    operator: prioritize.zonation
    setting: 'impact_groups = [1, -1]'
    api: terraflux.prioritize.ImpactScenario
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_impacts.py:569-579
  - id: impact_fractional_distribution
    name: Impact, share of the distribution exposed
    level: species
    theme: impacts
    unit: proportion of the feature
    range: "0 to 1"
    aliases: [fractional_distribution, exposed share]
    what: |
      The share of the feature's whole distribution that lies in the cells an impact reaches (its footprint or a
      buffer), whatever the loss there.
    use: |
      How much of the feature is exposed, not how much is lost (the next card).
    formula: 'D = \sum_{i \in Z} \frac{v_i}{\sum_k v_k}'
    symbols:
      'v_i': 'the value of the feature in cell \(i\)'
      'Z': 'the cells of the zone that the impact reaches (\(m_i < 1\), \(v_i > 0\))'
    python: 'P.zonation(species, impact_groups=[1, -1], impact=scenario).impacts["zones"][["feature", "zone", "distribution"]]'
    operator: prioritize.zonation
    setting: 'impact_groups = [1, -1]'
    api: terraflux.prioritize.ImpactScenario
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_impacts.py:496-516, 569-579
  - id: impact_fractional_loss
    name: Impact, share of the distribution lost
    level: species
    theme: impacts
    unit: proportion of the feature
    range: "0 to 1"
    aliases: [fractional_loss, loss of distribution]
    what: |
      The share of the feature's whole distribution that the impact destroys: the exposed distribution times the loss in
      each cell. On the toy road the footprint (100 % loss) loses all it exposes, the buffer (50 %) half.
    use: |
      The headline number of an impact assessment; the share that remains is 1 minus it.
    formula: 'L = \sum_{i \in Z} (1 - m_i)\,\frac{v_i}{\sum_k v_k}'
    symbols:
      'm_i': 'the share of the feature the impact zones leave in cell \(i\) (1 for no impact)'
      'v_i': 'the value of the feature in the cell'
    python: 'P.zonation(species, impact_groups=[1, -1], impact=scenario).impacts["zones"][["feature", "zone", "loss"]]'
    operator: prioritize.zonation
    setting: 'impact_groups = [1, -1]'
    api: terraflux.prioritize.ImpactScenario
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

  # impl: extern/terraflux-py/src/terraflux/prioritize/_impacts.py:577-578
  - id: impact_absolute_distribution
    name: Impact, distribution exposed in the feature's units
    level: species
    theme: impacts
    unit: the feature's unit (impact_unit)
    range: "0 or more"
    aliases: [absolute_distribution]
    what: |
      The exposed distribution in the feature's own units: its share times the sum of the feature's values. Zonation writes
      it to its impact files; in Python it is the share of the impact table times the feature's sum (`dsum` of the
      result's `features`), as the card computes it.
    use: |
      When the feature's values are in a unit that means something (individuals, hectares, tonnes of carbon).
    formula: 'D_{abs} = D \cdot \sum_k v^{raw}_k'
    symbols:
      'D': 'the share of the distribution exposed'
      '\sum_k v^{raw}_k': 'the sum of the feature''s values before they are normalised'
    python: |
      res = P.zonation(species, impact_groups=[1, -1], impact=scenario)
      z = res.impacts["zones"]
      z.assign(absolute=z["distribution"] * res.features["dsum"].to_numpy()[z["feature"]])[["feature", "zone", "absolute"]]
    operator: prioritize.zonation
    setting: 'impact_groups = [1, -1]'
    api: terraflux.prioritize.ImpactScenario
    refs:
      - "Moilanen, Lehtinen, Kohonen, Jalkanen, Virtanen & Kujala (2022). Novel methods for spatial prioritization with applications in conservation, land use planning and ecological impact avoidance. Methods in Ecology and Evolution 13: 1062-1072. doi:10.1111/2041-210X.13819"

