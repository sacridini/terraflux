# The website (website/) built and published on GitHub Pages at every push to main that changes it, and after every
# release (release.yml runs it), its downloads those of the latest release.
# Pages are enabled with "GitHub Actions" as the source (Settings > Pages), and the repository variable PAGES_ENABLED
# set to true (Settings > Secrets and variables > Actions > Variables): without it the site is only built (and
# checked).
name: website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml", "extern/terraflux-py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the Python library (extern/terraflux-py, a public repository): its API reference and changelog are built into
      # the site. .gitmodules gives it by SSH (git@github.com:); the checkout action rewrites that to https for
      # the submodules it fetches (release.yml relies on the same), so no key or git config is needed here
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      # the downloads: the latest release published (none: the site says the first one is on its way)
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          echo "latest release: ${tag:-none}"
          echo "TERRAFLUX_RELEASE=$tag" >> "$GITHUB_ENV"
          if [ -n "$tag" ]; then
            {
              echo "TERRAFLUX_RELEASE_FILES<<EOF"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi
      # the operators' and commands' data and the figures are committed: no Rust build is needed here
      # the Python API reference is made again from the submodule (griffe reads the sources, nothing is built or
      # imported); data/python_api.json is committed too, so a build without the submodule still works, and a
      # difference here means the submodule moved without the file being refreshed
      - name: Python API reference
        run: |
          python website/tools/refresh_python_api.py
          git diff --quiet -- website/data/python_api.json || echo "::warning::website/data/python_api.json was out of date with extern/terraflux-py: run website/tools/refresh_python_api.py and commit it"
      - run: python website/build.py --clean
      # the apt repository (/terraflux/apt/): the latest release's .deb (only that one) with its indexes, the Release
      # file signed with the GPG key of the secret APT_GPG_KEY (armored private key, no passphrase). The public
      # keyring is website/static/apt/. Without the secret (or a release) the site goes out without the repository
      - name: apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "::warning::APT_GPG_KEY secret not set: the site is published without the apt repository"
            exit 0
          fi
          if [ -z "$TERRAFLUX_RELEASE" ]; then
            echo "::warning::no release yet: the site is published without the apt repository"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          apt="$GITHUB_WORKSPACE/website/dist/apt"
          pool="$apt/pool/main/t/terraflux"
          dist="$apt/dists/stable"
          mkdir -p "$pool" "$dist/main/binary-amd64"
          gh release download "$TERRAFLUX_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir "$pool"
          ls -l "$pool"
          cd "$apt"
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k -f dists/stable/main/binary-amd64/Packages
          test -s dists/stable/main/binary-amd64/Packages
          cd "$dist"
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Terraflux \
            -o APT::FTPArchive::Release::Label=Terraflux \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release . > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" Release
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import
          fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "signing with $fpr"
          gpg --batch --yes --pinentry-mode loopback --default-key "$fpr" --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$fpr" --armor --detach-sign -o Release.gpg Release
          rm -rf "$GNUPGHOME"
          ls -l "$dist"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
