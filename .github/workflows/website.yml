# The website (website/) built and published on GitHub Pages at every push to main that changes it.
# Pages must be enabled with "GitHub Actions" as the source (Settings > Pages), and the repository variable
# PAGES_ENABLED set to true (Settings > Secrets and variables > Actions > Variables): until then the site is built
# (and checked) at every push, not published.
name: website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      # the operators' and commands' data and the figures are committed: no Rust build is needed here
      - run: python website/build.py --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
