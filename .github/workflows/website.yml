# The website (website/) built and published on GitHub Pages at every push to main that changes it, and after every
# release (release.yml runs it), its downloads those of the latest release.
# Pages are enabled with "GitHub Actions" as the source (Settings > Pages), and the repository variable PAGES_ENABLED
# set to true (Settings > Secrets and variables > Actions > Variables): without it the site is only built (and
# checked).
name: website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      # the downloads: the latest release published (none: the site says the first one is on its way)
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          echo "latest release: ${tag:-none}"
          echo "TERRAFLUX_RELEASE=$tag" >> "$GITHUB_ENV"
          if [ -n "$tag" ]; then
            {
              echo "TERRAFLUX_RELEASE_FILES<<EOF"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi
      # the operators' and commands' data and the figures are committed: no Rust build is needed here
      - run: python website/build.py --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
