[package]
name = "terraflux-ops"
description = "The operators of Terraflux's model graph: land change analysis, potential, demand and allocation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# the integration tests listed below (tests/main.rs gathers most into one program)
autotests = false

[dependencies]
cxx.workspace = true
rayon.workspace = true
wasmi = "0.51"
wat = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
terraflux-gdal = { path = "../gdal" }
terraflux-graph = { path = "../graph" }
terraflux-ls-sys = { path = "../ls-sys" }
terraflux-raster = { path = "../raster" }
h3o = { version = "0.11", features = ["geo"] }
smallvec = "1"
libloading = "0.8"
# the matrix products of kernel densities (sdm.bias_surface), AVX2 and FMA chosen when the program runs
matrixmultiply = "0.3"
geo = { version = "0.33", default-features = false }
regex = "1"
flate2.workspace = true
robust = "1.2"
# the labels of objects too big for memory, kept in a mapped temporary file
memmap2 = "0.9"
rstar = "0.12"
sha2 = "0.11"
# the STAC catalogues' searches (data.stac)
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
hex = "0.4"
# The library's reference tables of Zonation are xz-compressed in its .npz files
lzma-rs = "0.3"

[[test]]
name = "ops"
path = "tests/main.rs"

[[test]]
name = "circuit_ini"
path = "tests/circuit_ini.rs"

[[test]]
name = "rasterize_grid"
path = "tests/rasterize_grid.rs"
