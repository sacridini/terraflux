[package]
name = "terraflux-cli"
description = "Terraflux on the command line: run, check and create land change models"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "terraflux"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
terraflux-app = { path = "../app" }
terraflux-dist = { path = "../dist" }
terraflux-exec = { path = "../exec" }
terraflux-graph = { path = "../graph" }
terraflux-ops = { path = "../ops" }
terraflux-raster = { path = "../raster" }
