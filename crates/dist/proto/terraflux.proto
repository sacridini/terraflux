// The protocol between Terraflux's coordinator, its workers and its clients.
//
// Workers only call the coordinator (they need no open port): they register, ask for tasks (a long poll),
// fetch the data of a task by hash, send heartbeats while they run it and send its result. Clients store the
// data, submit jobs (a model and the overrides of each of its tasks) and read their status and results.
// Structured values (models, overrides, evaluations, metrics) travel as JSON.
//
// A job of kind "tiles" is a pass of the tiled engine: its payload is the pass (where the maps are, what to
// compute), each task's payload the tiles it computes, each result's payload the tiles' part (all encoded by
// the engine). Its workers read and write the maps on storage they share.
syntax = "proto3";
package terraflux.v1;

service Coordinator {
  rpc Register(WorkerHello) returns (WorkerId);
  rpc NextTask(TaskRequest) returns (TaskAssignment);
  rpc GetBlob(BlobId) returns (Blob);
  rpc Heartbeat(WorkerId) returns (Ack);
  rpc Complete(TaskResult) returns (Ack);

  rpc PutBlob(Blob) returns (BlobId);
  rpc HasBlob(BlobId) returns (Ack);
  rpc Submit(JobSpec) returns (JobId);
  rpc Status(JobId) returns (JobStatus);
  // The status once every task is done or failed (or after wait_ms).
  rpc Wait(WaitRequest) returns (JobStatus);
  // Drop a job and its results.
  rpc Forget(JobId) returns (Ack);
  rpc Results(JobId) returns (JobResults);
  rpc Workers(Empty) returns (WorkerList);
}

message Empty {}
message Ack { bool ok = 1; }

message WorkerHello { string name = 1; uint32 threads = 2; string version = 3; }
message WorkerId { string id = 1; }
message TaskRequest { string worker = 1; uint32 wait_ms = 2; }

// task_id empty: no task now.
message TaskAssignment {
  string task_id = 1;
  string job_id = 2;
  string model_json = 3;
  string overrides_json = 4;
  string evaluation_json = 5;
  bool return_files = 6;
  string kind = 7;
  bytes payload = 8;
  bytes task_payload = 9;
}

message BlobId { string hash = 1; }
message Blob { string hash = 1; bytes data = 2; }

message OutputFile { string name = 1; bytes data = 2; }
message TaskResult {
  string task_id = 1;
  string worker = 2;
  bool ok = 3;
  string error = 4;
  string metrics_json = 5;
  repeated OutputFile files = 6;
  double seconds = 7;
  repeated string warnings = 8;
  string label = 9;
  bytes payload = 10;
}

message TaskSpec { string label = 1; string overrides_json = 2; bytes payload = 3; }
message JobSpec {
  string name = 1;
  string model_json = 2;
  repeated TaskSpec tasks = 3;
  bool return_files = 4;
  string evaluation_json = 5;
  string kind = 6;
  bytes payload = 7;
}
message JobId { string id = 1; }
message WaitRequest { string id = 1; uint32 wait_ms = 2; }
message JobStatus {
  string id = 1;
  uint32 total = 2;
  uint32 done = 3;
  uint32 failed = 4;
  uint32 running = 5;
  repeated string errors = 6;
}
message JobResults { repeated TaskResult results = 1; }

message WorkerState {
  string id = 1;
  string name = 2;
  uint32 threads = 3;
  uint32 done = 4;
  string task = 5;
  double seen_seconds_ago = 6;
}
message WorkerList { repeated WorkerState workers = 1; }
