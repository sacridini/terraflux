// The protocol between Terraflux's coordinator, its workers and its clients.
//
// Workers only call the coordinator (they need no open port): they register, ask for tasks (a long poll),
// fetch the data of a task by hash, send heartbeats while they run it, send its files (as blobs) and its result.
// Clients store the data, submit jobs (a model and the overrides of each of its tasks), read their status and
// results and fetch the results' files. Workers and clients must be of the coordinator's version (the same
// engine everywhere: the same maps). Structured values (models, overrides, evaluations, metrics) travel as JSON;
// files travel in chunks.
//
// A job of kind "tiles" is a pass of the tiled engine: its payload is the pass (where the maps are, what to
// compute), each task's payload the tiles it computes, each result's payload the tiles' part (all encoded by
// the engine). Its workers read and write the maps on storage they share.
syntax = "proto3";
package terraflux.v1;

service Coordinator {
  // The coordinator's version, to be checked by clients.
  rpc Hello(Empty) returns (CoordinatorHello);
  rpc Register(WorkerHello) returns (WorkerId);
  rpc NextTask(TaskRequest) returns (TaskAssignment);
  rpc GetBlob(BlobId) returns (stream Chunk);
  rpc Heartbeat(WorkerId) returns (Ack);
  rpc Complete(TaskResult) returns (Ack);

  rpc PutBlob(stream Chunk) returns (BlobId);
  rpc HasBlob(BlobId) returns (Ack);
  rpc Submit(JobSpec) returns (JobId);
  rpc Status(JobId) returns (JobStatus);
  // The status once every task is done or failed (or after wait_ms).
  rpc Wait(WaitRequest) returns (JobStatus);
  // Drop a job, its results and their files.
  rpc Forget(JobId) returns (Ack);
  rpc Results(JobId) returns (JobResults);
  rpc Jobs(Empty) returns (JobList);
  rpc Workers(Empty) returns (WorkerList);
}

message Empty {}
message Ack { bool ok = 1; }

// proof: with a pairing code, the HMAC of the coordinator's certificate made with the code's key.
message CoordinatorHello { string version = 1; bytes proof = 2; }

message WorkerHello { string name = 1; uint32 threads = 2; string version = 3; }
message WorkerId { string id = 1; }
message TaskRequest { string worker = 1; uint32 wait_ms = 2; }

// task_id empty: no task now.
message TaskAssignment {
  string task_id = 1;
  string job_id = 2;
  string model_json = 3;
  string overrides_json = 4;
  string evaluation_json = 5;
  bool return_files = 6;
  string kind = 7;
  bytes payload = 8;
  bytes task_payload = 9;
}

message BlobId { string hash = 1; }
// A piece of a blob: the first one of a blob sent says its hash (and size, when known).
message Chunk { string hash = 1; bytes data = 2; uint64 size = 3; }

// A file of a task's result: a blob of the coordinator.
message OutputFile { string name = 1; string hash = 2; uint64 size = 3; }
message TaskResult {
  string task_id = 1;
  string worker = 2;
  bool ok = 3;
  string error = 4;
  string metrics_json = 5;
  repeated OutputFile files = 6;
  double seconds = 7;
  repeated string warnings = 8;
  string label = 9;
  bytes payload = 10;
}

message TaskSpec { string label = 1; string overrides_json = 2; bytes payload = 3; }
message JobSpec {
  string name = 1;
  string model_json = 2;
  repeated TaskSpec tasks = 3;
  bool return_files = 4;
  string evaluation_json = 5;
  string kind = 6;
  bytes payload = 7;
}
message JobId { string id = 1; }
message WaitRequest { string id = 1; uint32 wait_ms = 2; }
message JobStatus {
  string id = 1;
  uint32 total = 2;
  uint32 done = 3;
  uint32 failed = 4;
  uint32 running = 5;
  repeated string errors = 6;
  string name = 7;
  string kind = 8;
  // When it was submitted (seconds since 1970).
  uint64 submitted = 9;
}
message JobResults { repeated TaskResult results = 1; }
message JobList { repeated JobStatus jobs = 1; }

message WorkerState {
  string id = 1;
  string name = 2;
  uint32 threads = 3;
  uint32 done = 4;
  string task = 5;
  double seen_seconds_ago = 6;
  string version = 7;
}
message WorkerList { repeated WorkerState workers = 1; }

// The coordinator's state kept on disk: its jobs, their tasks and results (the workers register again).
message SavedTask {
  string label = 1;
  string overrides_json = 2;
  bytes payload = 3;
  // 0 pending, 1 done, 2 failed (a task running when the coordinator stopped is pending again).
  uint32 state = 4;
  uint32 attempts = 5;
  TaskResult result = 6;
}
message SavedJob {
  string id = 1;
  string name = 2;
  string kind = 3;
  bytes payload = 4;
  string model_json = 5;
  string evaluation_json = 6;
  bool return_files = 7;
  repeated SavedTask tasks = 8;
  repeated string errors = 9;
  uint64 submitted = 10;
}
message SavedState { repeated SavedJob jobs = 1; uint64 next = 2; }
