[package]
name = "terraflux-ls-sys"
description = "Landschaft's C++ simulation kernels for Terraflux (cxx bridge)"
# A version of its own, not the workspace's: cargo puts the version in the hash of a build, so with the
# workspace's every release built landschaft's C++ again (minutes, and 1.3 GB more in target/ each time).
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
links = "landschaft"

[dependencies]
cxx.workspace = true
rayon.workspace = true

[build-dependencies]
cmake.workspace = true
cxx-build.workspace = true
