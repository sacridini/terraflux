[package]
name = "terraflux-exec"
description = "Runs Terraflux models: reads the inputs, runs the graph, writes the outputs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# the integration tests listed below (tests/main.rs gathers most into one program)
autotests = false

[dependencies]
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
terraflux-gdal = { path = "../gdal" }
terraflux-graph = { path = "../graph" }
terraflux-ops = { path = "../ops" }
terraflux-raster = { path = "../raster" }

[[test]]
name = "exec"
path = "tests/main.rs"
