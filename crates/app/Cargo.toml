[package]
name = "terraflux-app"
description = "Terraflux's application: guided models, live maps, charts and validation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# the integration tests listed below (tests/main.rs gathers most into one program)
autotests = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui_dock = { version = "0.21", features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui = "0.36"
egui_plot = "0.37"
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
terraflux-dist = { path = "../dist" }
terraflux-exec = { path = "../exec" }
terraflux-gdal = { path = "../gdal" }
terraflux-graph = { path = "../graph" }
terraflux-ops = { path = "../ops" }
terraflux-raster = { path = "../raster" }
tiny-skia = "0.12"
# the images of the PDF reports, deflated
miniz_oxide = "0.8"
# the updates: the installer downloaded checked against the release's checksums
sha2 = "0.11"
hex = "0.4"
rstar = "0.12"
# the animations of a simulation's steps (GIF), their captions drawn in the application's font
gif = "0.14"
ab_glyph = "0.2"
# the assistant's chat models: their APIs over HTTPS (the system's certificates trusted too)
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

# the keys of the assistant's chat models, in the system's store of credentials
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "app"
path = "tests/main.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"

[[test]]
name = "fit"
path = "tests/fit.rs"

[[test]]
name = "readme_images"
path = "tests/readme_images.rs"
